    <script>
        const allQuestions = [
            {
                question: "Según la definición de Sartori adoptada por Malamud, ¿cuál es el elemento distintivo de un partido político?",
                options: ["Su ideología específica", "La lucha por el poder a través de las elecciones", "Su composición social", "Sus valores morales"],
                answer: 1,
                explanation: "Sartori define un partido político como cualquier grupo político identificado con una etiqueta oficial que presenta candidatos a elecciones y puede obtener cargos públicos, centrándose en la lucha electoral por el poder."
            },
            {
                question: "¿Qué significa que un partido tenga una 'etiqueta oficial' según Sartori?",
                options: ["Que es muy antiguo", "Su reconocimiento legal y nombre identificatorio", "Que tiene una ideología clara", "Que es financiado por el Estado"],
                answer: 1,
                explanation: "La 'etiqueta oficial' se refiere al nombre del partido y su reconocimiento legal, que le permite presentarse a elecciones y ser identificado formalmente."
            },
            {
                question: "El Reform Act de 1832 en Inglaterra es considerado:",
                options: ["El fin de la monarquía", "El acta de nacimiento formal de los partidos modernos", "El inicio del parlamentarismo", "La primera constitución británica"],
                answer: 1,
                explanation: "Según Malamud, el Reform Act de 1832 marcó la transición de asociaciones pre-partidarias a formas contemporáneas de partidos políticos."
            },
            {
                question: "Según las teorías institucionales de Ostrogorski y Duverger, los partidos se clasifican en:",
                options: ["De izquierda y derecha", "Grandes y pequeños", "De creación interna y externa", "Antiguos y modernos"],
                answer: 2,
                explanation: "Esta clasificación distingue entre partidos que nacen dentro del parlamento (creación interna) y aquellos que surgen desde la sociedad (creación externa)."
            },
            {
                question: "Un ejemplo de partido de 'creación interna' sería:",
                options: ["El Partido Laborista inglés", "El Partido Conservador inglés", "Los partidos socialistas europeos", "Los partidos ecologistas"],
                answer: 1,
                explanation: "El Partido Conservador inglés nació dentro del parlamento a partir de grupos parlamentarios existentes, mientras que el Laborista surgió desde los sindicatos (creación externa)."
            },
            {
                question: "El marco teórico de Lipset y Rokkan se basa en el concepto de:",
                options: ["Clases sociales", "Crisis y rupturas históricas (clivajes)", "Desarrollo económico", "Liderazgo carismático"],
                answer: 1,
                explanation: "Lipset y Rokkan analizan cómo las crisis y rupturas históricas (clivajes) dieron origen a diferentes tipos de partidos políticos en Europa."
            },
            {
                question: "¿Cuáles son los cuatro clivajes principales identificados por Lipset y Rokkan en Europa?",
                options: ["Religioso, étnico, generacional, regional", "Centro-periferia, Estado-Iglesia, campo-ciudad, capital-trabajo", "Conservador, liberal, socialista, fascista", "Monarquía, república, federalismo, unitarismo"],
                answer: 1,
                explanation: "Los cuatro clivajes fundamentales son: centro-periferia (construcción nacional), Estado-Iglesia (secularización), campo-ciudad (revolución industrial) y capital-trabajo (lucha de clases)."
            },
            {
                question: "El clivaje 'capital-trabajo' está asociado con:",
                options: ["La Revolución Francesa", "La Revolución Industrial", "La Reforma Protestante", "La Primera Guerra Mundial"],
                answer: 1,
                explanation: "Este clivaje surge de la Revolución Industrial y la estratificación en clases sociales, dando origen a partidos obreros y burgueses."
            },
            {
                question: "Las teorías del desarrollo (La Palombara y Weiner) ven a los partidos como:",
                options: ["Una amenaza a la democracia", "Consecuencia natural del proceso de modernización social", "Instrumentos de las élites", "Organizaciones obsoletas"],
                answer: 1,
                explanation: "Estas teorías consideran que los partidos surgen naturalmente como respuesta a las necesidades funcionales del sistema político durante la modernización."
            },
            {
                question: "¿En qué se diferencian los partidos políticos de las facciones según la evolución histórica?",
                options: ["Los partidos son más antiguos", "Las facciones tenían connotación negativa, los partidos son legitimados", "No hay diferencia", "Los partidos son menos organizados"],
                answer: 1,
                explanation: "Históricamente, las facciones eran vistas como 'antinaturales' y perjudiciales, mientras que los partidos se legitimaron como necesarios para la representación democrática."
            },
            {
                question: "Según Méndez Parnes y Negri, la democracia es definida como:",
                options: ["El gobierno de la mayoría sin límites", "Un régimen político con reglas que determinan quién ejerce el poder y cómo", "Un sistema económico igualitario", "Una forma de organización social"],
                answer: 1,
                explanation: "Los autores definen la democracia como un régimen político basado en reglas que determinan el acceso y ejercicio del poder, con gobernantes elegidos y limitados por la ciudadanía."
            },
            {
                question: "¿Cuál es la principal diferencia entre democracia directa y representativa?",
                options: ["El número de votantes", "La participación ciudadana directa vs. a través de representantes", "El tipo de elecciones", "La duración de los mandatos"],
                answer: 1,
                explanation: "En la democracia directa los ciudadanos participan directamente en las decisiones, mientras que en la representativa eligen representantes que actúan en su nombre."
            },
            {
                question: "La democracia ateniense clásica es un ejemplo de:",
                options: ["Democracia representativa", "Democracia directa", "República", "Monarquía constitucional"],
                answer: 1,
                explanation: "En Atenas, los ciudadanos participaban directamente en la Asamblea (Ecclesia) para tomar decisiones políticas, sin intermediarios."
            },
            {
                question: "Una característica distintiva de la democracia es:",
                options: ["La ausencia de conflictos", "La competencia real entre líderes y partidos", "El poder ilimitado de los gobernantes", "La exclusión de las minorías"],
                answer: 1,
                explanation: "La competencia política real y libre entre diferentes opciones es fundamental para distinguir la democracia de otros regímenes."
            },
            {
                question: "¿Qué papel juega la legitimidad en el funcionamiento de los partidos políticos?",
                options: ["Es irrelevante", "Es la base de su aceptación y eficacia en el sistema democrático", "Solo importa en dictaduras", "Depende del financiamiento"],
                answer: 1,
                explanation: "La legitimidad es fundamental para la estabilidad democrática, ya que implica la aceptación ciudadana de las reglas del juego y la confianza en las instituciones."
            },
            {
                question: "La 'crisis de representatividad' de los partidos se refiere a:",
                options: ["Falta de candidatos", "Cuando los partidos no responden a las demandas ciudadanas sino a intereses propios", "Escasez de votantes", "Problemas de financiamiento"],
                answer: 1,
                explanation: "Esta crisis ocurre cuando los partidos se desconectan de las necesidades ciudadanas y priorizan sus propios intereses o los del Estado."
            },
            {
                question: "El concepto de 'partido cartel' de Mair implica:",
                options: ["Mayor competencia entre partidos", "Colusión entre partidos principales y dependencia del Estado", "Partidos más ideológicos", "Mayor participación ciudadana"],
                answer: 1,
                explanation: "En el modelo de 'partido cartel', los principales partidos actúan en connivencia, dependen del financiamiento estatal y se alejan de sus bases sociales."
            },
            {
                question: "¿Cuál fue una condición histórica fundamental para el surgimiento de los partidos políticos?",
                options: ["La caída del Imperio Romano", "El incremento de la participación política y la urbanización", "La invención de la imprenta", "Las guerras napoleónicas"],
                answer: 1,
                explanation: "El aumento de la participación política durante los siglos XVIII y XIX, junto con la urbanización, creó las condiciones para el desarrollo de los partidos modernos."
            },
            {
                question: "El desarrollo del parlamento actuó como:",
                options: ["Un obstáculo para los partidos", "El sustrato indispensable para el desarrollo de los partidos", "Una alternativa a los partidos", "Un competidor de los partidos"],
                answer: 1,
                explanation: "El parlamento proporcionó el espacio institucional donde surgieron los primeros lazos de solidaridad política ('facciones') que evolucionaron hacia los partidos modernos."
            },
            {
                question: "¿Qué significa que las instituciones públicas 'dependan del voto popular' en una democracia?",
                options: ["Que se voten todas las decisiones", "Que derivan su legitimidad y autoridad del consenso electoral", "Que son privadas", "Que cambian constantemente"],
                answer: 1,
                explanation: "En una democracia, la autoridad de las instituciones gubernamentales se basa en el mandato otorgado por los ciudadanos a través del voto."
            },
            {
                question: "Las libertades fundamentales en una democracia incluyen:",
                options: ["Solo el derecho al voto", "Asociación, expresión, prensa y participación política", "Únicamente la libertad económica", "Solo las libertades religiosas"],
                answer: 1,
                explanation: "La democracia requiere un conjunto amplio de libertades civiles y políticas que permitan la participación ciudadana y la competencia política efectiva."
            },
            {
                question: "El término 'régimen político' se refiere a:",
                options: ["Solo el gobierno actual", "El conjunto de reglas que determinan quién ejerce el poder y cómo", "La constitución exclusivamente", "Los partidos en el poder"],
                answer: 1,
                explanation: "Un régimen político es el marco institucional más amplio que define las reglas del juego político, más allá del gobierno específico del momento."
            },
            {
                question: "¿Qué diferencia a la democracia de una dictadura en términos de limitación del poder?",
                options: ["No hay diferencia", "En democracia el poder está limitado por la constitución y las libertades", "En dictadura hay más límites", "Solo cambia el líder"],
                answer: 1,
                explanation: "En la democracia, el poder de los gobernantes está constitucionalmente limitado y sujeto a controles, mientras que en las dictaduras estos límites son inexistentes o muy débiles."
            },
            {
                question: "La función principal de los partidos como 'intermediarios' significa que:",
                options: ["Solo median en conflictos", "Canalizan demandas de la sociedad hacia el Estado y viceversa", "Trabajan solo con otros partidos", "Evitan el contacto directo"],
                answer: 1,
                explanation: "Los partidos actúan como puentes entre la sociedad civil y las instituciones estatales, tanto representando demandas ciudadanas como implementando políticas gubernamentales."
            },
            {
                question: "¿Por qué es importante la 'etiqueta oficial' para distinguir un partido de otros grupos políticos?",
                options: ["Por razones estéticas", "Permite el reconocimiento legal y la participación electoral", "Para la publicidad", "No es importante"],
                answer: 1,
                explanation: "El reconocimiento oficial distingue a los partidos de movimientos informales y les otorga el estatus legal necesario para competir en elecciones."
            },
            {
                question: "El proceso de 'expansión territorial de los estados' contribuyó al surgimiento de partidos porque:",
                options: ["Redujo la población", "Creó la necesidad de representación política en territorios más amplios", "Eliminó las fronteras", "Centralizó todo el poder"],
                answer: 1,
                explanation: "Los estados más grandes necesitaban mecanismos para organizar la representación política en territorios extensos, lo que favoreció el desarrollo de partidos."
            },
            {
                question: "¿Qué caracteriza a un sistema con 'competencia real' entre partidos?",
                options: ["Que todos tengan la misma ideología", "Que existan alternativas viables y diferentes para los votantes", "Que no haya diferencias", "Que solo compitan dos partidos"],
                answer: 1,
                explanation: "La competencia real requiere que existan opciones políticas genuinamente diferentes y que todas tengan posibilidades reales de acceder al poder."
            },
            {
                question: "En el análisis de Malamud, ¿qué papel jugó la burguesía en el desarrollo de los partidos?",
                options: ["Se opuso completamente", "Utilizó el parlamento para controlar las acciones de gobierno", "Los ignoró", "Los prohibió"],
                answer: 1,
                explanation: "La burguesía usó el parlamento como instrumento para controlar y limitar las acciones gubernamentales, lo que contribuyó al desarrollo de organizaciones partidarias."
            },
            {
                question: "Los 'lazos de solidaridad' o 'facciones' parlamentarias fueron:",
                options: ["El fin de los partidos", "Los precursores de los partidos modernos", "Organizaciones criminales", "Grupos religiosos"],
                answer: 1,
                explanation: "Estos primeros grupos de cooperación parlamentaria evolucionaron gradualmente hacia las organizaciones partidarias modernas más estructuradas."
            },
            {
                question: "¿Qué implicación tiene que la democracia requiera 'gobernantes elegidos por la ciudadanía'?",
                options: ["Que todos pueden gobernar", "Que la autoridad deriva del consentimiento popular", "Que no hay gobiernos permanentes", "Que el gobierno es débil"],
                answer: 1,
                explanation: "Este principio establece que la legitimidad del poder político debe basarse en el consentimiento expresado libremente por los ciudadanos a través de elecciones."
            },
            {
                question: "El concepto de 'masificación de las sociedades' se relaciona con el surgimiento de partidos porque:",
                options: ["Redujo la población", "Aumentó la necesidad de organizar y movilizar grandes grupos de personas", "Eliminó la política", "Creó uniformidad"],
                answer: 1,
                explanation: "Las sociedades más grandes y complejas requirieron organizaciones más sofisticadas para movilizar políticamente a amplios sectores de la población."
            },
            {
                question: "Según Méndez Parnes y Negri, ¿qué distingue a la democracia de otros regímenes en términos de acceso al poder?",
                options: ["La violencia", "Las reglas institucionales claras y la competencia electoral", "La tradición", "El dinero"],
                answer: 1,
                explanation: "La democracia se caracteriza por tener procedimientos institucionales transparentes y competencia abierta para acceder al poder político."
            },
            {
                question: "La importancia de las 'libertades cívicas y políticas' en la democracia radica en que:",
                options: ["Son opcionales", "Permiten la participación efectiva y el control del poder", "Solo benefician a las élites", "Generan caos"],
                answer: 1,
                explanation: "Estas libertades son esenciales para que los ciudadanos puedan participar políticamente, organizarse y controlar efectivamente a sus gobernantes."
            },
            {
                question: "¿Qué significa que un partido pueda 'sacar candidatos viables' en elecciones?",
                options: ["Que tenga muchos miembros", "Que tenga posibilidades reales de obtener cargos públicos", "Que sea muy antiguo", "Que tenga mucho dinero"],
                answer: 1,
                explanation: "La viabilidad electoral implica que el partido tiene capacidad real de competir exitosamente y obtener representación, no solo presentar candidatos simbólicos."
            },
            {
                question: "El origen 'no intencionado' de los partidos según Malamud significa que:",
                options: ["Fueron creados por accidente", "Surgieron como consecuencia imprevista de otros procesos políticos", "No tenían objetivos", "Fueron impuestos"],
                answer: 1,
                explanation: "Los partidos no fueron diseñados deliberadamente, sino que emergieron naturalmente como respuesta a las necesidades de organización política en sociedades modernas."
            },
            {
                question: "¿Por qué la definición de Sartori no incluye la ideología como elemento constitutivo esencial?",
                options: ["Porque es irrelevante", "Para crear una definición más amplia que incluya diversos tipos de partidos", "Porque no existe", "Porque es muy compleja"],
                answer: 1,
                explanation: "Sartori busca una definición funcional que abarque partidos con diferentes niveles de estructuración ideológica, centrándose en su función electoral común."
            },
            {
                question: "La 'legitimidad democrática' se basa fundamentalmente en:",
                options: ["La tradición", "El consenso y la aceptación ciudadana de las reglas del juego", "La fuerza militar", "La riqueza económica"],
                answer: 1,
                explanation: "La legitimidad democrática requiere que los ciudadanos acepten voluntariamente las instituciones y procedimientos democráticos como válidos y justos."
            },
            {
                question: "¿Qué implica la transformación hacia el 'partido cartel' para la democracia?",
                options: ["Mayor competencia", "Menor legitimidad y mayor distancia de los ciudadanos", "Más participación", "Mejor representación"],
                answer: 1,
                explanation: "El modelo de partido cartel sugiere una degeneración democrática donde los partidos se vuelven menos responsivos a los ciudadanos y más dependientes del Estado."
            },
            {
                question: "En la tipología histórica de partidos, ¿qué caracteriza a los de 'creación externa'?",
                options: ["Nacen dentro del parlamento", "Surgen desde movimientos sociales organizados", "Son más antiguos", "Tienen menos ideología"],
                answer: 1,
                explanation: "Los partidos de creación externa emergen de organizaciones sociales (sindicatos, iglesias, movimientos) que buscan obtener representación política."
            },
            {
                question: "El clivaje 'centro-periferia' de Lipset y Rokkan se refiere a:",
                options: ["Diferencias económicas", "Tensiones entre la construcción nacional y las identidades locales", "Conflictos religiosos", "Lucha de clases"],
                answer: 1,
                explanation: "Este clivaje surge del proceso de construcción del Estado-nación y las tensiones entre la centralización política y las identidades regionales o locales."
            },
            {
                question: "¿Qué papel juega la 'urbanización' en el surgimiento de los partidos políticos?",
                options: ["Los elimina", "Concentra población y facilita la organización política", "Los debilita", "No tiene relación"],
                answer: 1,
                explanation: "La urbanización concentra grandes poblaciones en espacios reducidos, facilitando la comunicación política, la organización colectiva y la movilización partidaria."
            },
            {
                question: "La diferencia fundamental entre 'facciones' históricas y 'partidos' modernos es:",
                options: ["El tamaño", "La legitimidad y aceptación social de su rol", "La edad", "El financiamiento"],
                answer: 1,
                explanation: "Mientras las facciones eran vistas como divisiones perjudiciales, los partidos modernos son reconocidos como instrumentos legítimos y necesarios de la democracia."
            },
            {
                question: "¿Qué significa que las 'instituciones públicas dependan del voto popular'?",
                options: ["Que se vota todo", "Que su legitimidad deriva de la autorización electoral ciudadana", "Que son privadas", "Que cambian siempre"],
                answer: 1,
                explanation: "Significa que las instituciones democráticas obtienen su autoridad y legitimidad del mandato otorgado por los ciudadanos a través del proceso electoral."
            },
            {
                question: "El clivaje 'Estado-Iglesia' típicamente genera partidos:",
                options: ["Económicos", "Seculares vs. confesionales", "Militares", "Regionales"],
                answer: 1,
                explanation: "Este clivaje produce la división entre partidos que defienden la secularización del Estado y aquellos que buscan mantener la influencia religiosa en la política."
            },
            {
                question: "¿Por qué es importante la 'competencia real' en una democracia?",
                options: ["Para generar conflicto", "Porque ofrece alternativas genuinas a los ciudadanos", "Para confundir a los votantes", "No es importante"],
                answer: 1,
                explanation: "La competencia real garantiza que los ciudadanos tengan opciones significativas y que el poder político esté efectivamente contestado y limitado."
            },
            {
                question: "La 'crisis de legitimidad' de los partidos puede llevar a:",

            {

                options: ["Es muy específica", "Permite incluir diferentes tipos de partidos bajo un criterio común", "Excluye muchos casos", "Es muy antigua"],
                answer: 1,
                explanation: "Al centrarse en la función electoral común, la definición de Sartori puede abarcar partidos con diferentes características ideológicas, organizacionales o sociales."

                explanation: "Esta distinción es crucial para entender las diferentes formas históricas de organización democrática y sus implicaciones para la participación ciudadana."
            },
            {

                options: ["Los hace más populares", "Establece su estatus oficial y derechos en el sistema político", "Garantiza su éxito", "Los protege de críticas"],
                answer: 1,
                explanation: "El reconocimiento legal otorga a los partidos el estatus oficial necesario para participar en elecciones y ejercer funciones específicas en el sistema democrático."
            }
        ];

        let quizzes = [];
        let currentQuiz = null;
        let currentQuestionIndex = 0;
        let score = 0;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackMessage = document.getElementById('feedback-message');
        const nextButton = document.getElementById('next-button');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
                
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
