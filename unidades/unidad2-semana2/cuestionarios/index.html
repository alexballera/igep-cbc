    <script>
        const allQuestions = [
            {
                question: "Según Andrés Malamud, ¿cuál es el elemento paradójico en la conceptualización weberiana del Estado respecto a la relación entre medios y fines?",
                options: [
                    "El Estado moderno utiliza medios pacíficos para alcanzar fines violentos específicos", 
                    "No existen funciones específicas del Estado, pero sí un recurso específico: la violencia", 
                    "El Estado concentra poder político pero descentraliza la administración territorial", 
                    "La legitimidad se basa en la tradición pero funciona de manera racional"
                ],
                answer: 1,
                explanation: "Weber argumenta que no hay funciones específicas del Estado (todo lo que hace también lo hicieron otras organizaciones), pero sí tiene un recurso específico: el monopolio legítimo de la violencia."
            },
            {
                question: "En el análisis de Oszlak sobre la 'estatidad', ¿qué diferencia conceptual establece entre la capacidad de externalización y la capacidad de diferenciación del control estatal?",
                options: [
                    "La primera se refiere al reconocimiento internacional del Estado como unidad soberana", 
                    "La primera implica control territorial exclusivo, la segunda control ideológico efectivo", 
                    "La primera es fundamentalmente política, la segunda es esencialmente económica", 
                    "No existe diferencia sustancial entre ambas capacidades en el análisis"
                ],
                answer: 0,
                explanation: "La externalización refiere al reconocimiento como unidad soberana en el sistema interestatal, mientras que la diferenciación del control implica crear instituciones públicas funcionalmente diferenciadas y profesionalizadas."
            },
            {
                question: "¿Qué implicancia teórica tiene el concepto de 'autonomía enraizada' de Peter Evans para la comprensión del Estado desarrollista?",
                options: [
                    "El Estado debe ser completamente independiente de la sociedad civil", 
                    "Combina alta autonomía estatal con interacción fluida con actores sociales", 
                    "Requiere subordinación total del Estado al mercado y actores privados", 
                    "Implica la eliminación de toda intermediación política entre Estado y sociedad"
                ],
                answer: 1,
                explanation: "La 'autonomía enraizada' supera la dicotomía entre autonomía total y captura estatal, permitiendo al Estado extraer excedentes mientras ofrece bienes colectivos."
            },
            {
                question: "Según Malamud, ¿por qué la experiencia latinoamericana de formación estatal difiere del modelo europeo en términos del tipo de guerras y sus efectos?",
                options: [
                    "Las guerras latinoamericanas fueron más largas y destructivas que las europeas", 
                    "Fueron 'guerras de tipo incorrecto' en 'contextos inapropiados' según Centeno", 
                    "América Latina no experimentó guerras significativas históricamente como Europa", 
                    "Las guerras favorecieron la fragmentación en lugar de unificación estatal"
                ],
                answer: 1,
                explanation: "Centeno identifica que fueron guerras de seguridad interna (no conquista), no movilizadoras ni galvanizadoras de identidad nacional, en contextos de fragmentación regional y divisiones étnicas."
            },
            {
                question: "En la tipología de Dahl sobre poliarquía, ¿qué relación conceptual existe entre los criterios de 'formación de preferencias' y 'manifestación de preferencias'?",
                options: [
                    "Son independientes y no requieren conexión lógica entre ellos", 
                    "Los primeros cuatro criterios permiten manifestar preferencias libremente", 
                    "Ambos se reducen únicamente al derecho al voto universal e igualitario", 
                    "Solo importa la manifestación, no la formación de preferencias ciudadanas"
                ],
                answer: 1,
                explanation: "Los criterios 1-4 (derechos políticos) permiten manifestar preferencias, mientras los criterios 5-7 (libertades civiles) permiten formar preferencias libremente."
            },
            {
                question: "¿Qué tensión conceptual identifica Méndez Parnes y Negri entre las definiciones maximalistas y minimalistas de democracia?",
                options: [
                    "Las maximalistas son más precisas que las minimalistas en sus criterios", 
                    "Existe una tensión significado/valor que influye en el debate académico", 
                    "Ambas coinciden en sus criterios fundamentales de análisis democrático", 
                    "Las minimalistas incluyen más variables que las maximalistas en sus definiciones"
                ],
                answer: 1,
                explanation: "La democracia no solo significa algo sino que se asocia a un valor positivo, creando tensión entre perspectivas filosóficas/prescriptivas (maximalistas) y empíricas/descriptivas (minimalistas)."
            },
            {
                question: "En el modelo de democracia consociativa de Lijphart, ¿cómo se relaciona el 'veto mutuo' con el principio de proporcionalidad?",
                options: [
                    "Son mecanismos contradictorios que no pueden coexistir", 
                    "El veto mutuo protege a las minorías mientras la proporcionalidad asegura representación equitativa", 
                    "Ambos favorecen únicamente a las mayorías políticas", 
                    "Solo funciona el veto mutuo en sociedades homogéneas"
                ],
                answer: 1,
                explanation: "En la democracia consociativa, el veto mutuo permite a minorías concurrentes bloquear decisiones perjudiciales, mientras la proporcionalidad garantiza representación equitativa en instituciones y recursos."
            },
            {
                question: "¿Qué diferencia estructural establece Linz entre regímenes totalitarios y autoritarios respecto al pluralismo político?",
                options: [
                    "Los autoritarios permiten pluralismo total, los totalitarios lo prohíben completamente", 
                    "Los totalitarios carecen de pluralismo, los autoritarios toleran un 'pluralismo limitado'", 
                    "Ambos tipos rechazan cualquier forma de pluralismo político", 
                    "No existe diferencia significativa entre ambos regímenes"
                ],
                answer: 1,
                explanation: "Los regímenes totalitarios eliminan todo pluralismo (poder monista), mientras los autoritarios toleran un pluralismo político limitado sin intentar control total sobre la sociedad civil."
            },
            {
                question: "En el análisis de Barrington Moore sobre las 'tres rutas a la modernidad', ¿qué papel específico cumple la burguesía en la ruta democrática?",
                options: [
                    "Es irrelevante para el proceso democrático", 
                    "Crea equilibrio que impide monarquía fuerte o aristocracia independiente", 
                    "Siempre se opone a la democratización política", 
                    "Solo importa en sociedades agrarias tradicionales"
                ],
                answer: 1,
                explanation: "Moore identifica a la burguesía como fuente principal de democracia en la primera ruta, creando equilibrio que evita tanto el absolutismo monárquico como la independencia aristocrática excesiva."
            },
            {
                question: "¿Cómo conceptualiza Marshall la ciudadanía en relación con la tensión entre igualdad ciudadana y desigualdad socioeconómica?",
                options: [
                    "La ciudadanía elimina automáticamente las desigualdades de clase", 
                    "La ciudadanía determina igualdad básica compatible con diferencias capitalistas", 
                    "La ciudadanía es irrelevante para las cuestiones de clase social", 
                    "Solo existe ciudadanía plena en sociedades sin clases"
                ],
                answer: 1,
                explanation: "Marshall concibe la ciudadanía como status que genera igualdad básica independiente de las diferencias de clase del sistema económico, compatible pero no coincidente con ellas."
            },
            {
                question: "En la teoría de las transiciones democráticas de O'Donnell y Schmitter, ¿qué determina el tipo específico de transición (transformación, reemplazo o traspaso)?",
                options: [
                    "Solo las condiciones económicas internacionales determinan el tipo", 
                    "La interacción entre reformistas/ultraconservadores y moderados/radicales", 
                    "Únicamente la fortaleza militar del régimen autoritario anterior", 
                    "La presión de organismos internacionales de derechos humanos"
                ],
                answer: 1,
                explanation: "El tipo de transición depende de qué facción domina en cada campo: transformación (dominan reformistas/moderados), reemplazo (dominan radicales), traspaso (dominan moderados de ambos lados)."
            },
            {
                question: "¿Qué implica el concepto de 'democracia delegativa' de O'Donnell respecto a la división de poderes y la accountability horizontal?",
                options: [
                    "Fortalece los controles institucionales entre poderes", 
                    "Es intrínsecamente hostil a la representación normal y al control horizontal entre organismos públicos", 
                    "Mejora la calidad de la representación política", 
                    "No tiene efectos sobre el sistema institucional"
                ],
                answer: 1,
                explanation: "La democracia delegativa concentra poder en el ejecutivo, debilitando controles institucionales y la accountability horizontal, donde el ganador electoral se faculta para gobernar sin límites institucionales significativos."
            },
            {
                question: "En la distinción de Mann entre poderes despóticos e infraestructurales del Estado, ¿por qué el Estado británico del siglo XVIII era más 'fuerte' que el absolutista francés?",
                options: [
                    "Tenía mayor capacidad militar", 
                    "Poseía mayor poder infraestructural (capacidad de penetrar sociedad y movilizar recursos) pese a menor poder despótico", 
                    "Controlaba más territorio", 
                    "Tenía mayor legitimidad religiosa"
                ],
                answer: 1,
                explanation: "Aunque Francia tenía mayor poder despótico (menos restricciones legales), Gran Bretaña tenía superior poder infraestructural para penetrar la sociedad, extraer recursos y generar apoyo, siendo más efectivo para la movilización."
            },
            {
                question: "¿Qué función cumple la ideología en los regímenes totalitarios según la tipología de Linz, y cómo se diferencia de las 'mentalidades' autoritarias?",
                options: [
                    "No existe diferencia sustancial entre ambas", 
                    "Los totalitarismos desarrollan ideologías elaboradas y utópicas con significado metafísico, los autoritarismos solo mentalidades vagas", 
                    "Los autoritarios tienen ideologías más desarrolladas", 
                    "Ambos carecen de componentes ideológicos"
                ],
                answer: 1,
                explanation: "Los totalitarismos requieren ideologías elaboradas con interpretación metafísica de la realidad social y compromiso profundo, mientras los autoritarios solo desarrollan mentalidades vagas sobre funcionamiento político."
            },
            {
                question: "En el modelo de sistema interestatal westfaliano, ¿cómo se relaciona el principio de soberanía con las dimensiones propuestas por Krasner?",
                options: [
                    "La soberanía es un concepto unitario sin dimensiones", 
                    "Krasner desagrega la soberanía en cuatro dimensiones que pueden variar independientemente: doméstica, interdependiente, legal internacional y westfaliana", 
                    "Solo existe soberanía externa", 
                    "La soberanía se reduce al reconocimiento legal"
                ],
                answer: 1,
                explanation: "Krasner demuestra que la soberanía no es monolítica: un Estado puede tener alta soberanía legal pero baja interdependiente (países poderosos), o viceversa (Estados débiles pero legalmente reconocidos)."
            },
            {
                question: "¿Qué relación establece Sartori entre democracia como ideal y democracia como régimen en términos de la tensión igualitaria?",
                options: [
                    "No existe relación entre ideal y práctica", 
                    "La democracia se basa en el ideal de igualdad: 'sin esta tensión ideal, la democracia no nace, y una vez nacida, rápidamente se distiende'", 
                    "Solo importa la democracia práctica", 
                    "El ideal es irrelevante para el funcionamiento"
                ],
                answer: 1,
                explanation: "Sartori argumenta que la democracia requiere mantener viva la tensión igualitaria como motor, siendo el ideal de igualdad lo que genera y sostiene la práctica democrática."
            },
            {
                question: "En la teoría de la modernización de Lipset, ¿cómo se relacionan desarrollo económico y legitimidad democrática?",
                options: [
                    "Son variables completamente independientes", 
                    "Lipset subsume la legitimidad al desarrollo, argumentando que su principal fuente proviene de los resultados económicos", 
                    "Solo importa la legitimidad, no el desarrollo", 
                    "El desarrollo económico debilita la legitimidad democrática"
                ],
                answer: 1,
                explanation: "Lipset establece que el desarrollo económico genera legitimidad democrática principalmente a través de resultados económicos, prosperidad material y el surgimiento de una clase media educada y tolerante."
            },
            {
                question: "¿Qué paradoja identifica Alan Wolfe sobre la calidad democrática en Estados Unidos respecto a la relación entre instituciones políticas y administración burocrática?",
                options: [
                    "No existe tal paradoja", 
                    "La administración burocrática se politiza mientras las instituciones políticas se despolitizan, y ninguna cumple su función", 
                    "Ambas funcionan perfectamente", 
                    "Solo las instituciones políticas funcionan adecuadamente"
                ],
                answer: 1,
                explanation: "Wolfe observa que las tensiones sociales son atendidas por agencias burocráticas (que se politizan) en lugar de instituciones políticas (que se despolitizan), creando una paradoja disfuncional."
            },
            {
                question: "En el análisis de Centeno sobre la formación estatal latinoamericana, ¿qué significa la 'combinación desastrosa' entre autoridades regionales y ejércitos supranacionales?",
                options: [
                    "Los ejércitos eran más pequeños que las autoridades políticas", 
                    "Comandantes militares no respondían a autoridad formal de países independientes sino a autoridades locales con las que tenían conflictos", 
                    "Existía perfecta coordinación entre autoridades y ejércitos", 
                    "Los ejércitos solo respondían a potencias extranjeras"
                ],
                answer: 1,
                explanation: "El caso de San Martín ilustra esta combinación: comandaba un ejército que no respondía a un país independiente (Argentina no lo era hasta 1816) sino a autoridades locales conflictivas, continuando campañas más allá de su mandato."
            },
            {
                question: "¿Cómo conceptualiza Huntington la diferencia entre 'grado de gobierno' versus 'forma de gobierno' en su análisis comparativo de sistemas políticos?",
                options: [
                    "Ambos conceptos son idénticos", 
                    "La principal diferencia entre países concierne el grado de gobierno (consenso, legitimidad, estabilidad) más que la forma (democracia vs dictadura)", 
                    "Solo importa la forma de gobierno", 
                    "Solo importa el grado de gobierno"
                ],
                answer: 1,
                explanation: "Huntington argumenta que países como EEUU, Reino Unido y URSS, con diferentes formas, comparten alto grado de gobierno (capacidad efectiva de implementar decisiones), lo que es más determinante que el tipo de régimen."
            },
            {
                question: "En la teoría de las 'tres olas de democratización' de Huntington, ¿qué papel específico cumple el 'efecto demostración' en la tercera ola?",
                options: [
                    "No tiene relevancia para la democratización", 
                    "Genera incentivos en agentes democratizadores cuando observan éxito de procesos similares, especialmente en países de la misma región", 
                    "Solo funciona a nivel nacional", 
                    "Impide la democratización"
                ],
                answer: 1,
                explanation: "El efecto demostración o 'bola de nieve' incentiva a actores democratizadores cuando observan éxitos regionales (España para América Latina, Polonia para Europa del Este), facilitando la expansión de transiciones."
            },
            {
                question: "¿Qué implicancia tiene la distinción entre republicanismo cívico y liberalismo respecto a la concepción del ciudadano y la participación política?",
                options: [
                    "Ambas corrientes tienen visiones idénticas", 
                    "El republicanismo defiende al ciudadano protagonista y activo con valor intrínseco de la participación, el liberalismo tiende hacia el ciudadano pasivo protegido por derechos", 
                    "Solo el liberalismo valora la participación", 
                    "Solo el republicanismo protege derechos individuales"
                ],
                answer: 1,
                explanation: "El republicanismo cívico postula participación como requisito para identificación con la comunidad y promoción del bien común, mientras el liberalismo enfatiza derechos individuales y protección contra la arbitrariedad estatal."
            },
            {
                question: "En la propuesta de Bobbio sobre tipología de democracias representativas, ¿cómo se articula el criterio procedimental con el criterio de calidad democrática?",
                options: [
                    "Son criterios contradictorios", 
                    "El criterio procedimental se basa en reglas del régimen, el de calidad en la realización de valores democráticos (tolerancia, no-violencia, igualdad)", 
                    "Solo importa el criterio procedimental", 
                    "Solo importa el criterio de calidad"
                ],
                answer: 1,
                explanation: "Bobbio establece un doble criterio: procedimientos institucionales del régimen versus grado de realización de valores esenciales democráticos, distinguiendo democracias consolidadas de imperfectas/cuasi-democracias."
            },
            {
                question: "¿Qué tensión conceptual existe en la teoría marxista del Estado según Colin Hay, y cómo se resuelve en el planteamiento estratégico-relacional de Jessop?",
                options: [
                    "No existe tensión en la teoría marxista", 
                    "Hay paradoja: no existe teoría marxista coherente del Estado debido a su propósito eliminarlo; Jessop propone 'mutua determinación' entre clases y Estado", 
                    "La teoría marxista es completamente coherente", 
                    "Jessop rechaza totalmente el marxismo"
                ],
                answer: 1,
                explanation: "Hay identifica la paradoja de que el marxismo busca eliminar el Estado más que teorizarlo; Jessop supera el dualismo agencia-estructura proponiendo determinación mutua e interacción contingente."
            },
            {
                question: "En el modelo de poliarquía de Dahl, ¿qué relación existe entre las dimensiones de participación y debate público (contestación) en las tres trayectorias hacia la democratización?",
                options: [
                    "Ambas dimensiones siempre se desarrollan simultáneamente", 
                    "Pueden desarrollarse secuencialmente: liberalización precede participación (Europa), participación precede liberalización (Alemania), o simultáneamente (Francia)", 
                    "Solo importa la participación", 
                    "Solo importa el debate público"
                ],
                answer: 1,
                explanation: "Dahl identifica tres trayectorias: debate público primero → oligarquía competitiva → poliarquía; participación primero → hegemonía inclusiva → poliarquía; o transformación directa y simultánea de ambas dimensiones."
            },
            {
                question: "¿Cómo se relaciona el concepto de 'estatidad' de Oszlak con la noción weberiana de Estado en términos de los procesos de institucionalización?",
                options: [
                    "Son conceptos completamente diferentes", 
                    "Oszlak operacionaliza conceptos weberianos especificando cuatro capacidades que debe adquirir una entidad para 'ser Estado'", 
                    "Oszlak rechaza totalmente a Weber", 
                    "Weber rechaza la noción de estatidad"
                ],
                answer: 1,
                explanation: "Oszlak toma la definición weberiana y la operacionaliza en cuatro capacidades específicas (externalización, institucionalización de autoridad, diferenciación de control, internalización de identidad) que permiten analizar empíricamente la formación estatal."
            },
            {
                question: "En la tipología de Estados fallidos versus Estados desarrollistas de Evans, ¿qué papel cumple la relación Estado-sociedad en la determinación del tipo?",
                options: [
                    "La relación Estado-sociedad es irrelevante", 
                    "Estados excesivamente autónomos o excesivamente dependientes fallan; se requiere 'autonomía enraizada' para el desarrollo", 
                    "Solo importa la autonomía estatal total", 
                    "Solo importa la dependencia social total"
                ],
                answer: 1,
                explanation: "Evans argumenta que tanto el aislamiento estatal excesivo como la captura por grupos específicos generan fallas; el Estado desarrollista requiere combinar autonomía con interacción fluida (autonomía enraizada)."
            },
            {
                question: "¿Qué implicaciones tiene la distinción entre democracia como 'variable discreta' versus 'variable continua' para el análisis empírico de regímenes políticos?",
                options: [
                    "No tiene implicaciones metodológicas", 
                    "Variable discreta establece umbrales dicotómicos (democracia/no democracia), variable continua permite análisis de grados y correlaciones estadísticas", 
                    "Ambas son metodológicamente idénticas", 
                    "Solo la variable discreta es válida científicamente"

                answer: 1,
                explanation: "Malamud explica que la accountability horizontal (entre poderes, agencias estatales) y vertical (ciudadanos hacia representantes) se complementan: la primera previene concentración de poder, la segunda asegura responsiveness democrática y sanción electoral."

                answer: 1,

                answer: 1,
                explanation: "Oszlak, con influencia marxista, asocia la formación del Estado argentino con el desarrollo de un mercado nacional que posibilite relaciones de producción capitalista, siendo esta integración económica condición para la integración política nacional."

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
                
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
