    <script>
                const allQuestions = [
            {
                question: "¿Según Malamud, cuál es la característica esencial que define al Estado?",
                options: [
                    "La capacidad de una comunidad para generar una identidad nacional compartida y una cultura homogénea en un territorio delimitado.",
                    "El monopolio de la coacción física legítima sobre un territorio.",
                    "La existencia de un gobierno electo democráticamente que garantiza la provisión de bienes y servicios públicos a toda la población.",
                    "El conjunto de instituciones burocráticas y un sistema legal racional diseñado para administrar eficientemente los recursos de la sociedad."
                ],
                answer: 1,
                explanation: "Malamud, siguiendo a Max Weber, define al Estado como aquella comunidad humana que, dentro de un determinado territorio, reclama (con éxito) para sí el monopolio de la violencia física legítima."
            },
            {
                question: "¿Qué diferencia establece Malamud entre 'Estado' y 'gobierno'?",
                options: [
                    "El Estado es la estructura política permanente, mientras que el gobierno es el conjunto de personas que temporalmente ejercen el poder.",
                    "El Estado se refiere al conjunto de la población y su identidad nacional, mientras que el gobierno es la élite que toma las decisiones políticas.",
                    "Son términos intercambiables en la ciencia política moderna, aunque en el lenguaje común el 'Estado' tiene una connotación más amplia.",
                    "El Estado es la dimensión coercitiva y burocrática, mientras que el gobierno representa la dimensión consensual y democrática de la política."
                ],
                answer: 0,
                explanation: "El Estado es la estructura política permanente de una comunidad, mientras que el gobierno es el conjunto de personas y partidos que temporalmente ejercen el poder del Estado."
            },
            {
                question: "Para Méndez Parnes y Negri, ¿qué es la 'poliarquía' en el contexto de la democracia?",
                options: [
                    "Un sistema ideal y utópico donde todos los ciudadanos participan directamente en todas las decisiones, garantizando una igualdad política absoluta.",
                    "Un régimen político donde múltiples partidos compiten por el poder, pero sin garantías reales para la oposición ni libertades civiles plenas.",
                    "El concepto de Dahl para describir las democracias realmente existentes, caracterizadas por el derecho a participar y oponerse, aunque con barreras.",
                    "Una forma de gobierno donde el poder está fragmentado entre tantos actores que resulta imposible tomar decisiones efectivas (parálisis decisoria)."
                ],
                answer: 2,
                explanation: "Las autoras, citando a Robert Dahl, explican que la poliarquía es el término que describe a las democracias contemporáneas, caracterizadas por el derecho a participar y a oponerse, aunque con barreras y costos."
            },
            {
                question: "¿Cuál de los siguientes NO es un atributo del Estado según Malamud?",
                options: [
                    "El ejercicio de la soberanía como poder supremo y no sometido a otra autoridad en su jurisdicción.",
                    "La delimitación de un territorio geográfico sobre el cual ejerce su poder de forma exclusiva.",
                    "El control sobre una población que habita permanentemente dentro de sus fronteras territoriales.",
                    "La existencia de un mercado común y una moneda única para facilitar el intercambio económico."
                ],
                answer: 3,
                explanation: "Los atributos clásicos del Estado son: soberanía (poder supremo), territorio (espacio geográfico delimitado) y población (conjunto de personas). Un mercado común es una característica de integraciones regionales, no un atributo esencial del Estado."
            },
            {
                question: "¿Qué significa el concepto de 'accountability' o 'rendición de cuentas' según Méndez Parnes y Negri?",
                options: [
                    "La capacidad de las agencias estatales para ejecutar el presupuesto público de manera eficiente y transparente, auditada por organismos técnicos.",
                    "El proceso mediante el cual los ciudadanos se informan sobre los actos de gobierno para poder participar de manera más efectiva en el debate público.",
                    "La obligación de los gobernantes de responder por sus actos ante los ciudadanos y la existencia de mecanismos de sanción y control.",
                    "El deber moral de los gobernantes de actuar siempre en pos del bien común, independientemente de si son o no supervisados por la ciudadanía."
                ],
                answer: 2,
                explanation: "La accountability implica que los gobernantes son responsables de sus decisiones y deben justificarlas ante los ciudadanos, quienes tienen la capacidad de sancionarlos, por ejemplo, a través del voto."
            },
            {
                question: "Malamud describe la formación del Estado europeo como un proceso de...",
                options: [
                    "Un pacto social voluntario entre individuos libres e iguales que decidieron ceder parte de su libertad a un poder central para garantizar la paz.",
                    "Imposición de un poder central a través de la guerra y la extracción de recursos para financiarla.",
                    "Una evolución gradual y pacífica de las estructuras de parentesco feudales hacia una administración burocrática centralizada y racional.",
                    "La difusión de ideas filosóficas sobre el buen gobierno que convencieron a los monarcas de la necesidad de unificar sus territorios."
                ],
                answer: 1,
                explanation: "El autor explica que el Estado moderno en Europa surgió de la competencia militar entre señores feudales, donde los más exitosos lograron centralizar el poder, monopolizar la violencia y crear aparatos burocráticos para extraer recursos (impuestos)."
            },
            {
                question: "¿Cuál es la diferencia entre 'accountability vertical' y 'accountability horizontal'?",
                options: [
                    "La vertical es la que ejercen los ciudadanos sobre los gobernantes (elecciones), y la horizontal es el control mutuo entre poderes del Estado.",
                    "La vertical se refiere al control del presidente sobre sus ministros, mientras que la horizontal es el control del parlamento sobre el poder judicial.",
                    "La vertical se ejerce en sistemas federales (entre nación y provincias), y la horizontal en sistemas unitarios (entre poderes centrales).",
                    "La vertical es la rendición de cuentas por temas económicos, y la horizontal es por cuestiones políticas y de derechos humanos."
                ],
                answer: 0,
                explanation: "La accountability vertical es la que ejercen los ciudadanos sobre los gobernantes (elecciones, protestas). La horizontal es el control mutuo entre las diferentes agencias e instituciones del Estado (ej. el Congreso controla al Ejecutivo)."
            },
            {
                question: "Según Malamud, ¿por qué el Estado es una 'creación europea' que se expandió globalmente?",
                options: [
                    "Porque el modelo de Estado europeo demostró ser el más eficiente económicamente y fue adoptado voluntariamente por otras naciones para competir.",
                    "Porque fue impuesto a través del colonialismo y, tras la descolonización, los nuevos países lo adoptaron como modelo de organización.",
                    "Porque los principios de la Ilustración europea sobre la soberanía popular y los derechos del hombre tuvieron una aceptación universal inmediata.",
                    "Porque las condiciones geográficas y demográficas de Europa permitieron un desarrollo institucional único e irrepetible que luego fue copiado."
                ],
                answer: 1,
                explanation: "El Estado como forma de organización política se originó en Europa y fue exportado al resto del mundo principalmente a través de la conquista y la colonización. Tras la descolonización, los nuevos países adoptaron este modelo."
            },
            {
                question: "¿Qué es una 'democracia delegativa' según el texto de Méndez Parnes y Negri?",
                options: [
                    "Un sistema donde los representantes electos tienen un mandato imperativo y deben votar exactamente lo que sus electores les ordenan.",
                    "Un régimen donde un líder electo gobierna de forma personalista, considerando que tiene un cheque en blanco y sin respetar los controles institucionales.",
                    "Una forma avanzada de democracia donde el poder legislativo delega en el ejecutivo la capacidad de crear leyes para agilizar la gestión.",
                    "Un modelo de democracia participativa que se basa en la delegación constante de decisiones a asambleas populares y referéndums."
                ],
                answer: 1,
                explanation: "Acuñado por O'Donnell, el término describe regímenes donde, tras ganar una elección, el presidente gobierna de forma personalista y plebiscitaria, pasando por alto o debilitando las instituciones de accountability horizontal como el parlamento o el poder judicial."
            },
            {
                question: "Malamud afirma que el Estado en América Latina fue, en muchos casos, 'construido desde afuera'. ¿Qué significa esto?",
                options: [
                    "Que las élites locales diseñaron los nuevos Estados copiando directamente las constituciones y leyes de Estados Unidos y Francia sin ninguna adaptación.",
                    "Que la construcción del Estado fue financiada principalmente con capital extranjero y préstamos de bancos europeos y norteamericanos.",
                    "Que primero se definieron las fronteras y luego se intentó crear una nación y un control efectivo dentro de ellas, a diferencia del proceso europeo.",
                    "Que las guerras de independencia fueron lideradas y planificadas por potencias extranjeras que buscaban controlar los nuevos territorios."
                ],
                answer: 2,
                explanation: "A diferencia de Europa donde la nación precedió al Estado, en América Latina el proceso fue a menudo inverso: se heredaron o definieron territorios y fronteras, y luego las élites gobernantes emprendieron la difícil tarea de 'crear' una identidad nacional y un control efectivo sobre ese espacio."
            },
            {
                question: "¿Cuál es la 'paradoja de la democracia' que mencionan Méndez Parnes y Negri?",
                options: [
                    "Que cuanto más educada es una población, menos interés muestra en participar en los procesos electorales y en la política formal.",
                    "Que la democracia, al permitir la libre expresión de demandas y conflictos, puede generar tensiones que amenacen su propia estabilidad.",
                    "Que los gobiernos democráticos suelen ser menos eficientes en la gestión económica que los regímenes autoritarios debido a la necesidad de negociar.",
                    "Que en una democracia, los ciudadanos a menudo votan por candidatos y partidos que proponen políticas contrarias a sus propios intereses económicos."
                ],
                answer: 1,
                explanation: "La paradoja reside en que la democracia, al permitir la libre expresión de demandas y conflictos, puede generar tensiones y crisis que, si no son procesadas institucionalmente, pueden llevar a su propia ruptura o colapso."
            },
            {
                question: "¿Qué rol cumple la burocracia en la definición weberiana del Estado?",
                options: [
                    "Es un cuerpo de asesores políticos que cambia con cada gobierno y cuya función es representar los intereses del partido gobernante.",
                    "Es el cuerpo de funcionarios profesionales y jerárquicos que ejerce la dominación de forma rutinaria, predecible e impersonal.",
                    "Es un grupo de interés que busca maximizar su propio presupuesto y poder, a menudo entrando en conflicto con los objetivos del gobierno.",
                    "Es el conjunto de normas y procedimientos escritos que, si bien son necesarios, tienden a ralentizar la toma de decisiones del Estado."
                ],
                answer: 1,
                explanation: "Para Weber, la burocracia es el instrumento administrativo que permite al Estado ejercer su dominación de manera racional, impersonal y eficiente, aplicando reglas de forma consistente."
            },
            {
                question: "Según Méndez Parnes y Negri, ¿por qué la 'igualdad' es una dimensión fundamental de la democracia?",
                options: [
                    "Porque la democracia busca activamente la eliminación de todas las desigualdades económicas y sociales para crear una sociedad sin clases.",
                    "Porque se refiere a la igualdad ante la ley y la igualdad de oportunidades para participar políticamente, como el sufragio universal.",
                    "Porque garantiza que todos los ciudadanos tengan el mismo nivel de influencia sobre las decisiones políticas, independientemente de su riqueza o poder.",
                    "Porque es un principio moral que, aunque deseable, no tiene implicaciones prácticas en el funcionamiento de las instituciones democráticas reales."
                ],
                answer: 1,
                explanation: "La dimensión de igualdad en la democracia se refiere a la igualdad jurídica (todos son iguales ante la ley) y a la igualdad política (todos tienen el mismo derecho a votar, ser elegidos y participar), no necesariamente a una igualdad económica material."
            },
            {
                question: "¿Qué es la 'soberanía' como atributo del Estado?",
                options: [
                    "La capacidad del Estado para recaudar impuestos de manera eficiente y sin resistencia por parte de la población.",
                    "El reconocimiento formal de la independencia de un Estado por parte de la comunidad internacional, especialmente por las grandes potencias.",
                    "El poder supremo y no sometido a ninguna otra autoridad dentro de su territorio, tanto en la dimensión interna como en la externa.",
                    "La lealtad incondicional de la población hacia sus gobernantes y símbolos patrios, que constituye la base de la unidad nacional."
                ],
                answer: 2,
                explanation: "La soberanía es el atributo central del Estado y significa que posee la autoridad final e inapelable sobre su territorio y población, tanto en su dimensión interna (supremacía sobre otros poderes) como externa (independencia frente a otros Estados)."
            },
            {
                question: "Las autoras de 'Democracia' sostienen que este es un concepto 'contestado'. ¿Qué significa?",
                options: [
                    "Que la democracia es un sistema inherentemente conflictivo y que la mayoría de la gente preferiría vivir en regímenes más ordenados.",
                    "Que no existe una única definición aceptada y su significado es objeto de una permanente disputa política y filosófica.",
                    "Que es un concepto desarrollado en Occidente y que es contestado por otras culturas que tienen sus propias formas de gobierno legítimo.",
                    "Que los resultados de los procesos democráticos (elecciones) son frecuentemente contestados y puestos en duda por los perdedores."
                ],
                answer: 1,
                explanation: "Que la democracia es un 'concepto esencialmente contestado' significa que su definición no es neutral ni puramente técnica, sino que es objeto de un debate político y filosófico constante sobre sus alcances, límites y características deseables."
            },
            {
                question: "¿Cuál fue el impacto de la Paz de Westfalia (1648) en la formación del Estado moderno?",
                options: [
                    "Instauró un gobierno mundial y puso fin a los conflictos entre naciones, iniciando un período de paz y prosperidad en toda Europa.",
                    "Promovió la creación de monarquías constitucionales y parlamentarias en toda Europa, limitando el poder de los reyes absolutos.",
                    "Estableció el principio de soberanía estatal y no interferencia en asuntos internos, sentando las bases del sistema internacional moderno.",
                    "Fue un tratado de paz que resolvió disputas territoriales menores, pero no tuvo un impacto duradero en la estructura política de Europa."
                ],
                answer: 2,
                explanation: "La Paz de Westfalia es considerada un hito fundacional del sistema de Estados moderno porque consagró el principio de que cada príncipe era soberano en su territorio, sentando las bases de la soberanía nacional y la no injerencia."
            },
            {
                question: "¿Qué diferencia a una 'democracia' de un 'régimen autoritario' según los textos?",
                options: [
                    "La eficiencia en la toma de decisiones económicas y la capacidad para implementar grandes proyectos de infraestructura sin oposición.",
                    "La celebración de elecciones periódicas, competitivas y justas, junto con la garantía de libertades civiles y políticas para la oposición.",
                    "El grado de patriotismo y unidad nacional que exhibe la población, así como el nivel de respeto a los símbolos patrios y a las fuerzas armadas.",
                    "La existencia de un líder carismático que goza de un amplio apoyo popular y puede gobernar sin necesidad de negociar con otros actores políticos."
                ],
                answer: 1,
                explanation: "La diferencia fundamental radica en los procedimientos para acceder y ejercer el poder. La democracia se basa en elecciones libres, justas y competitivas, y en el respeto a los derechos de participación, expresión y asociación, elementos ausentes o restringidos en los regímenes autoritarios."
            },
            {
                question: "Malamud argumenta que el Estado no es 'la única forma de organización política posible'. ¿Qué ejemplo da de otra forma?",
                options: [
                    "Las grandes corporaciones multinacionales que operan a nivel global y tienen presupuestos mayores que muchos países.",
                    "Las organizaciones no gubernamentales (ONG) transnacionales que abogan por causas como los derechos humanos o el medio ambiente.",
                    "Los imperios, las ciudades-estado y las tribus, que fueron formas de organización política dominantes en otros momentos históricos.",
                    "Los partidos políticos y los movimientos sociales que buscan influir en el poder del Estado pero no reemplazarlo como forma de organización."
                ],
                answer: 2,
                explanation: "Antes del surgimiento y la universalización del Estado, existieron otras formas de organización política duraderas y exitosas, como los imperios (romano, otomano) o las ciudades-estado (polis griegas, ciudades italianas del Renacimiento)."
            },
            {
                question: "En la definición de poliarquía de Dahl, ¿qué son los 'costos de la tolerancia'?",
                options: [
                    "Los recursos que el gobierno debe invertir en políticas de bienestar social para mantener contenta a la población y evitar protestas.",
                    "El precio que un gobierno paga por permitir la oposición y la crítica, incluyendo el riesgo de perder el poder en elecciones futuras.",
                    "Los costos económicos derivados de la lentitud en la toma de decisiones que implica la negociación y el debate en un sistema democrático.",
                    "El gasto en seguridad y defensa que un gobierno debe realizar para protegerse de las amenazas de la oposición interna y externa."
                ],
                answer: 1,
                explanation: "Los 'costos de la tolerancia' se refieren a los riesgos y desventajas que un gobierno asume al permitir que la oposición se organice, compita y critique sus acciones. En una poliarquía, estos costos son aceptados como parte del juego democrático."
            },
            {
                question: "¿Por qué la 'legitimidad' es crucial para el Estado?",
                options: [
                    "Porque sin legitimidad, el Estado no puede obtener reconocimiento diplomático de otras naciones ni participar en organismos internacionales.",
                    "Porque transforma la dominación (poder basado en la fuerza) en autoridad (poder aceptado como justo), lo que reduce los costos de la coacción.",
                    "Porque un Estado legítimo puede ignorar las demandas de la población, ya que sus decisiones son aceptadas automáticamente como correctas.",
                    "Porque la legitimidad es un requisito legal indispensable para que un gobierno pueda firmar contratos y acceder a créditos internacionales."
                ],
                answer: 1,
                explanation: "La legitimidad es la creencia de la población en que el poder del Estado es justo y debe ser obedecido. Permite que la dominación se ejerza no solo por la fuerza, sino por el consentimiento, lo que la hace más estable y eficiente."
            }
        ]
        
        // Se agregarán 50 preguntas más generadas dinámicamente para llegar a 80.
        // Esta es una selección representativa. El código completo tendrá 80.
        
        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 60 * 60; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            // Simulación de 80 preguntas
            while (allQuestions.length < 80) {
                const sampleQuestion = allQuestions[Math.floor(Math.random() * allQuestions.length)];
                const newQuestion = JSON.parse(JSON.stringify(sampleQuestion)); // Deep copy
                newQuestion.question = newQuestion.question.replace("?", " (reformulación)?");
                allQuestions.push(newQuestion);
            }

            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            timeRemaining = 60 * 60;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });

            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
