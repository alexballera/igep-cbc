    <script>
        const allQuestions = [
            {
                question: "Según Malamud, ¿cuál es la definición mínima de partido político basada en Sartori?",
                options: [
                    "Un grupo de ciudadanos organizados para debatir ideas políticas, pero sin la intención de ocupar cargos formales en el gobierno.",
                    "Una organización que recibe financiamiento estatal para promover la participación cívica y la educación política de la población.",
                    "Cualquier grupo político identificado con una etiqueta oficial que presenta a las elecciones y puede colocar candidatos en cargos públicos.",
                    "Una facción interna de un gobierno que busca influir en la toma de decisiones del poder ejecutivo sin competir en elecciones."
                ],
                answer: 2,
                explanation: "Malamud, citando a Sartori, establece que la definición mínima es cualquier grupo político identificado con una etiqueta oficial que se presenta a elecciones y puede colocar a sus candidatos en cargos públicos a través de ellas."
            },
            {
                question: "¿Cuál de las siguientes NO es una de las funciones de los partidos políticos según Malamud?",
                options: [
                    "La agregación y filtro de demandas sociales para estructurar la competencia electoral.",
                    "El reclutamiento de élites y personal político para ocupar cargos en el gobierno.",
                    "La ejecución directa de sentencias judiciales y la administración del sistema penitenciario nacional.",
                    "La movilización e integración social de la ciudadanía en el proceso político democrático."
                ],
                answer: 2,
                explanation: "La administración de justicia es una función exclusiva del Poder Judicial. Los partidos se centran en funciones ascendentes (agregación de demandas, movilización) y descendentes (reclutamiento, toma de decisiones)."
            },
            {
                question: "Según el texto, ¿quién estableció la distinción formal entre 'facciones' y 'partidos políticos'?",
                options: [
                    "Giovanni Sartori en sus estudios sobre sistemas de partidos del siglo XX.",
                    "Edmund Burke a finales del siglo XVIII, reconociendo que las divergencias sociales son ineludibles.",
                    "Maurice Duverger en su análisis de los orígenes parlamentarios de los partidos políticos.",
                    "Robert Dahl en su teoría sobre la poliarquía y la competencia democrática."
                ],
                answer: 1,
                explanation: "Edmund Burke, a finales del siglo XVIII (1770), estableció la distinción formal, reconociendo que las divergencias sociales son ineludibles y pueden ser canalizadas institucionalmente para el bien común."
            },
            {
                question: "¿Cuál fue el evento histórico considerado como el 'acta de nacimiento formal' de los partidos políticos modernos?",
                options: [
                    "La Revolución Francesa de 1789 y la creación de la Asamblea Nacional.",
                    "La independencia de Estados Unidos en 1776 y la formación del sistema bipartidista.",
                    "La Reform Act de 1832 en Inglaterra que amplió la participación electoral.",
                    "La unificación alemana de 1871 y el surgimiento del Partido Socialdemócrata."
                ],
                answer: 2,
                explanation: "La Reform Act de 1832 en Inglaterra es considerada el 'acta de nacimiento formal' de los partidos modernos, marcando la transición de asociaciones políticas sectoriales a organizaciones formalizadas."
            },
            {
                question: "En la tipología de Panebianco/Malamud, ¿cuáles son los tres ejes principales para clasificar los partidos políticos?",
                options: [
                    "Su base social, su orientación ideológica y su estructura organizativa.",
                    "Su financiamiento, su alcance territorial y su antigüedad histórica.",
                    "Su relación con el Estado, su composición de género y su metodología electoral.",
                    "Su origen parlamentario, su disciplina interna y su capacidad de movilización."
                ],
                answer: 0,
                explanation: "Los tres ejes son: 1) Su base social (qué grupos representan), 2) Su orientación ideológica (objetivos y programas), y 3) Su estructura organizativa (cómo están internamente organizados)."
            },
            {
                question: "¿Cuál es la principal característica de los 'partidos de notables' o de representación individual?",
                options: [
                    "Surgieron con el sufragio universal y se caracterizan por una fuerte disciplina partidaria.",
                    "Dependen de figuras prominentes y familias influyentes, con escasa organización formal y financiamiento propio.",
                    "Se enfocan en captar el mayor electorado posible mediante mensajes difusos y profesionales de campaña.",
                    "Tienen una estructura burocrática poderosa y están fuertemente ideologizados con una relación vertical."
                ],
                answer: 1,
                explanation: "Los partidos de notables (siglo XIX) dependían de 'notables' (familias, caballeros) que los patrocinaban, tenían escasa organización formal, y sus representantes gozaban de absoluta libertad parlamentaria."
            },
            {
                question: "¿Qué distingue a los 'partidos burocráticos de masas' de otros tipos de partidos?",
                options: [
                    "Su dependencia de financiamiento empresarial y su enfoque en temas de coyuntura electoral.",
                    "Su origen en familias prominentes y la libertad absoluta de sus representantes parlamentarios.",
                    "Su fuerte ideologización, estructura burocrática poderosa y estricta disciplina partidaria vertical.",
                    "Su capacidad de adaptación ideológica y su objetivo de captar el electorado más amplio posible."
                ],
                answer: 2,
                explanation: "Los partidos burocráticos de masas (fines siglo XIX-principios XX) se caracterizan por estar fuertemente ideologizados, tener una poderosa estructura burocrática y mantener estricta disciplina partidaria."
            },
            {
                question: "¿Cuál es la característica principal de los 'partidos profesionales-electorales' o 'catch-all'?",
                options: [
                    "Mantienen una ideología muy rígida y una disciplina partidaria estricta para preservar su identidad.",
                    "Se basan en el financiamiento de familias prominentes y notables de la sociedad tradicional.",
                    "Buscan captar el mayor electorado posible con ideologías difusas y dependencia de profesionales de campaña.",
                    "Organizan a los trabajadores bajo una estructura burocrática centralizada con fuerte movilización social."
                ],
                answer: 2,
                explanation: "Los partidos catch-all (último cuarto siglo XX) tienen ideología menos rígida y más difusa, buscan captar el mayor electorado posible, y dependen de profesionales de campaña y financiación externa."
            },
            {
                question: "Según Malamud, ¿cuáles son las funciones 'ascendentes' de los partidos políticos?",
                options: [
                    "Reclutamiento de élites, toma de decisiones y formación ideológica de militantes.",
                    "Agregación de demandas, movilización social y estructuración del voto ciudadano.",
                    "Captación de votos, institucionalización partidaria y control del poder legislativo.",
                    "Formación de coaliciones, negociación parlamentaria y administración del Estado."
                ],
                answer: 1,
                explanation: "Las funciones ascendentes van de la sociedad hacia el Estado: agregación y filtro de demandas sociales, movilización e integración social, y estructuración del voto."
            },
            {
                question: "¿Qué son las funciones 'descendentes' de los partidos políticos según Malamud?",
                options: [
                    "La estructuración del voto, la movilización ciudadana y la agregación de demandas sociales.",
                    "El reclutamiento de élites, la toma de decisiones, la formación ideológica y la captación de votos.",
                    "La representación parlamentaria, el control judicial y la administración de servicios públicos.",
                    "La organización de elecciones, la supervisión electoral y la validación de resultados electorales."
                ],
                answer: 1,
                explanation: "Las funciones descendentes van del Estado hacia la sociedad: reclutamiento de élites, toma de decisiones y programas de gobierno, formación ideológica, captación de votos e institucionalización."
            },
            {
                question: "En la tipología de sistemas de partidos de Sartori, ¿qué distingue un sistema 'bipartidista'?",
                options: [
                    "La presencia de exactamente dos partidos legalmente reconocidos en el sistema político.",
                    "La competencia efectiva entre dos partidos principales con posibilidades reales de alternar en el gobierno.",
                    "Un partido predominante que compite formalmente con otro partido de menor relevancia electoral.",
                    "La división del espectro político en solo dos posiciones ideológicas claramente definidas."
                ],
                answer: 1,
                explanation: "Un sistema bipartidista se caracteriza por la competencia efectiva entre dos partidos con posibilidades reales de alternar en el gobierno, manteniendo competencia bipolar."
            },
            {
                question: "¿Qué diferencia el 'multipartidismo limitado' del 'multipartidismo extremo polarizado' según Sartori?",
                options: [
                    "El número de partidos: el limitado tiene 3-4 partidos mientras el extremo tiene más de 10 partidos.",
                    "El limitado converge al centro con competencia centrípeta, mientras el extremo se polariza con competencia centrífuga.",
                    "El limitado permite coaliciones estables mientras el extremo solo permite gobiernos de partido único.",
                    "El limitado existe en sistemas presidenciales mientras el extremo solo se da en sistemas parlamentarios."
                ],
                answer: 1,
                explanation: "El multipartidismo limitado (2-5 partidos) converge al centro con competencia centrípeta y bipolar, mientras el extremo (más de 5 partidos) se polariza ideológicamente con competencia centrífuga y multipolar."
            },
            {
                question: "Según Méndez Parnes y Negri, ¿cómo definen la democracia?",
                options: [
                    "Un sistema económico que garantiza la igualdad de oportunidades para todos los ciudadanos.",
                    "Un régimen político con reglas que determinan quién ejerce el poder y cómo será ejercido, con gobernantes limitados por la ciudadanía.",
                    "Una forma de gobierno donde las decisiones se toman exclusivamente mediante referéndums y consultas populares directas.",
                    "Un mecanismo de representación que permite a las élites educadas tomar decisiones en nombre del pueblo soberano."
                ],
                answer: 1,
                explanation: "Méndez Parnes y Negri definen la democracia como un régimen político con reglas que determinan quién ejerce el poder y cómo será ejercido, donde los gobernantes están limitados por la ciudadanía."
            },
            {
                question: "¿Cuál era una limitación fundamental de la democracia directa ateniense?",
                options: [
                    "La falta de tecnología para comunicarse efectivamente entre los ciudadanos dispersos geográficamente.",
                    "La restricción de la ciudadanía a hombres atenienses mayores de edad, excluyendo mujeres, extranjeros y esclavos.",
                    "La ausencia de partidos políticos organizados que pudieran estructurar las preferencias ciudadanas.",
                    "La interferencia constante de otros estados griegos en los asuntos internos de la polis ateniense."
                ],
                answer: 1,
                explanation: "La ciudadanía ateniense era muy restrictiva: solo incluía a hombres varones, atenienses de nacimiento, mayores de 20 años, excluyendo a mujeres, extranjeros (metecos) y esclavos."
            },
            {
                question: "¿Por qué la democracia directa es considerada inviable en las sociedades modernas?",
                options: [
                    "Porque los ciudadanos modernos carecen de la educación necesaria para tomar decisiones políticas complejas.",
                    "Debido al gran tamaño territorial, alta densidad demográfica, multiculturalidad y complejidad social moderna.",
                    "Porque los medios de comunicación masiva distorsionan la información y manipulan la opinión pública.",
                    "Debido a que los intereses económicos de las corporaciones dominan las decisiones políticas ciudadanas."
                ],
                answer: 1,
                explanation: "La democracia directa es inviable por el gran tamaño territorial, alta densidad demográfica, multiculturalidad, multilingüismo y la complejidad de las sociedades modernas."
            },
            {
                question: "¿Qué significa que la ciudadanía es un 'concepto dinámico' según el texto?",
                options: [
                    "Que los derechos ciudadanos cambian diariamente según las decisiones del gobierno de turno.",
                    "Que la ciudadanía se construye, muta y cambia según el contexto político y las condiciones estructurales.",
                    "Que solo los ciudadanos más activos políticamente pueden ejercer plenamente sus derechos políticos.",
                    "Que la participación ciudadana depende exclusivamente de los niveles de educación de la población."
                ],
                answer: 1,
                explanation: "La ciudadanía es dinámica porque se construye, muta y cambia según el contexto político y las condiciones estructurales, ampliándose históricamente (ej: voto femenino 1947, voto joven 2016)."
            },
            {
                question: "¿Cuáles son los 8 requisitos procedimentales de la poliarquía según Robert Dahl?",
                options: [
                    "Derecho al voto, ser electo, competir por votos, elecciones libres, libertad de asociación, expresión, prensa, e instituciones dependientes del voto.",
                    "Separación de poderes, federalismo, bicameralismo, control judicial, alternancia, representación proporcional, referéndums y recall.",
                    "Igualdad ante la ley, debido proceso, habeas corpus, presunción de inocencia, defensa pública, juicio justo, apelación y amnistía.",
                    "Educación pública, salud universal, seguridad social, vivienda digna, trabajo decente, medio ambiente sano, cultura y deporte."
                ],
                answer: 0,
                explanation: "Los 8 requisitos de Dahl son: derecho al voto, derecho a ser electo, derecho de líderes a competir por el voto, elecciones libres y justas, libertad de asociación, expresión, prensa, e instituciones públicas dependientes del voto popular."
            },
            {
                question: "¿Qué diferencia las visiones 'minimalistas' de las 'maximalistas' de la democracia?",
                options: [
                    "Las minimalistas se enfocan en procedimientos electorales mientras las maximalistas incluyen participación, igualdad socioeconómica y valores sustantivos.",
                    "Las minimalistas requieren más instituciones mientras las maximalistas prefieren estructuras gubernamentales simples.",
                    "Las minimalistas favorecen sistemas presidenciales mientras las maximalistas prefieren sistemas parlamentarios.",
                    "Las minimalistas enfatizan derechos individuales mientras las maximalistas priorizan derechos colectivos."
                ],
                answer: 0,
                explanation: "Las visiones minimalistas se centran en procedimientos electorales y competencia por el poder, mientras las maximalistas incluyen debate público participativo, igualdad socioeconómica, control extra-institucional y valores sustantivos."
            },
            {
                question: "¿Qué es una 'democracia delegativa' según Guillermo O'Donnell?",
                options: [
                    "Un sistema donde los representantes delegan sus decisiones a comités de expertos técnicos especializados.",
                    "Un régimen donde la ciudadanía delega todo el poder al representante electo, quien gobierna individualmente sin control.",
                    "Una forma de gobierno donde el poder ejecutivo delega funciones importantes al poder legislativo.",
                    "Un sistema político donde los partidos delegan la selección de candidatos a las bases militantes."
                ],
                answer: 1,
                explanation: "La democracia delegativa implica que la ciudadanía delega la totalidad del poder en el representante electo, quien ejerce liderazgo individualista con ciudadanía pasiva y debilidad del control horizontal."
            },
            {
                question: "¿Cuál es la diferencia principal entre accountability horizontal y vertical?",
                options: [
                    "El horizontal se refiere a control ciudadano mientras el vertical se refiere a control entre instituciones gubernamentales.",
                    "El horizontal es control entre instituciones de gobierno mientras el vertical es la obligación de rendir cuentas a la ciudadanía.",
                    "El horizontal funciona en sistemas federales mientras el vertical opera en sistemas unitarios.",
                    "El horizontal es formal y legal mientras el vertical es informal y social."
                ],
                answer: 1,
                explanation: "El accountability horizontal es el control mutuo entre instituciones de gobierno (Ejecutivo, Legislativo, Judicial), mientras el vertical es la obligación de rendir cuentas a la ciudadanía a través de elecciones y participación."
            },
            {
                question: "¿Qué caracteriza a las 'democracias consolidadas' según el texto?",
                options: [
                    "Altos niveles de calidad democrática, tradiciones pluralistas, sociedades homogéneas, corrección de desigualdades y sociedad civil activa.",
                    "Sistemas bipartidistas estables, alternancia regular en el poder, ausencia de conflictos sociales y crecimiento económico sostenido.",
                    "Gobiernos de coalición permanentes, representación proporcional perfecta, consenso total y ausencia de oposición política.",
                    "Federalismo descentralizado, separación estricta de poderes, sistema judicial independiente y medios de comunicación estatales."
                ],
                answer: 0,
                explanation: "Las democracias consolidadas se caracterizan por altos niveles de calidad democrática, tradiciones pluralistas arraigadas, sociedades relativamente homogéneas, capacidad para corregir desigualdades, sociedad civil activa y alta institucionalización política."
            },
            {
                question: "Según las teorías institucionales de Duverger, ¿cómo pueden originarse los partidos políticos?",
                options: [
                    "Exclusivamente a través de movimientos sociales que luego se institucionalizan como partidos políticos.",
                    "Por creación interna (dentro del parlamento) o por creación externa (desde la sociedad hacia el parlamento).",
                    "Únicamente mediante la fusión de facciones preexistentes que deciden unificar sus fuerzas políticas.",
                    "Solamente a través de la división de partidos grandes que se fragmentan por diferencias ideológicas."
                ],
                answer: 1,
                explanation: "Duverger identifica dos formas: creación interna (organizaciones auxiliares para coordinar legisladores dentro del parlamento) y creación externa (formación desde la sociedad hacia el parlamento)."
            },
            {
                question: "¿Cuáles son los cuatro clivajes identificados por Lipset y Rokkan en la formación de partidos europeos?",
                options: [
                    "Liberales-conservadores, socialistas-capitalistas, nacionalistas-internacionalistas, religiosos-seculares.",
                    "Centro-periferia, Estado-Iglesia, campo-ciudad, capital-trabajo.",
                    "Monarquía-república, federalismo-centralismo, proteccionismo-librecambio, militarismo-pacifismo.",
                    "Aristocracia-burguesía, urbano-rural, católico-protestante, industrial-agrícola."

            timeRemaining = 60 * 60;
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            startTimer();
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;
            const options = [...currentQuestionData.options];
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;
            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });
            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `<div class="font-bold mb-2">¡Respuesta Incorrecta!</div><div class="explanation"><strong class="text-indigo-700">Explicación:</strong><p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p></div>`;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }
            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
