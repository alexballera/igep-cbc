    <script>
        const allQuestions = [
            {
                question: "Según Acuña y Chudnovsky, ¿cuál es la pregunta central que plantea el debate sobre las instituciones en las ciencias sociales?",
                options: [
                    "¿Cómo medir la eficiencia económica de diferentes arreglos institucionales?",
                    "¿Son las instituciones las que forjan los procesos sociales o son los procesos sociales los que crean su institucionalidad?",
                    "¿Qué tipo de instituciones son más efectivas para promover la democracia?",
                    "¿Cómo pueden las instituciones adaptarse al cambio tecnológico?"
                ],
                answer: 1,
                explanation: "Los autores identifican esta como la pregunta fundamental que orienta todo el debate sobre la relevancia de las instituciones para explicar procesos políticos y sociales, remitiendo a si los problemas sociales radican en la institucionalidad."
            },
            {
                question: "En el ejemplo de la 'cárcel de vacas' de Nepal presentado por Anderies y Janssen, ¿cuál es el principio institucional fundamental que se ilustra?",
                options: [
                    "La superioridad de las sanciones económicas sobre las físicas",
                    "El uso de la vergüenza pública como mecanismo de control social para asegurar el cumplimiento de reglas comunitarias",
                    "La importancia de la propiedad privada en sistemas de riego",
                    "La necesidad de autoridades centralizadas para resolver conflictos"
                ],
                answer: 1,
                explanation: "El ejemplo ilustra cómo la vergüenza pública funciona como mecanismo efectivo de sanción social, donde la comunidad puede identificar al infractor y aplicar presión social para asegurar el cumplimiento de las reglas de uso del sistema de riego."
            },
            {
                question: "Según Acuña y Chudnovsky, ¿qué caracteriza la respuesta del marxismo hacia las instituciones?",
                options: [
                    "Las considera como motor principal del cambio histórico",
                    "Las define como consecuencia o epifenómeno de profundas dinámicas estructural-económicas",
                    "Las ve como instrumentos neutrales de coordinación social",
                    "Las conceptualiza como variables independientes del sistema económico"
                ],
                answer: 1,
                explanation: "Los autores señalan que el marxismo vació el peso de las instituciones definiéndolas como consecuencia de dinámicas estructural-económicas más profundas, donde las instituciones simplemente expresan en palabras la voluntad de las relaciones económicas."
            },
            {
                question: "En el marco ADI, ¿qué define una 'arena de acción' según Anderies y Janssen?",
                options: [
                    "Un espacio físico donde ocurren las interacciones",
                    "Un conjunto de reglas formales escritas",
                    "El espacio social donde participantes con diferentes preferencias interactúan, intercambian bienes y servicios, y resuelven problemas",
                    "Una institución gubernamental específica"
                ],
                answer: 2,
                explanation: "Una arena de acción se refiere al espacio social donde los participantes interactúan en el contexto de una situación de acción específica, distinguiéndose de la situación de acción que proporciona la estructura institucional."
            },
            {
                question: "¿Cómo conceptualizan Acuña y Chudnovsky la 'matriz política'?",
                options: [
                    "Como un conjunto de instituciones formales únicamente",
                    "Como un sistema de variables socioestructurales, político-institucionales e ideológico-culturales que fija límites de factibilidad y define probabilidades diferenciales",
                    "Como la estructura organizacional del Estado",
                    "Como el conjunto de actores políticos en un momento dado"
                ],
                answer: 1,
                explanation: "La matriz política constituye un sistema integral que incluye variables socioestructurales, político-institucionales e ideológico-culturales que: a) fija límites de factibilidad, b) define probabilidades diferenciales para alcanzar objetivos, y c) brinda mapeo del funcionamiento de relaciones sociales."
            },
            {
                question: "Según Anderies y Janssen, ¿cuál es la diferencia fundamental entre 'reglas' y 'normas'?",
                options: [
                    "Las reglas son siempre escritas mientras que las normas son orales",
                    "Las reglas tienen sanciones legales mientras que las normas tienen sanciones sociales",
                    "No existe diferencia conceptual significativa entre ambas",
                    "Las reglas son más formales y las normas más informales, pero ambas estructuran interacciones humanas"
                ],
                answer: 3,
                explanation: "Los autores presentan reglas y normas como tipos de disposiciones que los humanos usan para organizar interacciones, siendo ambas constructos humanos acordados por grupos, susceptibles de transformación, donde la distinción radica en el grado de formalización."
            },
            {
                question: "En la crítica de Acuña y Chudnovsky al neoinstitucionalismo, ¿cuál es el principal problema que identifican con el enfoque funcionalista?",
                options: [
                    "Su excesiva complejidad teórica",
                    "Su incapacidad para reconocer que el conflicto es constitutivo de los procesos políticos",
                    "Su falta de rigor metodológico",
                    "Su sesgo hacia instituciones informales"
                ],
                answer: 1,
                explanation: "Los autores critican que el neoinstitucionalismo, al centrarse en problemas de coordinación y reducción de costos de transacción, no reconoce adecuadamente que el conflicto es necesaria e ineludiblemente constitutivo de los procesos políticos."
            },
            {
                question: "¿Cómo definen Anderies y Janssen las 'variables exógenas' en el marco ADI?",
                options: [
                    "Variables que no afectan la arena de acción",
                    "Variables que incluyen condiciones biofísicas, atributos de la comunidad y reglas en uso que afectan la estructura de la arena de acción",
                    "Variables económicas externas únicamente",
                    "Variables que cambian constantemente durante el análisis"
                ],
                answer: 1,
                explanation: "Las variables exógenas son el contexto más amplio que afecta la arena de acción, compuesto por tres grupos: condiciones biofísicas, atributos de la comunidad y reglas en uso, que se consideran fijas para propósitos del análisis."
            },
            {
                question: "Según Acuña y Chudnovsky, ¿qué significa que un actor tenga 'capacidad de salida' (exit)?",
                options: [
                    "La habilidad de abandonar físicamente un territorio",
                    "La capacidad de dejar una organización política",
                    "La posibilidad de evitar costos abandonando una situación estratégica desventajosa o usar esa capacidad como presión hacia otros actores",
                    "El derecho legal a terminar contratos"
                ],
                answer: 2,
                explanation: "La capacidad de 'salida' implica no solo poder evitar costos al abandonar situaciones desventajosas, sino también utilizar esa capacidad como forma de presión o chantaje hacia otros actores en la arena política."
            },
            {
                question: "En el análisis de Anderies y Janssen sobre diversidad institucional, ¿por qué las mismas reglas pueden producir resultados diferentes en contextos distintos?",
                options: [
                    "Porque las reglas son siempre interpretadas incorrectamente",
                    "Porque las condiciones biofísicas, culturales y comunitarias afectan la implementación y efectividad de las reglas",
                    "Porque los actores siempre buscan evadir las reglas",
                    "Porque las reglas pierden efectividad con el tiempo"
                ],
                answer: 1,
                explanation: "Los autores enfatizan que el mismo conjunto de reglas puede promover arenas de acción totalmente diferentes dependiendo del contexto biofísico, cultural y comunitario en el que se implementan."
            },
            {
                question: "¿Cómo abordan Acuña y Chudnovsky la relación entre intereses 'subjetivos' y 'objetivos' de los actores?",
                options: [
                    "Priorizan exclusivamente los intereses subjetivos",
                    "Consideran solo los intereses objetivos como válidos",
                    "Proponen una aproximación que incorpora ambas dimensiones sin verlas como dicotomía excluyente",
                    "Niegan la existencia de intereses objetivos"
                ],
                answer: 2,
                explanation: "Los autores proponen una postura que incorpora tanto lo que los actores dicen que son sus intereses (subjetivo) como lo que afecta objetivamente su bienestar, contemplando además el grado de rendición de cuentas y intereses no expresados."
            },
            {
                question: "Según Anderies y Janssen, ¿qué característica fundamental distingue a los seres humanos en el cumplimiento de reglas respecto a fenómenos físicos o biológicos?",
                options: [
                    "Los humanos siempre cumplen las reglas perfectamente",
                    "Los humanos son reflexivos, tienen valores morales y pueden elegir no obedecer instrucciones",
                    "Los humanos no pueden entender reglas complejas",
                    "Los humanos solo responden a incentivos económicos"
                ],
                answer: 1,
                explanation: "Los autores destacan que el comportamiento humano no es tan predecible como fenómenos biológicos o físicos porque los seres humanos son reflexivos, tienen opiniones y valores morales, y pueden elegir no obedecer."
            },
            {
                question: "En la conceptualización de Acuña y Chudnovsky sobre el Estado, ¿cómo articulan la dimensión de 'relación social' con la de 'aparato estatal'?",
                options: [
                    "Son dimensiones completamente separadas",
                    "El aparato estatal es la única dimensión relevante",
                    "El Estado como relación social establece un orden asimétrico respaldado por garantía coercitiva, mientras el aparato estatal implementa políticas públicas con potencial autonomía",
                    "Solo la dimensión de relación social es importante"
                ],
                answer: 2,
                explanation: "Los autores integran ambas dimensiones: el Estado como relación social establece un orden asimétrico en el territorio con garantía coercitiva centralizada, mientras como aparato estatal implementa políticas públicas que materializan esa capacidad de ejercer poder."
            },
            {
                question: "¿Qué entienden Anderies y Janssen por 'reglas en uso' (de facto) versus 'reglas en el papel' (de jure)?",
                options: [
                    "Son exactamente lo mismo en la práctica",
                    "Las reglas en uso son las normas que efectivamente se siguen en la práctica, que pueden diferir de las reglas escritas formalmente",
                    "Solo las reglas escritas tienen importancia real",
                    "Las reglas en uso son siempre superiores a las escritas"
                ],
                answer: 1,
                explanation: "Los autores distinguen entre las reglas formalmente establecidas y las normas que efectivamente guían el comportamiento en la práctica, reconociendo que frecuentemente pueden diferir significativamente."
            },
            {
                question: "Según Acuña y Chudnovsky, ¿cómo operan las instituciones en relación con la distribución del poder en la sociedad?",
                options: [
                    "Las instituciones distribuyen poder de manera neutral",
                    "Las instituciones solo reflejan distribuciones de poder preexistentes",
                    "Las instituciones distribuyen poder pero pueden tanto reflejar distribuciones previas como redefinirlas, siendo esto último fuente de conflicto",
                    "Las instituciones son irrelevantes para la distribución del poder"
                ],
                answer: 2,
                explanation: "Los autores señalan que las instituciones distribuyen poder en contextos donde este ya está predistribuido, y el desafío radica en si meramente reflejan esa distribución previa o logran redefinirla, siendo esto último fuente de conflicto."
            },
            {
                question: "En el marco ADI, ¿cómo conceptualizan Anderies y Janssen la retroalimentación (feedback) en las arenas de acción?",
                options: [
                    "Como un proceso lineal sin efectos recursivos",
                    "Como el proceso por el cual los resultados afectan a los participantes y pueden transformar la situación de acción a lo largo del tiempo",
                    "Como un mecanismo que solo opera a corto plazo",
                    "Como irrelevante para el análisis institucional"
                ],
                answer: 1,
                explanation: "Los autores enfatizan que los resultados retroalimentan a los participantes en la arena de acción y pueden, con el tiempo, afectar también las variables exógenas, creando procesos dinámicos de transformación institucional."
            },
            {
                question: "¿Cómo definen Acuña y Chudnovsky la 'ideología' en su marco analítico?",
                options: [
                    "Como conocimiento sin fundamento o equivocado",
                    "Solo como formas de pensar el orden político o social",
                    "Como el mapa cognitivo, normativo e identitario que dice al sujeto cómo funcionan y deberían funcionar las relaciones sociales",
                    "Como una variable irrelevante para el análisis político"
                ],
                answer: 2,
                explanation: "Los autores definen ideología como el mapa cognitivo, normativo e identitario que incluye modelos causales, valores, identidades y normas internalizadas que orientan el comportamiento de los actores en cualquier ámbito de la vida social."
            },
            {
                question: "Según Anderies y Janssen, ¿qué sucede cuando las reglas no son claras o totalmente comprendidas?",
                options: [
                    "Los actores siempre interpretan correctamente las reglas",
                    "Se genera confusión sobre acciones permitidas, necesarias o prohibidas, y el monitoreo del cumplimiento se vuelve desafiante",
                    "Las reglas se vuelven automáticamente más efectivas",
                    "Los conflictos desaparecen naturalmente"
                ],
                answer: 1,
                explanation: "Los autores señalan que cuando las reglas no tienen significado compartido o son ambiguas, se genera confusión sobre comportamientos apropiados y el monitoreo del cumplimiento se vuelve muy desafiante."
            },
            {
                question: "En la propuesta de Acuña y Chudnovsky sobre capacidad institucional, ¿cuáles son los dos ejes principales de análisis?",
                options: [
                    "Eficiencia económica y legitimidad democrática",
                    "Dinámica institucional intrínseca y grado de cumplimiento efectivo de las reglas",
                    "Instituciones formales e informales",
                    "Actores estatales y no estatales"
                ],
                answer: 1,
                explanation: "Los autores proponen analizar la capacidad institucional considerando tanto las propiedades intrínsecas de la estructura institucional (consistencia, completitud, estabilidad, etc.) como el grado de cumplimiento efectivo y su impacto real."
            },
            {
                question: "¿Cómo explican Anderies y Janssen la analogía entre 'genes' y 'instituciones'?",
                options: [
                    "Las instituciones son exactamente como los genes biológicos",
                    "Buscan identificar bloques de construcción básicos que permitan estudiar la diversidad institucional, similar a cómo el ADN ayuda a entender la diversidad de especies",
                    "Las instituciones evolucionan solo por selección natural",
                    "No existe relación alguna entre ambos conceptos"
                ],
                answer: 1,
                explanation: "Los autores proponen desarrollar una 'genómica de las instituciones' para identificar componentes básicos que permitan decodificar y comparar instituciones, análogo a cómo el concepto de genes y ADN ayuda a estudiar la diversidad biológica."
            },
            {
                question: "Según Acuña y Chudnovsky, ¿cómo se relaciona la racionalidad de los actores con las normas sociales?",
                options: [
                    "Los actores son puramente racionales maximizadores",
                    "Los actores solo siguen normas sociales sin calcular",
                    "Los comportamientos resultan de la articulación entre maximización individualista y cumplimiento de normas, en una racionalidad 'históricamente situada'",
                    "Las normas sociales anulan completamente la racionalidad"
                ],
                answer: 2,
                explanation: "Los autores proponen que el comportamiento resulta de una tensión entre valores/normas y cálculo estratégico maximizador, en una racionalidad 'históricamente situada' donde los límites de lo imaginable son forjados por valores, normas e identidades colectivas."
            },
            {
                question: "En el análisis de Anderies y Janssen sobre diversidad institucional, ¿por qué el mismo comportamiento (como hacer cola) puede tener significados diferentes en distintos contextos?",
                options: [
                    "Porque las personas son inconsistentes",
                    "Porque las expectativas culturales y normas sociales varían entre contextos, afectando tanto el comportamiento apropiado como las consecuencias de no seguir las normas",
                    "Porque las leyes son diferentes en cada lugar",
                    "Porque no existe racionalidad en el comportamiento humano"
                ],
                answer: 1,
                explanation: "Los autores muestran cómo las normas culturales y expectativas sociales varían entre contextos, donde la misma acción puede ser apropiada en un lugar e inapropiada en otro, con diferentes consecuencias sociales."
            },
            {
                question: "¿Cómo conceptualizan Acuña y Chudnovsky la relación entre instituciones débiles y objetivos políticos?",
                options: [
                    "Las instituciones débiles son siempre problemáticas",
                    "Las instituciones débiles son irrelevantes",
                    "Las instituciones débiles pueden ser intencionalmente creadas o mantenidas como herramientas exitosas para alcanzar objetivos políticos específicos",
                    "Solo las instituciones fuertes tienen relevancia política"
                ],
                answer: 2,
                explanation: "Los autores argumentan que las instituciones débiles o no aplicadas, aparentemente 'fallidas', pueden ser exitosas como herramientas para alcanzar otros propósitos políticos, siendo resultado de estrategias deliberadas de ciertos actores."
            },
            {
                question: "Según Anderies y Janssen, ¿cuál es la función principal de las instituciones en relación con las interacciones humanas?",
                options: [
                    "Eliminar completamente los conflictos sociales",

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 60 * 60; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            // Generate quiz selection buttons
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            timeRemaining = 60 * 60; // Reiniciar temporizador
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Cambiar color cuando quedan menos de 5 minutos
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });

            // Update progress bar
            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval); // Detener temporizador
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes(); // Regenerar los exámenes para que sean diferentes cada vez
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
