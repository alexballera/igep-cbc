    <script>
        const allQuestions = [
            {
                question: "Analice la paradoja señalada por Acuña y Chudnovsky respecto al neoclasicismo económico y las instituciones. ¿Por qué consideran que esta perspectiva reproducía la lógica explicativa del marxismo?",
                options: ["Porque ambos privilegian el papel del Estado en la economía", "Porque ambos colocan a las instituciones como mera consecuencia de factores preexistentes que las causaban", "Porque ambos rechazan la relevancia de los actores individuales", "Porque ambos se enfocan exclusivamente en variables culturales"],
                answer: 1,
                explanation: "Según los autores, tanto el neoclasicismo como el marxismo terminan reduciendo las instituciones a efectos de fuerzas más profundas (mercados o fuerzas productivas), negándoles relevancia causal independiente."
            },
            {
                question: "En el contexto de la 'cárcel de vacas' descrita por Anderies y Janssen, ¿cuál es el principio institucional fundamental que se evidencia y por qué es relevante para la gestión de recursos comunes?",
                options: ["La privatización de bienes como solución a problemas de gestión", "El uso de la vergüenza social como mecanismo de sanción para asegurar contribuciones al bien común", "La intervención estatal directa en conflictos vecinales", "La eliminación de toda forma de propiedad individual en comunidades rurales"],
                answer: 1,
                explanation: "La 'cárcel de vacas' ilustra cómo las instituciones informales (vergüenza social) pueden ser efectivas para resolver problemas de acción colectiva, incentivando contribuciones al mantenimiento de infraestructura compartida."
            },
            {
                question: "Según la propuesta teórica de Acuña y Chudnovsky, ¿qué implicancias tiene afirmar que las instituciones pueden ser tanto variable independiente como dependiente en el análisis político?",
                options: ["Que las instituciones siempre determinan los comportamientos de los actores", "Que los actores no tienen relevancia en el proceso político", "Que la direccionalidad causal puede variar según el contexto histórico y la matriz política específica", "Que las instituciones son irrelevantes para explicar procesos políticos"],
                answer: 2,
                explanation: "Los autores argumentan que las instituciones pueden explicar comportamientos (variable independiente) o ser resultado del accionar de actores (variable dependiente), dependiendo del proceso histórico y la correlación de fuerzas."
            },
            {
                question: "¿Cuál es la crítica fundamental que realizan Acuña y Chudnovsky a la noción de 'calidad institucional' predominante en la literatura neoinstitucionalista?",
                options: ["Que ignora completamente el papel de las variables económicas", "Que presupone que menor conflicto indica mejor institucionalidad, ocultando que el conflicto puede ser necesario para procesos inclusivos", "Que se enfoca demasiado en las instituciones formales", "Que no considera el papel de la cultura en los procesos políticos"],
                answer: 1,
                explanation: "Los autores critican la tendencia a leer el conflicto como anomalía, cuando los procesos de mejoramiento institucional inclusivo inevitablemente generan conflicto al redistribuir poder y recursos."
            },
            {
                question: "En el marco ADI de Anderies y Janssen, ¿cómo se relacionan las 'situaciones de acción' con las 'arenas de acción' y por qué esta distinción es analíticamente relevante?",
                options: ["Son términos sinónimos que se usan indistintamente", "La situación de acción provee el contexto institucional donde los participantes interactúan en la arena de acción", "La arena de acción es siempre más amplia que la situación de acción", "No existe relación conceptual entre ambos términos"],
                answer: 1,
                explanation: "La situación de acción define las reglas, posiciones y estructura, mientras que la arena de acción es donde los participantes específicos interactúan dentro de esa estructura institucional."
            },
            {
                question: "Analice la tensión conceptual que plantean Acuña y Chudnovsky entre 'individuos sin historia' (IER) e 'instituciones sin actores' (IH). ¿Qué propuesta metodológica sugieren para superarla?",
                options: ["Adoptar exclusivamente el institucionalismo histórico", "Rechazar todo tipo de análisis institucional", "Desarrollar un marco matricial que reconozca la endogeneidad entre instituciones, actores y otras variables sociales", "Concentrarse únicamente en variables culturales"],
                answer: 2,
                explanation: "Los autores proponen superar la falsa dicotomía mediante un análisis matricial que reconozca las influencias recíprocas entre instituciones, actores y variables socioestructurales e ideológico-culturales."
            },
            {
                question: "¿Qué significado tiene la afirmación de Acuña y Chudnovsky de que 'las instituciones son reglas que apuntan a resolver tanto problemas de coordinación como conflictos distributivos'?",
                options: ["Que las instituciones solo resuelven problemas técnicos de coordinación", "Que las instituciones únicamente administran conflictos sin resolverlos", "Que las instituciones tienen una función dual: facilitar coordinación y administrar disputas sobre distribución de poder y recursos", "Que las instituciones son neutrales respecto a la distribución de poder"],
                answer: 2,
                explanation: "Esta definición reconoce que las instituciones no son neutrales: además de coordinar, distribuyen probabilidades diferenciales para que distintos actores realicen sus intereses, constituyendo la organización social del poder político."
            },
            {
                question: "En la perspectiva de Acuña y Chudnovsky, ¿por qué la 'debilidad institucional' no necesariamente constituye un problema y cuándo podría ser una solución estratégica?",
                options: ["Porque las instituciones débiles son siempre más eficientes", "Porque algunos actores pueden crear intencionalmente instituciones débiles para alcanzar objetivos políticos específicos", "Porque la debilidad institucional reduce los costos administrativos", "Porque las instituciones débiles permiten mayor participación ciudadana"],
                answer: 1,
                explanation: "Los autores señalan que instituciones aparentemente 'fallidas' pueden ser exitosas como herramientas para actores que buscan mantener flexibilidad o evitar restricciones, siendo la debilidad una característica funcional a sus estrategias."
            },
            {
                question: "¿Cuál es la implicancia de la diferenciación que establecen Acuña y Chudnovsky entre los niveles de agregación institucional (R1, R2, R3) para el comportamiento estratégico de los actores?",
                options: ["Los actores solo pueden operar en un nivel institucional a la vez", "Los actores pueden 'moverse' entre niveles institucionales cuando las reglas de un nivel no les permiten alcanzar sus objetivos", "Los niveles institucionales operan de manera completamente independiente", "Solo los actores estatales pueden acceder a niveles superiores de agregación"],
                answer: 1,
                explanation: "Los actores pueden escalar sus estrategias desde reglas específicas (R1) hacia reglas sobre la toma de decisiones (R2) o sobre la distribución del poder (R3) cuando enfrentan restricciones en niveles inferiores."
            },
            {
                question: "Según Anderies y Janssen, ¿por qué es fundamental la distinción entre 'reglas en el papel' (de jure) y 'reglas en uso' (de facto) para el análisis institucional?",
                options: ["Porque solo las reglas escritas tienen validez legal", "Porque las reglas informales son siempre más importantes que las formales", "Porque la efectividad institucional depende de las reglas que efectivamente estructuran el comportamiento, no solo de las escritas", "Porque las reglas formales e informales nunca pueden coexistir"],
                answer: 2,
                explanation: "Los autores enfatizan que el comportamiento humano se guía por las reglas que realmente operan en la práctica, que pueden diferir significativamente de las reglas oficialmente establecidas."
            },
            {
                question: "En el marco conceptual de Acuña y Chudnovsky, ¿cómo se articula el concepto de 'racionalidad históricamente situada' con la crítica al individualismo metodológico?",
                options: ["Rechaza completamente la posibilidad de comportamiento racional", "Propone que la racionalidad opera 'dentro de la historia', limitada y moldeada por valores, normas e identidades colectivas", "Establece que solo los macroprocesos explican el comportamiento", "Considera que la racionalidad es independiente del contexto social"],
                answer: 1,
                explanation: "Los autores argumentan que los actores realizan cálculos estratégicos, pero dentro de marcos valorativos e identitarios históricamente construidos que definen tanto los límites de lo imaginable como las prioridades y lo deseable."
            },
            {
                question: "¿Qué implicancias tiene para el diseño de políticas públicas la propuesta de Acuña y Chudnovsky sobre la heterogeneidad institucional y la necesidad de análisis desagregado?",
                options: ["Que todas las arenas de política pública funcionan con la misma lógica institucional", "Que es necesario analizar la especificidad de cada arena política reconociendo distintas lógicas de interacción entre instituciones y actores", "Que solo importan las instituciones formales para el diseño de políticas", "Que los actores son irrelevantes para el análisis de políticas públicas"],
                answer: 1,
                explanation: "Los autores enfatizan que la institucionalidad no es homogénea, requiriendo análisis específicos de cada arena (laboral, educativa, etc.) para entender las particulares lógicas de interacción entre instituciones y actores."
            },
            {
                question: "Analice la crítica de Acuña y Chudnovsky al supuesto neoinstitucionalista de que las instituciones 'buenas' necesariamente producen resultados Pareto-superiores. ¿Qué alternativa proponen?",
                options: ["Que las instituciones siempre benefician a todos por igual", "Que el mejoramiento institucional democrático inevitablemente implica conflicto porque siempre alguien pierde posiciones de poder", "Que las instituciones son irrelevantes para los resultados sociales", "Que solo las instituciones informales importan para explicar resultados"],
                answer: 1,
                explanation: "Los autores argumentan que la construcción de mejor institucionalidad democrática no avanza hacia equilibrios donde todos ganan, sino que genera resistencias de quienes ven afectados sus intereses por la redistribución de poder."
            },
            {
                question: "En el contexto del análisis de Anderies y Janssen sobre diversidad institucional, ¿qué significa que 'los mismos principios' subyacen a mecanismos institucionales aparentemente muy diferentes?",
                options: ["Que todas las instituciones son idénticas en su funcionamiento", "Que diferentes culturas utilizan mecanismos diversos pero basados en principios comunes de incentivos, sanciones y coordinación", "Que solo existen instituciones formales universales", "Que las diferencias culturales son irrelevantes para el diseño institucional"],
                answer: 1,
                explanation: "Los autores sugieren que aunque los mecanismos específicos varían culturalmente (como la 'cárcel de vacas'), los principios fundamentales de incentivos, sanciones y resolución de problemas de acción colectiva son compartidos."
            },
            {
                question: "¿Cuál es la relevancia analítica de la distinción que establece Acuña y Chudnovsky entre 'intereses subjetivos' e 'intereses objetivos' para el estudio de los actores políticos?",
                options: ["Solo los intereses subjetivos son relevantes para explicar comportamientos", "Solo los intereses objetivos determinan los resultados políticos", "Ambos tipos de intereses son necesarios: los subjetivos para explicar comportamientos y los objetivos para entender efectos reales", "Los intereses son completamente irrelevantes para el análisis político"],
                answer: 2,
                explanation: "Los autores argumentan que los intereses subjetivos explican por qué los actores hacen lo que hacen, mientras que los objetivos explican por qué les pasa lo que les pasa, siendo ambas dimensiones necesarias para un análisis completo."
            },
            {
                question: "Según la propuesta teórica de Acuña y Chudnovsky, ¿qué rol cumple el Estado en la articulación de la matriz política y por qué no puede considerarse meramente como un actor más?",
                options: ["El Estado es irrelevante para la organización social", "El Estado es solo un conjunto de organizaciones administrativas", "El Estado cumple un doble papel: como estructura que organiza la articulación social y como conjunto de instituciones potencialmente autónomas", "El Estado solo actúa cuando hay crisis políticas"],
                answer: 2,
                explanation: "Los autores conceptualizan al Estado tanto como relación social que establece un orden en el territorio, como aparato institucional potencialmente autónomo que puede ejercer poder sobre la sociedad, mercado y otros actores."
            },
            {
                question: "En el marco ADI de Anderies y Janssen, ¿cómo influyen las 'condiciones biofísicas' en las arenas de acción y por qué es crucial considerarlas en el análisis institucional?",
                options: ["Las condiciones biofísicas son irrelevantes para las instituciones sociales", "Las condiciones físicas determinan completamente las instituciones sociales", "Las condiciones biofísicas establecen límites y posibilidades para la acción, afectando la efectividad de las reglas según el contexto", "Solo las condiciones culturales importan para el análisis institucional"],
                answer: 2,
                explanation: "Los autores enfatizan que el mundo físico impone restricciones y oportunidades que afectan qué acciones son posibles, qué resultados se pueden alcanzar y cómo las mismas reglas pueden tener efectos diferentes según el contexto biofísico."
            },
            {
                question: "¿Qué significa la afirmación de Acuña y Chudnovsky de que 'las instituciones regulan el accionar de los sujetos y a la vez son su resultado'?",
                options: ["Que las instituciones son independientes de los actores sociales", "Que existe una relación de determinación recíproca entre instituciones y comportamiento de actores", "Que solo los actores determinan las instituciones", "Que las instituciones nunca cambian una vez establecidas"],
                answer: 1,
                explanation: "Esta formulación captura la complejidad de la relación institución-actor: las instituciones estructuran comportamientos, pero los actores también pueden modificar, crear o transformar instituciones a través de su accionar estratégico."
            },
            {
                question: "Analice la propuesta de Acuña y Chudnovsky sobre 'capacidad institucional'. ¿Por qué distinguen entre 'propiedades intrínsecas' y 'grado de cumplimiento' de las reglas?",
                options: ["Porque solo las propiedades intrínsecas determinan la efectividad institucional", "Porque el cumplimiento es irrelevante para la capacidad institucional", "Porque la capacidad institucional resulta de la articulación entre la calidad técnica de las reglas y su efectiva implementación en contextos específicos", "Porque ambas dimensiones son siempre independientes entre sí"],
                answer: 2,
                explanation: "Los autores argumentan que la efectividad institucional no depende solo del diseño técnico de las reglas (consistencia, completitud, estabilidad), sino también de si son factibles, creíbles y sostenidas por coaliciones de actores en contextos específicos."
            },
            {
                question: "En la perspectiva de Anderies y Janssen, ¿qué implicancias tiene reconocer que 'las instituciones son constructos humanos susceptibles de ser transformados'?",
                options: ["Que las instituciones son completamente arbitrarias y carecen de efectos reales", "Que los individuos pueden escoger seguir o no las reglas, pero enfrentan consecuencias por sus decisiones", "Que las instituciones no tienen relevancia para el comportamiento social", "Que solo las instituciones naturales son efectivas"],
                answer: 1,
                explanation: "Esta conceptualización enfatiza que las instituciones, siendo creaciones humanas, son modificables pero no por ello inefectivas: crean incentivos y estructuras de costos/beneficios que influyen en las decisiones individuales."
            },
            {
                question: "¿Cuál es la relevancia de la crítica que realizan Acuña y Chudnovsky al concepto de 'exportación' de marcos institucionales desde sociedades anglosajonas a América Latina?",
                options: ["Que las instituciones formales son siempre universalmente efectivas", "Que las reglas informales son irrelevantes en contextos no anglosajones", "Que los marcos teóricos desarrollados en un contexto pueden no 'viajar bien' a regiones con diferentes lógicas de cumplimiento e institucionalidad informal", "Que América Latina no puede desarrollar instituciones efectivas"],
                answer: 2,
                explanation: "Los autores señalan que los nuevos institucionalismos, basados en la experiencia anglosajona donde las reglas formales tienden a cumplirse, pueden ser inadecuados para contextos donde prevalecen reglas informales o existe cumplimiento irregular."
            },
            {
                question: "Según la propuesta de Acuña y Chudnovsky sobre el análisis de actores, ¿por qué es fundamental distinguir entre 'actores' y 'no actores' en el proceso político?",
                options: ["Porque solo los actores estatales son relevantes para la política", "Porque los no actores no tienen intereses definidos", "Porque el análisis exclusivo de actores organizados puede invisibilizar grupos sociales débiles, lo que resulta analíticamente falaz y normativamente conservador", "Porque los no actores siempre se oponen a los cambios institucionales"],
                answer: 2,
                explanation: "Los autores enfatizan que centrarse solo en grupos que han resuelto problemas de acción colectiva deja fuera a sectores más débiles, lo que no solo es analíticamente incompleto sino que reproduce sesgos hacia los ya poderosos."
            },
            {
                question: "En el marco conceptual de Anderies y Janssen, ¿cómo se relaciona el concepto de 'feedback' entre resultados y arena de acción con la estabilidad o cambio institucional?",
                options: ["Los resultados nunca afectan las futuras interacciones", "Los resultados productivos tienden a reforzar las estructuras institucionales existentes, mientras que resultados negativos pueden impulsar cambios", "Solo los actores externos pueden modificar las instituciones", "Las instituciones nunca cambian una vez establecidas"],
                answer: 1,
                explanation: "Los autores explican que cuando las interacciones producen resultados considerados positivos, los participantes tienden a mantener la estructura institucional, pero resultados percibidos como negativos pueden motivar intentos de cambio institucional."
            },
            {
                question: "Analice la tensión que plantean Acuña y Chudnovsky entre la necesidad de 'parsimonia' teórica y el riesgo de 'reduccionismo' en el análisis institucional.",
                options: ["Que toda teoría debe incluir todas las variables posibles para ser válida", "Que el análisis institucional debe enfocarse exclusivamente en una variable explicativa", "Que el desafío consiste en lograr suficiencia explicativa sin caer en reduccionismos que omitan variables necesarias para explicar el objeto de estudio", "Que el reduccionismo es siempre preferible a la complejidad analítica"],
                answer: 2,
                explanation: "Los autores reconocen que toda explicación requiere selección de variables, pero critican a los institucionalismos por omitir variables necesarias para una comprensión adecuada de los procesos políticos e institucionales."
            },
            {
                question: "¿Qué implicancias tiene para el estudio de las instituciones la distinción que establecen Acuña y Chudnovsky entre 'explicar comportamientos' y 'explicar lo que les pasa a los actores'?",
                options: ["Que ambos objetivos explicativos requieren exactamente las mismas variables", "Que solo los comportamientos son relevantes para el análisis político", "Que explicar comportamientos requiere comprender la subjetividad de los actores, mientras que explicar resultados demanda atender a condiciones objetivas", "Que los resultados son completamente independientes de los comportamientos"],
                answer: 2,
                explanation: "Los autores distinguen entre la explicación de por qué los actores actúan como actúan (que requiere entender su ideología e intereses subjetivos) y por qué obtienen ciertos resultados (que puede requerir variables que los actores no perciben o controlan)."
            },
            {
                question: "En la perspectiva de Anderies y Janssen sobre la diversidad institucional, ¿cuál es la importancia de desarrollar un 'lenguaje común' para estudiar diferentes situaciones sociales?",
                options: ["Para imponer un modelo institucional único a todas las sociedades", "Para desarrollar herramientas analíticas que permitan comparar y aprender de diferentes arreglos institucionales manteniendo sensibilidad al contexto", "Para eliminar las diferencias culturales en el diseño institucional", "Para demostrar la superioridad de ciertos modelos institucionales"],
                answer: 1,
                explanation: "Los autores buscan desarrollar un marco analítico que permita identificar principios comunes y patrones en la diversidad institucional, facilitando el aprendizaje comparativo sin imposición de modelos únicos."
            },

            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes(); // Regenerar los exámenes para que sean diferentes cada vez
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
