    <script>
        const allQuestions = [
            {
                question: "¿Cuál es la tensión fundamental que identifican Acuña y Chudnovsky entre los enfoques neoinstitucionalistas de elección racional y el institucionalismo histórico?",
                options: [
                    "El grado de formalización matemática que cada enfoque utiliza para modelar comportamientos",
                    "La primacía causal atribuida a instituciones versus la capacidad transformadora de actores estratégicos",
                    "La relevancia asignada a variables culturales frente a determinantes económicos estructurales",
                    "El énfasis en instituciones supranacionales versus instituciones de nivel nacional y subnacional"
                ],
                answer: 1,
                explanation: "Los autores señalan la tensión entre enfoques que privilegian la determinación institucional del comportamiento versus aquellos que enfatizan cómo actores estratégicos pueden transformar las propias instituciones, evidenciando el dilema entre 'instituciones sin actores' versus 'individuos sin historia'."
            },
            {
                question: "En el marco ADI de Anderies y Janssen, ¿cómo se articula la relación entre 'atributos de la comunidad' y 'modelos mentales' de los participantes?",
                options: [
                    "Los atributos comunitarios determinan linealmente los modelos mentales individuales",
                    "Los modelos mentales constituyen filtros interpretativos moldeados por atributos comunitarios compartidos",
                    "Ambos operan de manera independiente sin influencias recíprocas significativas",
                    "Los modelos mentales transforman automáticamente los atributos estructurales de la comunidad"
                ],
                answer: 1,
                explanation: "Anderies y Janssen conceptualizan los modelos mentales como marcos interpretativos que filtran información y guían decisiones, siendo moldeados por atributos comunitarios como cultura, normas y experiencias históricas compartidas, sin constituir una relación de determinación unidireccional."
            },
            {
                question: "¿Por qué Acuña y Chudnovsky critican el supuesto neoinstitucionalista de que las instituciones 'eficientes' tienden a persistir mientras las 'ineficientes' son eliminadas?",
                options: [
                    "Porque no considera que diferentes actores pueden tener criterios contradictorios sobre eficiencia institucional",
                    "Porque ignora la superioridad analítica de los enfoques culturalistas sobre los económicos",
                    "Porque subestima la importancia de variables internacionales en procesos de cambio institucional",
                    "Porque no reconoce la primacía de factores tecnológicos en la evolución institucional"
                ],
                answer: 0,
                explanation: "Los autores argumentan que la 'eficiencia' institucional no es un criterio objetivo universal, sino que depende de desde qué posición social y con qué intereses se evalúe. Una institución puede ser eficiente para algunos actores (beneficiarios) e ineficiente para otros (perjudicados), cuestionando narrativas evolutivas simplistas."
            },
            {
                question: "En la conceptualización de Anderies y Janssen sobre diversidad institucional, ¿qué implica afirmar que mecanismos culturalmente específicos pueden basarse en principios universales?",
                options: [
                    "Que todas las culturas desarrollan instituciones idénticas para resolver problemas similares",
                    "Que principios de incentivos y coordinación trascienden manifestaciones culturales particulares",
                    "Que las diferencias culturales son irrelevantes para el diseño institucional efectivo",
                    "Que solo las instituciones occidentales contienen principios aplicables universalmente"
                ],
                answer: 1,
                explanation: "Los autores sugieren que aunque las manifestaciones específicas varían culturalmente (como la 'cárcel de vacas'), los principios subyacentes de manejo de incentivos, resolución de problemas de acción colectiva y mecanismos de sanción social pueden identificarse transculturalmente, sin implicar uniformidad en sus expresiones concretas."
            },
            {
                question: "¿Cuál es la implicancia metodológica de la propuesta de Acuña y Chudnovsky sobre 'endogeneidad' en el análisis institucional?",
                options: [
                    "Que las instituciones siempre son variables independientes en modelos causales",
                    "Que deben estudiarse exclusivamente procesos de muy larga duración histórica",
                    "Que la direccionalidad causal entre instituciones y comportamientos varía según el contexto analítico",
                    "Que solo las variables económicas estructurales tienen poder explicativo real"
                ],
                answer: 2,
                explanation: "La endogeneidad implica reconocer que instituciones y actores se constituyen mutuamente: las instituciones moldean comportamientos, pero los actores también pueden transformar instituciones. Esto requiere especificar analíticamente en qué momento las instituciones operan como variable dependiente o independiente según el proceso estudiado."
            },
            {
                question: "En el análisis de Anderies y Janssen sobre 'feedback' entre resultados y arena de acción, ¿qué diferencia existe entre feedback 'directo' e 'indirecto'?",
                options: [
                    "El directo afecta inmediatamente las reglas formales, el indirecto modifica gradualmente las normas informales",
                    "El directo involucra solo a participantes originales, el indirecto incluye nuevos actores externos",
                    "El directo impacta la situación de acción, el indirecto transforma condiciones biofísicas o atributos comunitarios",
                    "El directo es siempre positivo para la estabilidad, el indirecto genera inevitablemente conflictos"
                ],
                answer: 2,
                explanation: "Los autores distinguen entre feedback que afecta directamente elementos de la situación de acción (reglas, posiciones, información) versus feedback que modifica variables exógenas como condiciones biofísicas o atributos de la comunidad, influyendo indirectamente en futuras interacciones a través de estos cambios contextuales."
            },
            {
                question: "¿Cómo articulan Acuña y Chudnovsky la crítica al 'determinismo institucional' con su propuesta de análisis matricial?",
                options: [
                    "Proponiendo que solo las variables ideológico-culturales explican procesos políticos relevantes",
                    "Estableciendo que las instituciones operan en interacción con variables socioestructurales e ideológico-culturales",
                    "Argumentando que los actores individuales son completamente autónomos respecto a restricciones institucionales",
                    "Defendiendo que las instituciones siempre se adaptan automáticamente a cambios socioeconómicos"
                ],
                answer: 1,
                explanation: "El análisis matricial busca superar tanto el determinismo institucional como el voluntarismo individual, proponiendo examinar cómo las instituciones interactúan con variables socioestructurales (distribución de recursos, relaciones de poder) e ideológico-culturales (marcos de sentido, identidades) en configuraciones históricamente específicas."
            },
            {
                question: "En la caracterización de Anderies y Janssen sobre 'arenas de acción', ¿qué distingue una 'arena operacional' de una 'arena constitucional'?",
                options: [
                    "La arena operacional se enfoca en implementación, la constitucional en diseño de reglas que estructuran decisiones",
                    "La arena operacional incluye todos los actores, la constitucional solo a autoridades formalmente reconocidas",
                    "La arena operacional opera a nivel local, la constitucional exclusivamente a nivel nacional",
                    "La arena operacional procesa conflictos, la constitucional solo genera consensos institucionales"
                ],
                answer: 0,
                explanation: "Los autores conceptualizan las arenas constitucionales como espacios donde se definen reglas que estructuran decisiones (reglas sobre reglas), mientras las arenas operacionales son donde se implementan esas reglas para tomar decisiones específicas sobre uso y manejo de recursos."
            },
            {
                question: "¿Cuál es la crítica fundamental de Acuña y Chudnovsky al 'funcionalismo' en el análisis neoinstitucionalista?",
                options: [
                    "Que no utiliza herramientas metodológicas suficientemente sofisticadas para el análisis causal",
                    "Que explica la existencia de instituciones por las funciones que cumplen, invirtiendo la causalidad",
                    "Que privilegia excesivamente variables económicas sobre factores políticos y culturales específicos",
                    "Que no considera la importancia de instituciones informales en procesos políticos relevantes"
                ],
                answer: 1,
                explanation: "Los autores critican la tendencia a explicar por qué existe una institución por las funciones que cumple, lo que implica asumir que las instituciones surgen porque 'se necesitan' para cumplir determinadas funciones, cuando en realidad la causalidad puede ser más compleja y contingente."
            },
            {
                question: "En el marco ADI, ¿cómo conceptualizan Anderies y Janssen la relación entre 'monitoreo' y 'sanciones graduales'?",
                options: [
                    "El monitoreo siempre precede temporalmente a la aplicación de sanciones institucionales",
                    "Constituyen mecanismos complementarios que refuerzan la observancia de reglas institucionales",
                    "El monitoreo opera formalmente, las sanciones graduales exclusivamente de manera informal",
                    "Son mecanismos alternativos que no pueden coexistir en un mismo sistema institucional"
                ],
                answer: 1,
                explanation: "Los autores los conceptualizan como principios de diseño complementarios: el monitoreo permite detectar incumplimiento de reglas, mientras las sanciones graduales proporcionan incentivos apropiados para el cumplimiento, evitando tanto la impunidad como castigos desproporcionados que generen resistencia."
            },
            {
                question: "¿Por qué Acuña y Chudnovsky consideran problemática la distinción tajante entre instituciones 'formales' e 'informales'?",
                options: [
                    "Porque las instituciones informales carecen completamente de relevancia en contextos democráticos",
                    "Porque la formalización e informalidad operan frecuentemente de manera entrelazada y complementaria",
                    "Porque solo las instituciones formales pueden ser estudiadas mediante métodos científicos rigurosos",
                    "Porque las instituciones informales son universalmente más importantes que las formales"
                ],
                answer: 1,
                explanation: "Los autores argumentan que en la práctica política las instituciones formales e informales se entrelazan: las reglas informales pueden complementar, contradecir o reinterpretar reglas formales, y viceversa. Esta interpenetración hace que la distinción categórica sea analíticamente limitante."
            },
            {
                question: "En la conceptualización de Anderies y Janssen sobre 'recursos compartidos', ¿qué característica distingue un 'sistema recurso' de las 'unidades recurso'?",
                options: [
                    "El sistema recurso opera a nivel nacional, las unidades recurso a nivel local",
                    "El sistema recurso es la infraestructura que genera unidades recurso específicas extraíbles",
                    "El sistema recurso incluye solo recursos naturales, las unidades recurso incluyen recursos artificiales",
                    "El sistema recurso es público, las unidades recurso son siempre de propiedad privada"
                ],
                answer: 1,
                explanation: "Los autores distinguen entre el sistema recurso (como un bosque, pesquería o sistema de irrigación) que funciona como infraestructura generadora, y las unidades recurso (como árboles, peces o agua) que son las cantidades específicas que pueden ser extraídas o utilizadas del sistema."
            },
            {
                question: "¿Cuál es la principal implicancia de la propuesta de Acuña y Chudnovsky sobre 'equilibrios múltiples' en el análisis institucional?",
                options: [
                    "Que siempre existen soluciones únicas y óptimas para problemas institucionales específicos",
                    "Que diferentes configuraciones institucionales pueden ser estables bajo condiciones similares",
                    "Que las instituciones tienden inevitablemente hacia estados de equilibrio permanente",
                    "Que el cambio institucional sigue siempre patrones lineales y predecibles"
                ],
                answer: 1,
                explanation: "La existencia de equilibrios múltiples implica que bajo condiciones similares pueden coexistir diferentes arreglos institucionales estables, lo que introduce contingencia histórica y dependencia del sendero en el análisis, cuestionando determinismo y unicidad de soluciones institucionales."
            },
            {
                question: "En el análisis de Anderies y Janssen sobre 'resolución de conflictos', ¿por qué enfatizan la importancia de mecanismos de 'bajo costo' y 'acceso rápido'?",
                options: [
                    "Para maximizar la eficiencia económica general del sistema institucional",
                    "Para prevenir que disputas menores escalen hacia conflictos que amenacen la estabilidad institucional",
                    "Para reducir la carga administrativa de autoridades centrales de gobierno",
                    "Para eliminar completamente la posibilidad de conflictos en comunidades organizadas"
                ],
                answer: 1,
                explanation: "Los autores argumentan que mecanismos accesibles y expeditos para resolver disputas impiden que conflictos menores se acumulen o escalquen hasta amenazar la legitimidad y estabilidad del conjunto del sistema institucional, funcionando como válvulas de escape para tensiones."
            },
            {
                question: "¿Cómo caracterizan Acuña y Chudnovsky la relación entre 'cambio institucional gradual' y 'momentos críticos'?",
                options: [
                    "El cambio gradual opera exclusivamente en períodos de estabilidad política",
                    "Los momentos críticos anulan completamente los efectos del cambio gradual previo",
                    "Ambos tipos de cambio pueden coexistir y reforzarse mutuamente en procesos complejos",
                    "Los momentos críticos son siempre más determinantes que procesos graduales"
                ],
                answer: 2,
                explanation: "Los autores sugieren que el cambio institucional puede combinar transformaciones graduales (erosión, sedimentación) con rupturas en momentos críticos, donde estos diferentes tipos de cambio pueden potenciarse mutuamente: los cambios graduales pueden crear condiciones para momentos críticos, y estos pueden acelerar tendencias graduales."
            },
            {
                question: "En el marco ADI, ¿qué implica el principio de 'congruencia' entre reglas de apropiación y provisión?",
                options: [
                    "Que ambos tipos de reglas deben ser idénticas en contenido y forma",
                    "Que quienes más se benefician del recurso deben contribuir proporcionalmente a su mantenimiento",
                    "Que las reglas deben aplicarse uniformemente sin consideración de diferencias individuales",
                    "Que la apropiación debe siempre maximizarse independientemente de costos de provisión"
                ],
                answer: 1,
                explanation: "Anderies y Janssen argumentan que debe existir proporcionalidad entre beneficios obtenidos y contribuciones realizadas: quienes más se benefician del acceso al recurso deben asumir mayores responsabilidades en su provisión y mantenimiento, generando incentivos apropiados para la sostenibilidad."
            },
            {
                question: "¿Por qué Acuña y Chudnovsky critican el 'individualismo metodológico' predominante en enfoques neoinstitucionalistas?",
                options: [
                    "Porque no reconoce que preferencias individuales están socialmente construidas e institucional condicionadas",
                    "Porque privilegia explicaciones irracionales sobre comportamientos económicamente optimizadores",
                    "Porque ignora completamente la importancia de decisiones individuales en procesos políticos",
                    "Porque solo utiliza metodologías cualitativas sin rigor científico suficiente"
                ],
                answer: 0,
                explanation: "Los autores argumentan que el individualismo metodológico asume preferencias exógenas y estables, cuando en realidad las preferencias se forman socialmente y son moldeadas por marcos institucionales, culturales e históricos específicos, requiriendo enfoques más comprensivos sobre la constitución social de actores."
            },
            {
                question: "En la conceptualización de Anderies y Janssen sobre 'dependencia del sendero', ¿qué rol juegan las 'pequeñas contingencias históricas'?",
                options: [
                    "Son irrelevantes porque los resultados institucionales están predeterminados estructuralmente",
                    "Pueden tener efectos amplificados que determinan trayectorias institucionales de largo plazo",
                    "Solo afectan aspectos superficiales sin influir en características estructurales fundamentales",
                    "Operan exclusivamente en sociedades con instituciones débiles o inexistentes"
                ],
                answer: 1,
                explanation: "Los autores enfatizan que pequeños eventos contingentes pueden, a través de mecanismos de retroalimentación positiva y dependencia del sendero, generar efectos amplificados que determinan trayectorias institucionales diferentes, cuestionando narrativas deterministas y destacando la importancia de la contingencia histórica."
            },
            {
                question: "¿Cuál es la implicancia de la crítica de Acuña y Chudnovsky al 'universalismo' en el diseño institucional?",
                options: [
                    "Que no existen principios generales aplicables transversalmente a diferentes contextos",
                    "Que el diseño institucional efectivo requiere adaptación a contextos sociopolíticos específicos",
                    "Que solo las instituciones desarrolladas en Occidente pueden funcionar universalmente",
                    "Que cada sociedad debe desarrollar instituciones completamente únicas y originales"
                ],
                answer: 1,
                explanation: "Los autores no rechazan la posibilidad de principios generales, sino que critican la aplicación mecánica de diseños institucionales sin considerar especificidades contextuales. Proponen adaptar principios generales a condiciones sociopolíticas, culturales e históricas particulares para aumentar efectividad institucional."
            },
            {
                question: "En el análisis de Anderies y Janssen sobre 'usuarios del recurso', ¿por qué distinguen entre 'participantes' y 'beneficiarios'?",
                options: [
                    "Los participantes son locales, los beneficiarios son siempre actores externos",
                    "Los participantes toman decisiones activas, los beneficiarios solo reciben resultados pasivamente",
                    "Los participantes tienen derechos formales, los beneficiarios solo expectativas informales",
                    "Los participantes contribuyen económicamente, los beneficiarios solo utilizan recursos"
                ],
                answer: 1,
                explanation: "Los autores distinguen entre participantes que toman decisiones activas en la arena de acción (con capacidad de influir en resultados) y beneficiarios que reciben efectos de esas decisiones sin participar directamente en su formulación, reconociendo diferentes niveles de agencia en procesos institucionales."

                    "Solo las instituciones científicas pueden realizar experimentación institucional legítima",
                    "La experimentación es irrelevante porque las mejores instituciones ya están perfectamente diseñadas"
                ],
                answer: 1,
                explanation: "Los autores proponen que la experimentación institucional controlada permite a comunidades probar innovaciones, aprender de resultados y adaptar progresivamente sus arreglos sin comprometer completamente la estabilidad del sistema."
            },
            {
                question: "En el análisis de Acuña y Chudnovsky sobre 'instituciones de segundo orden', ¿qué función específica cumplen?",
                options: [
                    "Regulan el funcionamiento de instituciones de primer orden y facilitan coordinación entre ellas",
                    "Son siempre menos importantes que las instituciones de primer orden en cualquier sistema",
                    "Solo existen en sistemas federales con múltiples niveles de gobierno",
                    "Se ocupan exclusivamente de cuestiones simbólicas sin efectos prácticos reales"
                ],
                answer: 0,
                explanation: "Las instituciones de segundo orden son meta-instituciones que regulan, coordinan y facilitan el funcionamiento de instituciones de primer orden, estableciendo reglas sobre reglas y mecanismos de articulación sistémica."
            },
            {
                question: "¿Cómo conceptualizan Anderies y Janssen la relación entre 'memoria institucional' y capacidad adaptativa?",
                options: [
                    "La memoria institucional siempre obstaculiza la capacidad adaptativa bloqueando innovaciones",
                    "La memoria institucional preserva aprendizajes previos que informan pero no determinan adaptaciones futuras",
                    "Solo las instituciones con memoria institucional muy limitada pueden ser verdaderamente adaptativas",
                    "La memoria y la adaptación son procesos completamente independientes en sistemas institucionales"
                ],
                answer: 1,
                explanation: "Los autores argumentan que la memoria institucional preserva conocimiento acumulado sobre qué funcionó en situaciones pasadas, proporcionando un repertorio de experiencias que informa (sin determinar) decisiones adaptativas futuras."
            },
            {
                question: "En la crítica de Acuña y Chudnovsky al 'voluntarismo institucional', ¿qué limitación identifican?",
                options: [
                    "Subestima restricciones estructurales y legados históricos que condicionan las posibilidades de cambio",
                    "Otorga demasiada importancia a factores estructurales ignorando la capacidad de acción humana",
                    "Solo considera variables económicas sin atender factores políticos y culturales relevantes",
                    "Se enfoca exclusivamente en instituciones formales descuidando arreglos informales"
                ],
                answer: 0,
                explanation: "Los autores critican la tendencia a asumir que las instituciones pueden ser diseñadas y cambiadas libremente según la voluntad de reformadores, ignorando cómo estructuras de poder, legados históricos y dependencias del sendero limitan opciones de cambio."
            },
            {
                question: "¿Qué implica el concepto de 'gobernanza adaptativa' en el marco de Anderies y Janssen?",
                options: [
                    "Sistemas de gobernanza que combinan planificación con capacidad de ajuste ante nueva información",
                    "Gobernanza que se adapta automáticamente sin necesidad de intervención humana consciente",
                    "Solo gobiernos nacionales pueden implementar verdadera gobernanza adaptativa",
                    "Gobernanza que prioriza exclusivamente eficiencia sobre cualquier otra consideración"
                ],
                answer: 0,
                explanation: "La gobernanza adaptativa combina planificación estratégica con flexibilidad para ajustar políticas y reglas basándose en monitoreo continuo, aprendizaje de experiencias y nueva información sobre resultados y condiciones cambiantes."
            },
            {
                question: "En el análisis de Acuña y Chudnovsky sobre 'isomorfismo institucional', ¿qué factores lo impulsan?",
                options: [
                    "Solo presiones competitivas económicas generan convergencia hacia formas institucionales similares",
                    "Presiones normativas, miméticas y coercitivas impulsan similitud institucional entre organizaciones",
                    "El isomorfismo institucional es siempre resultado de difusión cultural espontánea",
                    "Solo las instituciones internacionales pueden generar verdadero isomorfismo institucional"
                ],
                answer: 1,
                explanation: "Los autores identifican que la similitud institucional resulta de presiones normativas (profesionalización), miméticas (imitación ante incertidumbre) y coercitivas (regulaciones), no solo de fuerzas competitivas."
            },
            {
                question: "¿Cómo abordan Anderies y Janssen la tensión entre 'autonomía local' y 'coordinación sistémica'?",
                options: [
                    "Siempre priorizan la autonomía local sobre cualquier forma de coordinación sistémica",
                    "Buscan mecanismos que preserven autonomía local mientras facilitan coordinación cuando es necesaria",
                    "Consideran que autonomía y coordinación son objetivos mutuamente incompatibles",
                    "Solo la coordinación sistémica centralizada puede generar resultados institucionales efectivos"
                ],
                answer: 1,
                explanation: "Los autores proponen diseños institucionales que permitan autonomía local para adaptación contextual mientras mantienen mecanismos de coordinación sistémica para abordar problemas que trascienden escalas locales."
            },
            {
                question: "En la propuesta de Acuña y Chudnovsky sobre 'diagnóstico institucional', ¿qué dimensiones consideran fundamentales?",
                options: [
                    "Solo dimensiones técnicas de eficiencia operativa son relevantes para diagnóstico institucional",
                    "Dimensiones técnicas, políticas y socioculturales deben analizarse integradamente",
                    "Únicamente dimensiones políticas determinan la efectividad de cualquier arreglo institucional",
                    "El diagnóstico institucional es irrelevante porque todas las instituciones funcionan igual"
                ],
                answer: 1,
                explanation: "Los autores proponen diagnósticos multidimensionales que analicen capacidades técnicas, viabilidad política y legitimidad sociocultural de manera integrada, reconociendo que instituciones operan simultáneamente en estas tres dimensiones."
            },
            {
                question: "¿Qué rol asignan Anderies y Janssen a la 'innovación social' en transformaciones institucionales?",
                options: [
                    "La innovación social siempre desestabiliza peligrosamente arreglos institucionales existentes",
                    "La innovación social genera nuevas prácticas que pueden evolucionar hacia instituciones formales",
                    "Solo la innovación tecnológica tiene relevancia real para transformaciones institucionales",
                    "La innovación social es irrelevante porque las instituciones son estructuras completamente estáticas"
                ],
                answer: 1,
                explanation: "Los autores conceptualizan la innovación social como fuente de nuevas prácticas organizacionales y coordinación que, si demuestran efectividad, pueden institucionalizarse y escalar hacia arreglos más formales y estables."
            }
        ];

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 60 * 60; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            // Generate quiz selection buttons
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            timeRemaining = 60 * 60; // Reiniciar temporizador
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Cambiar color cuando quedan menos de 5 minutos
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });

            // Update progress bar
            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval); // Detener temporizador
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes(); // Regenerar los exámenes para que sean diferentes cada vez
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
