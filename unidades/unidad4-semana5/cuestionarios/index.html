    <script>
        const allQuestions = [
            {
                question: "Según Deubel, ¿cuál es la característica principal que diferencia al paradigma positivista del post-positivista en el análisis de políticas públicas?",
                options: [
                    "El positivismo rechaza la medición cuantitativa mientras el post-positivismo la acepta completamente",
                    "El positivismo considera que los hechos pueden separarse de los valores, mientras el post-positivismo sostiene que los hechos siempre están cargados de valores",
                    "El positivismo se centra en métodos cualitativos mientras el post-positivismo prefiere métodos cuantitativos",
                    "El positivismo acepta múltiples realidades mientras el post-positivismo defiende una sola realidad objetiva"
                ],
                answer: 1,
                explanation: "Deubel explica que el paradigma positivista considera posible separar hechos de valores manteniendo objetividad, mientras el post-positivismo sostiene que los hechos siempre están cargados de valores y la objetividad perfecta es imposible."
            },
            {
                question: "En el marco de análisis por el referencial de Pierre Muller, ¿qué función cumplen los 'operadores de transacción' o relación global-sectorial (RGS)?",
                options: [
                    "Establecen las normas constitucionales que rigen las políticas públicas en cada sector",
                    "Realizan los ajustes entre el referencial global y el sectorial a través de mediadores",
                    "Definen los valores fundamentales de cada sector de política pública específico",
                    "Coordinan la implementación entre diferentes niveles de gobierno y administración"
                ],
                answer: 1,
                explanation: "Según Muller, los operadores de transacción (RGS) corresponden a los algoritmos realizados por mediadores que establecen el puente y realizan ajustes entre el referencial global y el sectorial, constituyendo una dinámica continua de cambio en las políticas públicas."
            },
            {
                question: "Según la teoría de la elección racional y del Public Choice presentada por Deubel, ¿cuál es el objetivo principal del diseño institucional?",
                options: [
                    "Maximizar la participación ciudadana en los procesos democráticos y de consulta",
                    "Generar los costos de transacción más bajos posibles y evitar la captura por rent-seekers",
                    "Garantizar la representación proporcional de todos los grupos sociales en la política",
                    "Promover la transparencia en la gestión pública y el acceso a información"
                ],
                answer: 1,
                explanation: "Deubel explica que para el enfoque de Public Choice, los arreglos institucionales deben generar los costos de transacción más bajos posibles, evitando la captura de políticas por rent-seekers y garantizando mayor eficiencia en el uso de recursos."
            },
            {
                question: "En el marco Institutional Analysis and Development (IAD) de Elinor Ostrom, ¿cuáles son los tres tipos de factores que influyen en la estructuración de la 'arena de acción'?",
                options: [
                    "Recursos económicos disponibles, poder político de actores y legitimidad social",
                    "Reglas utilizadas por los participantes (rules-in-use), características materiales del contexto y particularidades culturales de la comunidad",
                    "Actores gubernamentales clave, organizaciones privadas influyentes y sociedad civil organizada",
                    "Agenda política definida, proceso de decisión establecido y implementación coordinada"
                ],
                answer: 1,
                explanation: "Según Deubel, el marco IAD de Ostrom considera tres tipos de factores que influyen en la arena de acción: las reglas utilizadas por los participantes (rules-in-use), las características materiales y físicas del contexto, y las particularidades culturales propias de la comunidad política."
            },
            {
                question: "¿Qué distingue al paradigma constructivista de los demás paradigmas según Deubel en cuanto a la concepción de la realidad?",
                options: [
                    "Considera que la realidad es objetiva y directamente asequible para la investigación",
                    "Sostiene que la realidad existe pero es de difícil acceso para el conocimiento",
                    "Afirma que la realidad es una construcción social y relativa",
                    "Defiende que la realidad puede ser explicada mediante leyes causales universales"
                ],
                answer: 2,
                explanation: "Deubel explica que el paradigma constructivista considera que la realidad es una construcción social y relativa, donde cada individuo puede ver la realidad de forma diferente, y que la realidad objetiva no es asequible o incluso no existe."
            },
            {
                question: "Según Estévez, ¿cuál es una de las principales fortalezas del Modelo Secuencial de políticas públicas?",
                options: [
                    "Su capacidad predictiva sobre resultados de políticas específicas",
                    "Su flexibilidad para incorporar nuevas teorías y su contribución a un lenguaje común en el campo",
                    "Su precisión en la determinación temporal de cada etapa",
                    "Su aplicabilidad exclusiva a sistemas democráticos desarrollados"
                ],
                answer: 1,
                explanation: "Estévez destaca que una fortaleza del Modelo Secuencial es su flexibilidad para incorporar nuevas teorías sin perder utilidad analítica, y su contribución al establecimiento de un lenguaje común y términos estandarizados en el análisis de políticas públicas."
            },
            {
                question: "¿Cuál es la crítica principal que Peter DeLeon hace al Modelo Secuencial según Estévez?",
                options: [
                    "Es demasiado complejo para estudiantes principiantes",
                    "No considera factores económicos en el análisis",
                    "Simplifica excesivamente el proceso con un enfoque lineal que no refleja la complejidad real",
                    "Se enfoca únicamente en políticas de nivel nacional"
                ],
                answer: 2,
                explanation: "Según Estévez, Peter DeLeon critica el Modelo Secuencial por su simplicidad y enfoque lineal, sosteniendo que simplifica excesivamente el proceso de formulación de políticas y no refleja la complejidad real donde las etapas interactúan de manera dinámica y no lineal."
            },
            {
                question: "En el análisis de Estévez sobre las etapas del Modelo Secuencial, ¿qué caracteriza la etapa de evaluación en América Latina?",
                options: [
                    "Es la etapa más desarrollada y sistemática",
                    "Tiende a ser la más débil debido a la falta de cultura de rendición de cuentas",
                    "Se aplica únicamente a políticas económicas",
                    "Se realiza exclusivamente por organismos internacionales"
                ],
                answer: 1,
                explanation: "Estévez señala que en muchos países de América Latina, la etapa de evaluación tiende a ser la más débil del proceso de políticas públicas, principalmente debido a la falta de una cultura de rendición de cuentas donde los políticos no están obligados a rendir cuentas transparentemente."
            },
            {
                question: "Según Estévez, ¿qué papel juegan los factores económicos en la gestión de políticas públicas durante crisis como el COVID-19?",
                options: [
                    "Son siempre determinantes y primordiales en todas las decisiones",
                    "Su impacto es relativo y depende de la perspectiva teórica adoptada por el analista",
                    "No tienen relevancia en situaciones de emergencia sanitaria",
                    "Se subordinan automáticamente a consideraciones de salud pública"
                ],
                answer: 1,
                explanation: "Estévez explica que el impacto de los factores económicos es relativo y depende de la perspectiva teórica adoptada. Para quienes adoptan una perspectiva economicista son primordiales, mientras que para otros enfoques pueden ser secundarios a factores sociales y políticos."
            },
            {
                question: "¿Cuál es la 'paradoja' fundamental que Olson identifica en la conducta de los grupos según su análisis de la acción colectiva?",
                options: [
                    "Los grupos pequeños son más efectivos que los grandes en conseguir recursos",
                    "Los individuos con intereses comunes no se organizarán automáticamente para satisfacerlos sin incentivos selectivos",
                    "Las organizaciones formales son menos eficientes que las informales",
                    "Los beneficios colectivos siempre superan a los costos individuales"
                ],
                answer: 1,
                explanation: "Olson establece que la paradoja consiste en que, aunque se supone que individuos con intereses comunes se organizarán para satisfacerlos, en realidad los grandes grupos de individuos racionales no actuarán en favor de sus intereses de grupo sin incentivos selectivos."
            },
            {
                question: "Según Olson, ¿por qué los bienes colectivos presentan el problema del 'free-rider' (polizón)?",
                options: [
                    "Porque son demasiado costosos de producir",
                    "Porque las ganancias se aplican a todos los miembros del grupo, incluyendo a quienes no contribuyen",
                    "Porque requieren tecnología avanzada para su provisión",
                    "Porque solo benefician a una minoría privilegiada"
                ],
                answer: 1,
                explanation: "Olson explica que el problema del free-rider surge porque las ganancias conseguidas mediante un bien colectivo son compartidas por todos los miembros del grupo, de manera que quienes no contribuyen conseguirán tanto como los que hicieron su aporte personal."
            },
            {
                question: "¿Qué son los 'incentivos selectivos' según la teoría de Olson?",
                options: [
                    "Beneficios que se otorgan únicamente a los líderes de las organizaciones",
                    "Incentivos que se aplican selectivamente según los individuos contribuyan o no a procurar el bien colectivo",
                    "Recompensas económicas basadas en el mérito individual",
                    "Políticas gubernamentales dirigidas a sectores específicos"
                ],
                answer: 1,
                explanation: "Olson define los incentivos selectivos como aquellos que se aplican selectivamente a los individuos según contribuyan o no a procurar el bien colectivo, pudiendo ser negativos (castigos) o positivos (recompensas)."
            },
            {
                question: "En el marco de Advocacy Coalitions de Sabatier presentado por Deubel, ¿qué elementos componen el 'sistema de creencias' de las coaliciones?",
                options: [
                    "Únicamente los recursos financieros disponibles",
                    "Solo las preferencias ideológicas de los miembros",
                    "Valores prioritarios, percepciones de relaciones causales, importancia del problema y eficacia de instrumentos",
                    "Exclusivamente las posiciones partidarias de los actores"
                ],
                answer: 2,
                explanation: "Según Deubel, en el marco de Advocacy Coalitions, el sistema de creencias incluye valores prioritarios, percepciones de relaciones causales y de la importancia del problema, así como apreciaciones sobre la eficacia de los instrumentos de política utilizados."
            },
            {
                question: "¿Por qué Olson considera que los pequeños grupos tienen ventajas sobre los grandes grupos para la acción colectiva?",
                options: [
                    "Porque tienen más recursos económicos disponibles",
                    "Porque cada miembro obtiene una mayor proporción de los beneficios y los costos de negociación son menores",
                    "Porque están menos regulados por el gobierno",
                    "Porque tienen mejor acceso a los medios de comunicación"
                ],
                answer: 1,
                explanation: "Olson explica que en grupos pequeños cada miembro obtiene una mayor proporción de los beneficios de la acción colectiva, lo que crea mayores incentivos para actuar. Además, los costos de negociación entre pocos miembros son menores que en grupos grandes."
            },
            {
                question: "Según Deubel, ¿cuál es la función de la retórica en las políticas públicas desde una perspectiva post-empiricista?",
                options: [
                    "Es un obstáculo para el análisis científico objetivo",
                    "Representa el arte de convencer o persuadir, crucial cuando hay incertidumbre y complejidad",
                    "Solo es relevante en regímenes autoritarios",
                    "Se limita a la comunicación entre expertos técnicos"
                ],
                answer: 1,
                explanation: "Deubel argumenta que desde una perspectiva post-empiricista, la retórica como arte de convencer o persuadir toma importancia crucial cuando existe gran incertidumbre, complejidad y polarización en un proceso de política pública, especialmente en contextos democráticos."
            },
            {
                question: "¿Qué características definen a un 'grupo privilegiado' en la terminología de Olson?",
                options: [
                    "Grupos que reciben subsidios gubernamentales especiales",
                    "Pequeños grupos donde se presume que conseguirán parte del bien colectivo sin incentivos selectivos",
                    "Organizaciones con acceso exclusivo a funcionarios de alto nivel",
                    "Grupos con miembros de alto estatus socioeconómico"
                ],
                answer: 1,
                explanation: "Olson define los 'grupos privilegiados' como pequeños grupos donde, debido a las proporciones costo-beneficio favorables y el reducido número de miembros, se presume que de hecho conseguirán parte del bien colectivo incluso sin incentivos selectivos."
            },
            {
                question: "Según Estévez, ¿por qué el Modelo Secuencial ha mantenido su relevancia desde las décadas de 1960 y 1970?",
                options: [
                    "Porque predice con precisión los resultados de las políticas",
                    "Por su utilidad pedagógica y analítica, proporcionando una estructura clara para entender las etapas de decisión pública",
                    "Porque es el único modelo aplicable a democracias modernas",
                    "Por su capacidad de cuantificar exactamente los impactos de las políticas"
                ],
                answer: 1,
                explanation: "Estévez sostiene que el Modelo Secuencial mantiene su relevancia por su utilidad tanto pedagógica como analítica, proporcionando una estructura clara para entender las diversas etapas que atraviesan las decisiones públicas desde la identificación del problema hasta la evaluación."
            },
            {
                question: "¿Cómo explica Olson la 'explotación de los grandes por los pequeños' en el contexto de la acción colectiva?",
                options: [
                    "Los grupos grandes siempre dominan a los pequeños por su mayor poder",
                    "Los miembros que más valoran el bien colectivo terminan cargando con la mayor parte de los costos",
                    "Los grupos pequeños tienen mejor acceso a recursos financieros",
                    "Es una consecuencia inevitable de las diferencias de clase social"
                ],
                answer: 1,
                explanation: "Olson explica que la 'explotación de los grandes por los pequeños' ocurre cuando los miembros que atribuyen más valor al bien colectivo (los 'grandes') terminan cargando con todo el peso del bien colectivo, mientras otros se aprovechan sin contribuir."
            },
            {
                question: "En el análisis de Deubel sobre el marco de análisis narrativo de Emery Roe, ¿cuándo es más pertinente aplicar este enfoque?",
                options: [
                    "Únicamente en políticas relacionadas con comunicación social",
                    "Cuando hay gran incertidumbre, complejidad y polarización, y faltan evidencias científicas",
                    "Solo en el análisis de políticas culturales",
                    "Exclusivamente para evaluar políticas implementadas"
                ],
                answer: 1,
                explanation: "Según Deubel, el análisis narrativo de Roe es pertinente cuando hay gran incertidumbre, complejidad y polarización, especialmente cuando faltan evidencias y conocimientos científicos, muchas variables son interdependientes, y existe polarización extrema entre actores."
            },
            {
                question: "¿Cuál es la crítica principal que hace Estévez a la falta de evaluación en las políticas públicas latinoamericanas?",
                options: [
                    "Se debe únicamente a limitaciones técnicas y falta de recursos",
                    "Refleja la ausencia de una cultura de rendición de cuentas y delegación de responsabilidades sin seguimiento riguroso",
                    "Es consecuencia de la inestabilidad política regional",
                    "Se origina en la influencia de organismos internacionales"
                ],
                answer: 1,
                explanation: "Estévez, basándose en O'Donnell, critica que la falta de evaluación refleja la ausencia de una cultura de rendición de cuentas, donde la relación entre ciudadanos y políticos se basa en delegación de responsabilidades sin seguimiento riguroso ni exigencia de resultados."
            },
            {
                question: "Según Olson, ¿por qué la información sobre bienes colectivos puede considerarse ella misma un bien colectivo?",
                options: [
                    "Porque siempre es producida por el gobierno",
                    "Porque los beneficios de que un individuo se instruya sobre bienes públicos se dispersan por todo el grupo",
                    "Porque es accesible únicamente a través de medios masivos",
                    "Porque requiere inversión colectiva para ser producida"
                ],
                answer: 1,
                explanation: "Olson explica que la información sobre bienes colectivos es ella misma un bien colectivo porque los beneficios de que un individuo se instruya sobre bienes públicos están dispersos por todo un grupo o nación, no concentrados en quien asume los costos de instruirse."
            },
            {
                question: "En el marco de la teoría crítica presentada por Deubel, ¿cuál es el objetivo principal del análisis de políticas públicas?",
                options: [
                    "Maximizar la eficiencia económica de las intervenciones gubernamentales",
                    "Develar las relaciones de poder y contribuir a esclarecer posibilidades de acciones emancipadoras",
                    "Optimizar los procesos de toma de decisiones burocráticas",
                    "Reducir los costos de transacción en la administración pública"
                ],
                answer: 1,
                explanation: "Según Deubel, la teoría crítica busca develar las relaciones de poder y las manipulaciones de la vida cotidiana, con el objetivo de esclarecer y comunicar a los ciudadanos las posibilidades de vida mejor y de acciones emancipadoras."
            },
            {
                question: "¿Qué diferencia establece Estévez entre 'políticas gubernamentales' y 'políticas estatales'?",
                options: [
                    "Las gubernamentales son más importantes que las estatales",
                    "Las gubernamentales reflejan decisiones de un gobierno particular, mientras las estatales representan continuidades históricas",
                    "Solo las estatales requieren aprobación legislativa",
                    "Las gubernamentales se aplican únicamente a nivel local"
                ],
                answer: 1,
                explanation: "Estévez diferencia que las 'políticas gubernamentales' reflejan las decisiones de un gobierno en particular durante un período específico, mientras las 'políticas estatales' representan continuidades históricas en la toma de decisiones que trascienden los cambios de gobierno."
            },
            {
                question: "Según Olson, ¿cuál es la relación entre el tamaño del grupo y el incentivo para la acción colectiva?",
                options: [
                    "Los grupos más grandes siempre tienen más incentivos",
                    "El tamaño del grupo no afecta los incentivos para la acción",
                    "Cuanto mayor sea el grupo, menor será el porcentaje de ganancias que corresponda a cada individuo",
                    "Solo importa la homogeneidad social, no el tamaño"
                ],
                answer: 2,
                explanation: "Olson establece el principio de que cuanto mayor sea la cantidad de individuos que se beneficien de un bien colectivo, menor será el porcentaje de ganancias que le corresponda al individuo que lleva a cabo la acción, reduciendo así el incentivo para actuar."
            },
            {
                question: "¿Cómo caracteriza Deubel al paradigma de la teoría crítica en cuanto a la objetividad científica?",
                options: [
                    "Sostiene que la objetividad es posible mediante métodos rigurosos",
                    "Considera que la objetividad y su búsqueda son ilusorias, ya que la actividad investigativa está siempre orientada por valores",
                    "Defiende una objetividad limitada pero alcanzable",
                    "Propone métodos alternativos para lograr objetividad"
                ],
                answer: 1,
                explanation: "Deubel explica que la teoría crítica considera que la objetividad y la búsqueda de ésta son ilusorias, pues la actividad investigativa está siempre orientada por valores, y por tanto la política está en todas partes, asumiendo una postura 'en valor'."

                answer: 1,
                explanation: "Olson reconoce que la coerción (a través de obligaciones legales, impuestos obligatorios, sanciones) puede ser un mecanismo efectivo para superar el problema del free rider y garantizar la provisión de bienes colectivos cuando los incentivos selectivos voluntarios son insuficientes."
            },
            {
                question: "Según Deubel, ¿cómo se diferencia el 'nuevo institucionalismo' del institucionalismo tradicional en el análisis de políticas?",
                options: [
                    "Solo analiza instituciones formales vs. informales",
                    "Considera las instituciones como variables independientes que moldean comportamientos, preferencias y resultados, no solo como estructuras formales",
                    "Se enfoca únicamente en aspectos legales",
                    "Ignora completamente el papel de actores individuales"
                ],
                answer: 1,
                explanation: "Deubel explica que el nuevo institucionalismo trata las instituciones como variables independientes que moldean activamente comportamientos, preferencias y resultados de política, incluyendo reglas formales e informales, normas y procedimientos, no solo estructuras organizacionales formales."
            },
            {
                question: "En el análisis de Estévez sobre la etapa de agenda-setting, ¿qué factores específicos determinan que un problema ingrese a la agenda gubernamental?",
                options: [
                    "Solo la gravedad objetiva del problema",
                    "Combinación de ventanas de oportunidad política, movilización de actores, eventos focalizadores y competencia entre problemas por atención",
                    "Únicamente decisiones presidenciales",
                    "Solo presión mediática"
                ],
                answer: 1,
                explanation: "Estévez identifica múltiples factores para el agenda-setting: apertura de ventanas de oportunidad política (policy windows), capacidad de movilización de actores relevantes, eventos focalizadores que dramatizan problemas, y competencia entre múltiples problemas por atención gubernamental limitada."
            },
            {
                question: "Según Olson, ¿cómo se explica la paradoja de que grupos económicamente poderosos a veces tengan menor influencia política que grupos más pequeños?",
                options: [
                    "Los grupos poderosos no tienen intereses políticos",
                    "Los grupos grandes enfrentan mayores problemas de acción colectiva, mientras grupos pequeños pueden organizarse más efectivamente",
                    "Los grupos pequeños siempre tienen más recursos",
                    "Esta paradoja no existe en la realidad"
                ],
                answer: 1,
                explanation: "Olson explica que grupos económicamente grandes (como consumidores) pueden tener menor influencia porque enfrentan severos problemas de acción colectiva, mientras grupos pequeños pero concentrados (como productores específicos) pueden organizarse más fácilmente y ejercer mayor presión política."
            },
            {
                question: "Según Deubel, ¿qué caracteriza al paradigma del 'New Public Management' en la modernización del Estado?",
                options: [
                    "Expansión del sector público tradicional",
                    "Aplicación de principios de gestión privada al sector público: orientación a resultados, competencia, descentralización y enfoque en cliente",
                    "Centralización de todas las decisiones gubernamentales",
                    "Eliminación completa de mecanismos de mercado"
                ],
                answer: 1,
                explanation: "Deubel explica que el New Public Management busca modernizar el Estado aplicando principios empresariales: gestión orientada a resultados más que a procedimientos, introducción de competencia, descentralización, outsourcing y tratamiento del ciudadano como cliente con expectativas de calidad."
            },
            {
                question: "En la perspectiva de Estévez sobre evaluación de políticas, ¿qué diferencia establece entre evaluación 'formativa' y 'sumativa'?",
                options: [
                    "Formativa es cuantitativa y sumativa es cualitativa",
                    "Formativa se realiza durante implementación para mejorar el programa, sumativa se hace después para juzgar efectividad global",
                    "Formativa es interna y sumativa es externa",
                    "Formativa es obligatoria y sumativa es voluntaria"
                ],
                answer: 1,
                explanation: "Estévez distingue: evaluación formativa se realiza durante la implementación del programa para identificar problemas y realizar ajustes sobre la marcha; evaluación sumativa se realiza al final para juzgar la efectividad global del programa y decidir su continuación, expansión o terminación."
            },
            {
                question: "Según Olson, ¿cómo se relaciona el concepto de 'by-product' con la provisión de bienes colectivos?",
                options: [
                    "Los by-products siempre impiden la acción colectiva",
                    "Grupos pueden formar para obtener beneficios privados (by-products) y, secundariamente, producir bienes colectivos",
                    "Los by-products solo existen en sectores económicos",
                    "No existe relación entre by-products y bienes colectivos"
                ],
                answer: 1,
                explanation: "Olson argumenta que muchos grupos se forman inicialmente para proporcionar beneficios privados exclusivos (by-products) a sus miembros, y como consecuencia secundaria también producen bienes colectivos, resolviendo así el problema del free rider a través de incentivos selectivos."
            },
            {
                question: "Según Deubel, ¿qué papel cumple la 'narrativa' en el enfoque post-positivista de análisis de políticas?",
                options: [
                    "Las narrativas solo confunden el análisis objetivo",
                    "Las narrativas son formas en que actores dan sentido a problemas y construyen realidad política, influyendo en formulación de políticas",
                    "Las narrativas son irrelevantes para políticas públicas",
                    "Las narrativas solo importan en comunicación mediática"
                ],
                answer: 1,
                explanation: "Deubel explica que en el enfoque post-positivista, las narrativas son fundamentales porque los actores políticos construyen significado y dan sentido a problemas a través de historias y marcos interpretativos que definen causas, responsabilidades y soluciones, moldeando así el proceso de políticas."
            },
            {
                question: "En el análisis de Estévez sobre policy networks, ¿qué ventajas específicas ofrecen para la gobernanza contemporánea?",
                options: [
                    "Simplifican la toma de decisiones eliminando actores",
                    "Facilitan coordinación entre actores diversos, combinan recursos y conocimientos especializados, y mejoran legitimidad de decisiones",
                    "Solo reducen costos administrativos",
                    "Únicamente aceleran procesos burocráticos"
                ],
                answer: 1,
                explanation: "Estévez argumenta que las policy networks ofrecen ventajas para gobernanza compleja: facilitan coordinación entre actores gubernamentales y no gubernamentales, combinan recursos públicos y privados, integran conocimientos especializados diversos y pueden mejorar legitimidad de decisiones a través de participación amplia."
            },
            {
                question: "Según Olson, ¿cómo se explica que los sindicatos puedan superar el problema del free rider en la representación laboral?",
                options: [
                    "Porque todos los trabajadores tienen intereses idénticos",
                    "A través de cláusulas de seguridad sindical, beneficios exclusivos para afiliados y presión social en el lugar de trabajo",
                    "Porque el gobierno siempre los apoya",
                    "Solo mediante ideología solidaria"
                ],
                answer: 1,
                explanation: "Olson explica que los sindicatos utilizan varios mecanismos: cláusulas de seguridad sindical (closed shop, union shop), beneficios selectivos exclusivos para afiliados (seguros, servicios legales), y presión social directa en el lugar de trabajo que facilita la identificación y sanción de free riders."
            },
            {
                question: "Según Deubel, ¿qué caracteriza al enfoque de 'policy transfer' en el análisis comparativo de políticas públicas?",
                options: [
                    "Solo analiza políticas nacionales aisladamente",
                    "Estudia cómo conocimientos, instituciones y políticas se transfieren entre diferentes contextos geográficos y temporales",
                    "Se enfoca únicamente en aspectos legales",
                    "Ignora factores culturales y contextuales"
                ],
                answer: 1,
                explanation: "Deubel explica que el policy transfer analiza procesos mediante los cuales conocimientos sobre políticas, instituciones administrativas, programas específicos se transfieren y adaptan entre diferentes países, niveles de gobierno o sectores, considerando factores facilitadores y limitantes de estas transferencias."
            }
        ];

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 3600; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');
        const timerElement = document.getElementById('timer');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startTimer() {
            timeRemaining = 3600; // 60 minutos
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('¡Tiempo agotado!');
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            timerElement.textContent = display;
            
            // Cambiar color cuando quedan menos de 5 minutos
            if (timeRemaining <= 300) {
                timerElement.className = 'text-lg font-semibold text-red-600';
            } else {
                timerElement.className = 'text-lg font-semibold text-gray-700';
            }
        }

        function generateQuizzes() {
            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            // Generate quiz selection buttons
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes(); // Regenerar los exámenes para que sean diferentes cada vez
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
