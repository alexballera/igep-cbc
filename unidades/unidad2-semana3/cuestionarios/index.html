<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <script>
        const allQuestions = [
            {
                question: "Según la tipología de Weber desarrollada por Panebianco, ¿qué caracteriza fundamentalmente a los partidos de 'difusión territorial' frente a los de 'penetración territorial'?",
                options: ["Su financiamiento público", "El desarrollo orgánico desde centros locales vs. la imposición desde arriba", "Su ideología específica", "Su tamaño organizacional"],
                answer: 1,
                explanation: "Los partidos de difusión territorial se desarrollan orgánicamente desde núcleos locales hacia el centro nacional, mientras que los de penetración territorial son impuestos desde arriba hacia abajo por líderes centrales."
            },
            {
                question: "En la teoría de sistemas de partidos de Sartori, ¿qué distingue al 'pluralismo polarizado' del 'pluralismo moderado'?",
                options: ["El número de partidos efectivos", "La presencia de partidos antisistémicos y centrífugos", "El nivel de financiamiento", "La edad del sistema"],
                answer: 1,
                explanation: "El pluralismo polarizado se caracteriza por la presencia de partidos antisistémicos que rechazan la legitimidad del régimen y dinámicas centrífugas que alejan a los partidos del centro político."
            },
            {
                question: "Según Lipset y Rokkan, el clivaje 'centro-periferia' en la construcción del Estado-nación genera típicamente partidos:",
                options: ["De clase obrera", "Regionales, étnicos o nacionalistas", "Religiosos", "Liberales económicos"],
                answer: 1,
                explanation: "El clivaje centro-periferia surge de las tensiones entre la construcción nacional centralizada y las identidades locales, generando partidos que defienden autonomías regionales, derechos étnicos o nacionalismos subestatales."
            },
            {
                question: "¿Qué caracteriza esencialmente a los 'partidos cartel' según Katz y Mair en contraposición a los partidos de masas tradicionales?",
                options: [
                    "Mayor militancia partidaria", 
                    "Dependencia del financiamiento estatal y colusión entre partidos principales", 
                    "Ideologías más fuertes", 
                    "Mayor participación ciudadana"
                ],
                answer: 1,
                explanation: "Los partidos cartel se caracterizan por su dependencia del Estado para financiamiento, la colusión entre partidos principales para mantener el sistema, y el alejamiento de sus bases sociales originales."
            },
            {
                question: "En la conceptualización de Dahl sobre poliarquía, ¿qué diferencia fundamental existe entre 'liberalización' y 'democratización'?",
                options: [
                    "No hay diferencia conceptual", 
                    "Liberalización refiere a competencia política; democratización a participación inclusiva", 
                    "Son procesos idénticos", 
                    "Una es económica, otra política"
                ],
                answer: 1,
                explanation: "Para Dahl, liberalización implica apertura a la competencia política (debate público), mientras democratización se refiere a la expansión de la participación política (inclusividad)."
            },
            {
                question: "Según Lijphart, ¿cuál es la diferencia fundamental entre democracia 'mayoritaria' y 'consensual' en términos de legitimidad?",
                options: [
                    "Una es más antigua", 
                    "Mayoritaria busca eficiencia gubernamental; consensual busca legitimidad inclusiva", 
                    "No hay diferencias de legitimidad", 
                    "Una es federal, otra unitaria"
                ],
                answer: 1,
                explanation: "El modelo mayoritario prioriza la eficiencia gubernamental y la responsabilidad política, mientras el consensual busca maximizar la legitimidad a través de la inclusión de múltiples sectores sociales."
            },
            {
                question: "¿Qué implica el concepto de 'institucionalización partidaria' según Huntington aplicado por Panebianco?",
                options: [
                    "Mayor número de militantes", 
                    "Adaptabilidad, complejidad, autonomía y coherencia organizacional", 
                    "Más financiamiento estatal", 
                    "Mayor presencia mediática"
                ],
                answer: 1,
                explanation: "La institucionalización partidaria implica el desarrollo de estructuras organizacionales adaptables, complejas, autónomas respecto a otros grupos, y coherentes en sus procedimientos internos."
            },
            {
                question: "En la teoría de Duverger sobre la relación entre sistemas electorales y sistemas de partidos, ¿qué efectos produce el ballotage o segunda vuelta?",
                options: [
                    "Reduce el número de partidos", 
                    "Permite la supervivencia de múltiples partidos con estrategias de alianzas", 
                    "Elimina partidos pequeños", 
                    "No tiene efectos significativos"
                ],
                answer: 1,
                explanation: "El ballotage permite que múltiples partidos sobrevivan en la primera vuelta mediante estrategias de alianzas para la segunda vuelta, modificando los efectos reductivos del sistema mayoritario puro."
            },
            {
                question: "Según O'Donnell y Schmitter en su análisis de transiciones democráticas, ¿qué caracteriza a los 'pactos' como instrumento de democratización?",
                options: [
                    "Son acuerdos públicos", 
                    "Acuerdos explícitos entre élites para definir reglas de competencia política", 
                    "Solo involucran partidos", 
                    "Son temporales sin efectos duraderos"
                ],
                answer: 1,
                explanation: "Los pactos son acuerdos explícitos, usualmente secretos inicialmente, entre élites políticas competidoras para establecer reglas de juego que permitan la transición y consolidación democrática."
            },
            {
                question: "¿Qué distingue a los regímenes 'híbridos' según Levitsky y Way del concepto tradicional de democracia y autoritarismo?",
                options: [
                    "Son temporales", 
                    "Mantienen instituciones democráticas formales pero con autoritarismo competitivo", 
                    "No existen realmente", 
                    "Son solo democracias imperfectas"
                ],
                answer: 1,
                explanation: "Los regímenes híbridos mantienen las instituciones formales de la democracia (elecciones, partidos, medios) pero las autoridades abusan sistemáticamente de los recursos estatales, restringen los medios y utilizan el aparato legal contra la oposición."
            },
            {
                question: "En la tipología de Kirchheimer, ¿qué caracteriza la transformación de partidos de masas a 'catch-all parties'?",
                options: [
                    "Mayor ideologización partidaria", 
                    "Abandono de vínculos de clase específicos para apelar a electorados amplios", 
                    "Reducción organizacional", 
                    "Mayor militancia"
                ],
                answer: 1,
                explanation: "Los catch-all parties abandonan los vínculos estrechos con clases sociales específicas, diluyen su ideología y amplían su apelación electoral para captar votantes de diversos sectores sociales."
            },
            {
                question: "Según la teoría de institucionalización de Polsby aplicada a partidos, ¿qué indica el desarrollo de 'fronteras organizacionales' claras?",
                options: [
                    "Cierre a nuevos miembros", 
                    "Diferenciación entre miembros y no miembros con criterios de entrada específicos", 
                    "Menor flexibilidad organizacional", 
                    "Más burocracia interna"
                ],
                answer: 1,
                explanation: "Las fronteras organizacionales claras implican criterios específicos para la membresía, procedimientos de entrada y diferenciación nítida entre quienes pertenecen y no pertenecen a la organización partidaria."
            },
            {
                question: "¿Qué papel cumplen los 'partidos antisistémicos' en la dinámica del pluralismo polarizado según Sartori?",
                options: [
                    "Estabilizan el sistema", 
                    "Erosionan la legitimidad del régimen y generan dinámicas centrífugas", 
                    "Moderan las posiciones", 
                    "No tienen efectos significativos"
                ],
                answer: 1,
                explanation: "Los partidos antisistémicos rechazan la legitimidad del régimen democrático-liberal, promoviendo dinámicas centrífugas que alejan a otros partidos del centro político y erosionan el consenso democrático."
            },
            {
                question: "En el modelo de 'democracia delegativa' de O'Donnell, ¿qué caracteriza la relación entre presidente electo y accountability horizontal?",
                options: [
                    "Mayor responsabilidad institucional", 
                    "Rechazo sistemático de controles institucionales inter-poderes", 
                    "Fortalecimiento del parlamento", 
                    "Mayor transparencia gubernamental"
                ],
                answer: 1,
                explanation: "La democracia delegativa se caracteriza por presidentes que consideran que su mandato electoral los autoriza a gobernar sin restricciones, rechazando los controles institucionales horizontales de otros poderes del Estado."
            },
            {
                question: "Según Weber en su análisis de dominación política aplicado por Panebianco, ¿qué caracteriza a la autoridad 'carismática' en organizaciones partidarias?",
                options: [
                    "Respeto a reglas tradicionales", 
                    "Dominación basada en cualidades excepcionales del líder", 
                    "Legalidad procedimental", 
                    "Eficiencia administrativa"
                ],
                answer: 1,
                explanation: "La autoridad carismática se basa en la creencia en las cualidades excepcionales (carisma) del líder, generando lealtad personal que puede entrar en conflicto con la institucionalización organizacional."
            },
            {
                question: "¿Qué implica el concepto de 'volatilidad electoral' en el análisis de sistemas de partidos según Bartolini y Mair?",
                options: [
                    "Cambios ideológicos partidarios", 
                    "Inestabilidad en los vínculos entre partidos y electorados", 
                    "Mayor participación electoral", 
                    "Renovación generacional"
                ],
                answer: 1,
                explanation: "La volatilidad electoral mide la inestabilidad en las preferencias electorales y los vínculos entre partidos y sus bases sociales, indicando el grado de estructuración del sistema de partidos."
            },
            {
                question: "En la teoría de Rokkan sobre construcción de sistemas de partidos europeos, ¿qué significa el concepto de 'congelación' (freezing) de clivajes?",
                options: [
                    "Eliminación de conflictos sociales", 
                    "Cristalización duradera de divisiones sociales en sistemas de partidos específicos", 
                    "Reducción de partidos políticos", 
                    "Fin de la competencia electoral"
                ],
                answer: 1,
                explanation: "La 'congelación' implica que las divisiones sociales fundamentales se cristalizaron en sistemas de partidos específicos durante períodos formativos, manteniéndose relativamente estables durante décadas."
            },
            {
                question: "Según Linz en su análisis de regímenes no democráticos, ¿qué distingue fundamentalmente a los regímenes 'autoritarios' de los 'totalitarios'?",
                options: [
                    "El nivel de represión política", 
                    "Pluralismo limitado vs. monismo político total", 
                    "La duración en el poder", 
                    "El apoyo popular"
                ],
                answer: 1,
                explanation: "Los regímenes autoritarios mantienen un pluralismo limitado y no buscan el control total de la sociedad, mientras los totalitarios imponen un monismo político absoluto y control total sobre todas las esferas sociales."
            },
            {
                question: "¿Qué caracteriza a los 'nuevos partidos' según Poguntke en contraposición a los partidos tradicionales de masas?",
                options: [
                    "Mayor antigüedad histórica", 
                    "Estructuras organizacionales flexibles, profesionalización y orientación mediática", 
                    "Más militantes activos", 
                    "Ideologías más fuertes"
                ],
                answer: 1,
                explanation: "Los nuevos partidos se caracterizan por estructuras organizacionales más flexibles, alto grado de profesionalización, orientación hacia los medios de comunicación y menor dependencia de militancia masiva."
            },
            {
                question: "En la conceptualización de Schmitter sobre corporativismo, ¿cómo se relaciona este concepto con la competencia partidaria tradicional?",
                options: [
                    "Son complementarios siempre", 
                    "El corporativismo puede limitar la competencia partidaria a través de representación funcional", 
                    "No hay relación entre ambos", 
                    "Fortalece los partidos políticos"
                ],
                answer: 1,
                explanation: "El corporativismo implica la representación de intereses a través de organizaciones funcionales (sindicatos, cámaras empresariales), lo que puede limitar o canalizar la competencia partidaria tradicional."
            },
            {
                question: "Según la teoría de 'congruencia' de Eckstein aplicada a sistemas políticos, ¿qué implica para la estabilidad democrática?",
                options: [
                    "Homogeneidad social completa", 
                    "Correspondencia entre patrones de autoridad en diferentes esferas sociales", 
                    "Liderazgo fuerte centralizado", 
                    "Partidos únicos"
                ],
                answer: 1,
                explanation: "La teoría de congruencia sostiene que la estabilidad democrática requiere correspondencia entre los patrones de autoridad democráticos en la esfera política y en otras instituciones sociales (familia, escuela, trabajo)."
            },
            {
                question: "¿Qué distingue el concepto de 'responsividad' (responsiveness) del de 'accountability' en la teoría democrática según Powell?",
                options: [
                    "Son sinónimos conceptualmente", 
                    "Responsividad es correspondencia con preferencias ciudadanas; accountability es control ex-post", 
                    "No hay diferencia práctica", 
                    "Uno es legal, otro político"
                ],
                answer: 1,
                explanation: "Responsividad se refiere a la correspondencia entre políticas gubernamentales y preferencias ciudadanas, mientras accountability implica mecanismos de control y sanción ex-post del desempeño gubernamental."
            },
            {
                question: "En el modelo de Downs sobre competencia electoral, ¿qué papel cumple la 'información imperfecta' en el comportamiento de partidos y votantes?",
                options: ["No afecta las decisiones", "Genera incertidumbre que afecta estrategias partidarias y decisiones electorales", "Mejora la democracia", "Reduce la competencia"],
                answer: 1,
                explanation: "La información imperfecta genera incertidumbre sobre preferencias electorales y efectos de políticas, llevando a partidos a adoptar estrategias de diferenciación ideológica y a votantes a usar atajos cognitivos."
            },
            {
                question: "Según Mainwaring y Scully, ¿qué caracteriza a un sistema de partidos 'institucionalizado'?",
                options: ["Muchos partidos", "Estabilidad competitiva, legitimidad social, organización fuerte y regulación efectiva", "Partidos antiguos", "Ideologías claras"],
                answer: 1,
                explanation: "Un sistema institucionalizado presenta: estabilidad en patrones de competencia, legitimidad social de partidos y procesos electorales, organizaciones partidarias sólidas, y reglas de juego aceptadas y efectivas."
            },
            {
                question: "¿Qué implica el concepto de 'path dependency' (dependencia del sendero) en la evolución de sistemas de partidos?",
                options: ["Cambio constante", "Las decisiones históricas condicionan desarrollos posteriores creando inercias institucionales", "Determinismo absoluto", "Flexibilidad total"],
                answer: 1,
                explanation: "La dependencia del sendero implica que las decisiones y configuraciones históricas iniciales crean dinámicas institucionales que condicionan y limitan las opciones de desarrollo futuro de los sistemas partidarios."
            },
            {
                question: "En la teoría de coaliciones de Riker aplicada a sistemas multipartidistas, ¿qué caracteriza a las 'coaliciones mínimas ganadoras'?",
                options: ["Incluyen a todos los partidos", "Solo incluyen los partidos necesarios para obtener mayoría", "Son las más grandes posibles", "Duran más tiempo"],
                answer: 1,
                explanation: "Las coaliciones mínimas ganadoras incluyen solo los partidos estrictamente necesarios para obtener mayoría, maximizando los beneficios para cada socio al no incluir actores innecesarios."
            },
            {
                question: "Según Kitschelt en su análisis de partidos de izquierda contemporáneos, ¿qué caracteriza la tensión entre 'estrategia electoral' y 'identidad programática'?",
                options: ["Son complementarias", "Maximizar votos puede requerir moderar posiciones ideológicas originales", "No existe tensión", "La identidad es irrelevante"],
                answer: 1,
                explanation: "Los partidos enfrentan el dilema entre mantener coherencia ideológica y identidad programática versus moderar posiciones para ampliar el electorado y maximizar votos."
            },
            {
                question: "¿Qué caracteriza al concepto de 'democracia iliberal' según Zakaria en contraposición a la democracia liberal clásica?",
                options: ["Mayor participación", "Elecciones competitivas sin protección efectiva de derechos individuales y minoritarios", "Más libertades", "Mejor gobierno"],
                answer: 1,
                explanation: "La democracia iliberal mantiene elecciones competitivas y procedimientos democráticos formales, pero carece de protección efectiva de derechos constitucionales, libertades civiles y derechos de minorías."
            },
            {
                question: "En la tipología de Rose y Mackie sobre 'familias espirituales' de partidos europeos, ¿qué caracteriza a los partidos 'liberal-democráticos'?",
                options: ["Defensa del socialismo", "Combinación de liberalismo económico con democracia política y derechos individuales", "Autoritarismo", "Conservadurismo tradicional"],
                answer: 1,
                explanation: "Los partidos liberal-democráticos combinan la defensa del liberalismo económico (mercado libre) con el compromiso con la democracia política, el constitucionalismo y los derechos individuales."
            },
            {
                question: "Según Tarrow en su análisis de movimientos sociales, ¿cómo se relacionan estos con el sistema de partidos establecido?",
                options: ["Son independientes", "Pueden transformarse en partidos o ser cooptados por partidos existentes", "Siempre se oponen", "No hay relación"],
                answer: 1,
                explanation: "Los movimientos sociales pueden institucionalizarse transformándose en partidos políticos, ser cooptados por partidos existentes, o mantener relaciones de tensión/cooperación con el sistema partidario."
            },
            {
                question: "¿Qué implica el concepto de 'cartelización' del sistema de partidos según Blyth y Katz?",
                options: ["Mayor competencia", "Colusión entre partidos principales para mantener barreras de entrada al sistema", "Reducción de partidos", "Democratización interna"],
                answer: 1,
                explanation: "La cartelización implica que los partidos principales actúan colusivamente para mantener barreras de entrada, compartir recursos estatales y limitar la competencia de nuevos actores políticos."
            },
            {
                question: "En el análisis de Przeworski sobre democratización, ¿qué papel cumple la 'incertidumbre institucionalizada' en la consolidación democrática?",
                options: ["Genera inestabilidad", "Permite que todos los actores tengan posibilidades de ganar respetando las reglas", "Debe eliminarse", "Es perjudicial"],
                answer: 1,
                explanation: "La incertidumbre institucionalizada implica que ningún actor puede garantizar permanentemente su victoria, pero todos tienen posibilidades de ganar si respetan las reglas democráticas, incentivando el cumplimiento."
            },
            {
                question: "Según Laakso y Taagepera, ¿qué mide el índice de 'número efectivo de partidos' en un sistema político?",
                options: ["Total de partidos registrados", "Número de partidos con peso político real ponderado por su tamaño", "Partidos en el parlamento", "Partidos con representación"],
                answer: 1,
                explanation: "El número efectivo de partidos pondera el tamaño relativo de cada partido, proporcionando una medida más precisa de la fragmentación real del sistema que el simple conteo de partidos existentes."
            },
            {
                question: "¿Qué caracteriza a los 'partidos nicho' según Meguid en contraposición a los partidos mainstream?",
                options: ["Son más pequeños", "Se especializan en issues específicos no cubiertos por partidos principales", "Son más nuevos", "Tienen menos recursos"],
                answer: 1,
                explanation: "Los partidos nicho se especializan en temas específicos (medio ambiente, inmigración, regionalismos) que los partidos mainstream no cubren adecuadamente, ganando espacio en dimensiones de competencia no tradicionales."

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
                
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
