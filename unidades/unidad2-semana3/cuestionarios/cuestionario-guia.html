    <script>
        const allQuestions = [
    {
        question: "Según Malamud, ¿cuál es el origen de los partidos políticos?",
        options: [
            "Surgieron como una evolución natural de los gremios y corporaciones medievales para representar intereses económicos en la corte.",
            "Nacieron dentro de los parlamentos como facciones o grupos de legisladores que se unían para coordinar sus votos y estrategias.",
            "Fueron creados por los monarcas absolutistas como un instrumento para centralizar el poder y controlar a la nobleza terrateniente.",
            "Se originaron a partir de los movimientos revolucionarios y clubes de debate del siglo XVIII, fuera de las instituciones estatales."
        ],
        answer: 1,
        explanation: "Malamud explica que los partidos políticos modernos tienen un origen parlamentario, naciendo como facciones o grupos de legisladores que se unían para coordinar sus votos y estrategias."
    },
    {
        question: "¿Qué es un 'partido de masas' según la tipología clásica?",
        options: [
            "Un partido que utiliza de forma intensiva los medios de comunicación de masas para difundir un mensaje simple y atraer a un electorado amplio pero poco politizado.",
            "Un partido político enfocado en una única figura carismática, cuya organización y programa dependen enteramente de la voluntad del líder.",
            "Un partido con una gran base de afiliados que provee financiamiento a través de cuotas, movilización social y educación ideológica a sus miembros.",
            "Un partido que busca representar a todas las clases sociales y grupos de interés de una nación, moderando su ideología para lograr un consenso amplio."
        ],
        answer: 2,
        explanation: "Los partidos de masas, como los socialistas europeos, se caracterizan por tener una organización burocrática fuerte, una gran cantidad de miembros afiliados que pagan cuotas y una ideología clara."
    },
    {
        question: "¿A qué se refiere el concepto de 'partido cartel' (cartel party)?",
        options: [
            "A un tipo de partido que establece un monopolio sobre la representación política, prohibiendo la existencia de otras organizaciones partidarias.",
            "A partidos que dependen exclusivamente del financiamiento de un pequeño grupo de grandes corporaciones, formando un 'cartel' de intereses económicos.",
            "A un tipo de partido donde la competencia ideológica disminuye y cooperan entre sí para obtener financiamiento estatal y repartirse el poder.",
            "A una coalición de partidos pequeños que se unen para competir contra los partidos más grandes y romper el bipartidismo tradicional."
        ],
        answer: 2,
        explanation: "El modelo de partido cartel, propuesto por Katz y Mair, describe una etapa en la que los partidos principales, en lugar de competir ideológicamente, tienden a coludir entre sí y con el Estado para asegurarse recursos públicos y mantenerse en el poder."
    },
    {
        question: "¿Cuál de las siguientes NO es una función de los partidos políticos según Malamud?",
        options: [
            "El reclutamiento y la selección de líderes y candidatos para ocupar cargos públicos electivos y administrativos.",
            "La agregación de diversas demandas e intereses de la sociedad en un programa de gobierno coherente.",
            "La administración de justicia y la interpretación de la constitucionalidad de las leyes.",
            "La socialización política de los ciudadanos y la movilización del electorado durante las campañas electorales."
        ],
        answer: 2,
        explanation: "La administración de justicia es una función del poder judicial. Los partidos políticos se encargan de reclutar élites, agregar demandas sociales, movilizar votantes y estructurar el gobierno, pero no de impartir justicia."
    },
    {
        question: "¿Qué es un sistema de partidos?",
        options: [
            "El conjunto de normas constitucionales y legales que regulan la creación, financiamiento y disolución de los partidos políticos en un país.",
            "La clasificación de los partidos políticos de un país según su ubicación en el espectro ideológico izquierda-derecha.",
            "El patrón de interacciones y competencia entre los partidos políticos relevantes de un país, definido por su número y polarización.",
            "La estructura organizativa interna de un partido político, incluyendo sus órganos de decisión, sus facciones y sus líderes."
        ],
        answer: 2,
        explanation: "Un sistema de partidos se define por el número de partidos relevantes y el patrón de competencia e interacción entre ellos (cooperación, conflicto, polarización)."
    },
    {
        question: "¿Qué caracteriza a un sistema de 'partido predominante'?",
        options: [
            "Un sistema de partido único donde la oposición está prohibida por ley y el partido gobernante controla todos los aspectos del Estado y la sociedad.",
            "Un sistema donde un partido gana elecciones consecutivas por un amplio margen en un contexto de competencia libre y justa.",
            "Un sistema bipartidista donde uno de los dos partidos principales ha logrado mantener la hegemonía durante un ciclo electoral, pero se espera alternancia.",
            "Un sistema multipartidista fragmentado donde un partido, a pesar de tener una minoría de votos, logra formar gobierno debido a la división de la oposición."
        ],
        answer: 1,
        explanation: "En un sistema de partido predominante, existe competencia democrática y otros partidos son legales, pero un único partido logra ganar elección tras elección de manera continua, gobernando por largos períodos."
    },
    {
        question: "Malamud menciona la 'crisis de los partidos políticos'. ¿A qué se refiere?",
        options: [
            "A la creciente dificultad de los partidos para financiar sus campañas electorales debido a regulaciones más estrictas sobre el financiamiento privado.",
            "A la disminución de la confianza ciudadana, la caída en la afiliación y la pérdida de su rol central como intermediarios entre la sociedad y el Estado.",
            "A los intensos conflictos ideológicos y las luchas por el liderazgo que fragmentan a los partidos internamente y les impiden formar gobiernos estables.",
            "A la incapacidad de los partidos tradicionales para ganar elecciones frente a la emergencia de nuevos movimientos sociales y líderes 'outsiders'."
        ],
        answer: 1,
        explanation: "La crisis de los partidos se manifiesta en la desconfianza ciudadana, la caída del número de afiliados, la volatilidad del voto y la emergencia de líderes 'outsiders', lo que sugiere un debilitamiento de su función de representación."
    },
    {
        question: "¿Qué es la 'ley de hierro de la oligarquía' de Robert Michels, aplicada a los partidos?",
        options: [
            "Una norma legal que exige que los partidos políticos tengan una estructura interna jerárquica y centralizada para poder ser registrados oficialmente.",
            "El principio de que toda organización, incluidos los partidos, tiende a ser dominada por una pequeña élite de líderes que se perpetúa en el poder.",
            "La teoría de que los partidos con una ideología más rígida y 'de hierro' son más exitosos electoralmente que los partidos más flexibles y pragmáticos.",
            "La idea de que los partidos, al entrar en contacto con el poder del Estado ('de hierro'), inevitablemente se corrompen y abandonan sus principios originales."
        ],
        answer: 1,
        explanation: "Michels argumentó que, debido a la necesidad de organización y especialización, toda organización compleja, incluso los partidos socialistas que buscan la democracia, desarrolla una tendencia inevitable hacia el gobierno de una pequeña élite (oligarquía)."
    },
    {
        question: "¿Cuál es la principal diferencia entre un partido 'de cuadros' (o de notables) y un partido 'de masas'?",
        options: [
            "Los partidos de cuadros operan en sistemas presidencialistas, mientras que los partidos de masas son típicos de los sistemas parlamentarios.",
            "Los partidos de masas tienen una ideología mucho más radical y revolucionaria que los partidos de cuadros, que son inherentemente conservadores.",
            "Los partidos de cuadros surgen para competir en elecciones, mientras que los partidos de masas surgen para organizar revoluciones y tomar el poder por la fuerza.",
            "Los de cuadros se basan en una élite de notables con recursos propios, mientras que los de masas se financian y movilizan a través de una amplia base de afiliados."
        ],
        answer: 3,
        explanation: "Los partidos de cuadros (siglo XIX) estaban compuestos por élites con recursos propios y no necesitaban una gran base. Los partidos de masas (siglo XX) se construyeron sobre una gran organización de afiliados que aportaban recursos y legitimidad."
    },
    {
        question: "¿Qué significa que los partidos 'estructuran el voto'?",
        options: [
            "Que los partidos diseñan el sistema electoral y la distribución de distritos para maximizar sus posibilidades de obtener escaños (gerrymandering).",
            "Que ofrecen a los votantes etiquetas y programas claros que simplifican la decisión electoral, actuando como atajos informativos.",
            "Que a través de sus redes clientelares, los partidos controlan el voto de grandes segmentos de la población a cambio de favores y bienes.",
            "Que los partidos deciden de antemano quiénes serán los ganadores de la elección, convirtiendo el voto en un mero ritual sin consecuencias reales."
        ],
        answer: 1,
        explanation: "Al presentar plataformas y candidatos identificables, los partidos reducen la complejidad de la política para los votantes, ofreciendo 'atajos informativos' que ayudan a tomar una decisión sin necesidad de ser un experto en cada tema."
    },
    {
        question: "Según el texto de Malamud, ¿qué es la 'volatilidad electoral'?",
        options: [
            "La fluctuación en el nivel de participación electoral (abstención) entre una elección y la siguiente, que mide el interés ciudadano en la política.",
            "La transferencia neta de votos entre partidos de una elección a otra, que mide la estabilidad de las lealtades partidarias.",
            "La tendencia de los votantes a cambiar de opinión varias veces durante una misma campaña electoral, según los debates y la propaganda.",
            "El grado de incertidumbre en las encuestas de opinión pública, que dificulta la predicción de los resultados electorales."
        ],
        answer: 1,
        explanation: "La volatilidad electoral es una medida del cambio en las preferencias de los votantes entre elecciones. Una alta volatilidad indica que los votantes cambian su voto de un partido a otro con facilidad, lo que sugiere un sistema de partidos poco estable."
    },
    {
        question: "¿Qué es un 'sistema bipartidista'?",
        options: [
            "Un sistema donde la constitución prohíbe la existencia de más de dos partidos, como ocurre en algunos regímenes autoritarios.",
            "Un sistema donde dos partidos principales tienen una probabilidad realista de ganar y formar gobierno, aunque existan otros partidos menores.",
            "Un sistema político que está dividido en dos grandes coaliciones ideológicas (izquierda y derecha), cada una compuesta por múltiples partidos.",
            "Un sistema parlamentario donde el poder ejecutivo (gabinete) está compuesto por ministros de dos partidos diferentes que forman una gran coalición."
        ],
        answer: 1,
        explanation: "Un sistema es bipartidista no solo por el número de partidos, sino porque la competencia se estructura en torno a dos grandes partidos que dominan la escena política y se alternan en el gobierno, como en el caso de Estados Unidos o el Reino Unido históricamente."
    },
    {
        question: "¿A qué se refiere el clivaje (cleavage) 'centro-periferia' en la formación de partidos?",
        options: [
            "Al conflicto entre los partidos que apoyan un modelo económico centralizado y planificado versus los que defienden el libre mercado y la iniciativa privada.",
            "A la tensión entre una cultura nacional estandarizadora impulsada por el Estado central y las culturas de regiones con identidades distintas.",
            "A la división geográfica del voto entre las grandes ciudades (centro) y las zonas rurales y pequeños pueblos (periferia).",
            "Al conflicto en la política internacional entre los países centrales (desarrollados) y los países periféricos (en desarrollo)."
        ],
        answer: 1,
        explanation: "El clivaje centro-periferia, identificado por Lipset y Rokkan, describe el conflicto histórico entre la cultura dominante de un Estado-nación en construcción y las culturas de regiones periféricas con identidades, lenguas o religiones distintas."
    },
    {
        question: "¿Cuál es la función de 'gobierno' de los partidos políticos?",
        options: [
            "Actuar como principal canal de oposición y crítica a las políticas implementadas por el gobierno de turno, fiscalizando sus acciones.",
            "Una vez que ganan las elecciones, ocupar los cargos públicos, dirigir el aparato del Estado y llevar a cabo su programa político.",
            "Representar los intereses de sus afiliados y votantes ante el Estado, actuando como un grupo de presión para obtener beneficios particulares.",
            "Educar a la ciudadanía en los valores democráticos y fomentar la participación política más allá de los períodos electorales."
        ],
        answer: 1,
        explanation: "Una de las funciones primordiales de un partido que gana las elecciones es formar el gobierno, ocupar los puestos clave en el poder ejecutivo y llevar a cabo su programa político desde el control del aparato estatal."
    },
    {
        question: "¿Qué es un 'partido catch-all' o 'atrapa-todo'?",
        options: [
            "Un partido con una estructura organizativa muy laxa y descentralizada, que permite la coexistencia de múltiples facciones con ideologías contradictorias.",
            "Un partido que modera su ideología para atraer a un electorado amplio y diverso, restando importancia a los clivajes sociales tradicionales.",
            "Un partido populista que busca 'atrapar' el descontento popular con un discurso anti-establishment y la promesa de soluciones rápidas y radicales.",
            "Un partido que se financia a través de una amplia red de pequeñas donaciones individuales, 'atrapando' recursos de toda la sociedad."
        ],
        answer: 1,
        explanation: "El concepto de Otto Kirchheimer describe partidos que, en la era de la televisión y el declive de los clivajes de clase, suavizan sus posturas ideológicas para apelar a un espectro de votantes lo más amplio posible."
    }
]

        // Simulación para llegar a 80 preguntas
        while (allQuestions.length < 80) {
            const sampleQuestion = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            const newQuestion = JSON.parse(JSON.stringify(sampleQuestion)); // Deep copy
            newQuestion.question = newQuestion.question.replace("?", " (reformulación)?");
            allQuestions.push(newQuestion);
        }

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 60 * 60; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            timeRemaining = 60 * 60;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });

            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
