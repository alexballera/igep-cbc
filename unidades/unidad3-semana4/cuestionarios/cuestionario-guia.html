    <script>
        const allQuestions = [
    {
        question: "Según Fitoussi, ¿cuál es la tensión principal entre la lógica del mercado y la lógica de la democracia?",
        options: [
            "El mercado opera bajo un principio de eficiencia (a cada uno según su contribución), mientras que la democracia se rige por un principio de igualdad (una persona, un voto).",
            "El mercado tiende a la globalización y a la desterritorialización, mientras que la democracia está anclada al concepto de Estado-nación y soberanía territorial.",
            "El mercado fomenta la competencia y el individualismo para maximizar ganancias, mientras que la democracia requiere cooperación y deliberación para construir el bien común.",
            "El mercado se enfoca en la creación de riqueza material a corto plazo, mientras que la democracia se preocupa por valores no materiales y la sostenibilidad a largo plazo."
        ],
        answer: 0,
        explanation: "Fitoussi argumenta que la tensión fundamental radica en que el mercado opera bajo un principio de eficiencia (a cada uno según su contribución), mientras que la democracia opera bajo un principio de igualdad (un hombre, un voto)."
    },
    {
        question: "¿Qué son las 'instituciones extractivas' según la definición de Acemoglu y Robinson que retoma Volker?",
        options: [
            "Instituciones económicas que se especializan en la extracción y exportación de recursos naturales, como la minería o el petróleo, como base del desarrollo.",
            "Instituciones políticas y económicas diseñadas para extraer rentas de un subconjunto de la sociedad para beneficiar a una pequeña élite.",
            "Instituciones que promueven la inversión extranjera directa para extraer capital y tecnología, sacrificando la autonomía económica nacional.",
            "Instituciones que garantizan la máxima extracción de impuestos por parte del Estado para financiar un amplio estado de bienestar y servicios públicos."
        ],
        answer: 1,
        explanation: "Las instituciones extractivas (tanto políticas como económicas) están diseñadas para concentrar el poder y la riqueza en manos de una pequeña élite, extrayendo recursos del resto de la sociedad."
    },
    {
        question: "¿Por qué Fitoussi critica el modelo de equilibrio general walrasiano?",
        options: [
            "Porque su complejidad matemática lo hace inaplicable para los economistas y 'policy-makers' que deben tomar decisiones en el mundo real.",
            "Porque el modelo no incorpora variables como la cultura o la ideología, que son fundamentales para entender las decisiones económicas de los agentes.",
            "Porque asume un 'subastador' benevolente que no existe en la realidad y, por lo tanto, no puede explicar los desequilibrios como el desempleo.",
            "Porque fue diseñado para economías capitalistas avanzadas y no es útil para analizar los problemas de los países en desarrollo o las economías emergentes."
        ],
        answer: 2,
        explanation: "La crítica de Fitoussi se centra en que el modelo walrasiano es un caso ideal que no representa el funcionamiento real de los mercados, ya que postula un 'subastador' ficticio que coordina los precios y no aborda los problemas de desequilibrio y desempleo."
    },
    {
        question: "En contraste con las extractivas, ¿qué características tienen las 'instituciones inclusivas' según Volker?",
        options: [
            "Fomentan la participación de la mayoría de la población en las actividades económicas y políticas, garantizando derechos de propiedad y oportunidades.",
            "Están controladas por un Estado autoritario pero desarrollista, que impone la inclusión económica desde arriba para acelerar el crecimiento.",
            "Priorizan la inclusión de grupos minoritarios a través de políticas de acción afirmativa, aunque esto pueda generar ineficiencias en el mercado.",
            "Promueven la inclusión de un país en la economía global a través del libre comercio y la apertura de mercados, sin importar la distribución interna del poder."
        ],
        answer: 0,
        explanation: "Las instituciones inclusivas se caracterizan por distribuir el poder político de forma pluralista y garantizar derechos de propiedad y oportunidades económicas para una amplia mayoría de la población, fomentando así la inversión y el crecimiento."
    },
    {
        question: "¿Cuál es el rol del Estado en la economía según la perspectiva de Fitoussi?",
        options: [
            "El Estado debe limitarse a sus funciones mínimas (Estado gendarme), como garantizar la seguridad y la defensa, dejando toda la actividad económica al mercado.",
            "El Estado debe poseer y gestionar los medios de producción para asegurar una distribución equitativa de la riqueza y eliminar la explotación del mercado.",
            "El Estado debe intervenir activamente para corregir las fallas del mercado, redistribuir la riqueza y proveer bienes públicos para asegurar la cohesión social.",
            "El rol del Estado es crear y expandir mercados, privatizando empresas públicas y desregulando la economía para fomentar la competencia global."
        ],
        answer: 2,
        explanation: "Fitoussi defiende una visión donde el Estado tiene un rol activo para corregir las externalidades negativas del mercado, redistribuir la riqueza para garantizar la justicia social y proveer bienes públicos que el mercado no ofrece eficientemente."
    },
    {
        question: "Volker analiza el caso argentino. ¿Qué tipo de instituciones predominaron durante el modelo agroexportador?",
        options: [
            "Instituciones económicas inclusivas, que permitieron un rápido crecimiento, combinadas con instituciones políticas también inclusivas basadas en el sufragio universal.",
            "Instituciones económicas extractivas, basadas en la renta agraria, pero con un sistema político inclusivo que permitía la competencia y la alternancia.",
            "Instituciones económicas inclusivas, abiertas a la inmigración y la inversión, pero controladas por un sistema político extractivo y oligárquico.",
            "Tanto las instituciones políticas como las económicas eran de tipo extractivo, diseñadas para beneficiar a la élite terrateniente que controlaba el poder."
        ],
        answer: 3,
        explanation: "Volker argumenta que durante el modelo agroexportador, Argentina tenía instituciones políticas extractivas (una élite terrateniente controlaba el poder) que crearon instituciones económicas extractivas para capturar las rentas de la tierra."
    },
    {
        question: "¿Qué es la 'hipótesis de la complementariedad' de Fitoussi?",
        options: [
            "Que el mercado y la democracia son sistemas fundamentalmente opuestos y su coexistencia siempre genera crisis económicas y políticas.",
            "Que la democracia debe complementar su legitimidad popular con un comité de expertos (tecnócratas) que tomen las decisiones económicas importantes.",
            "Que el mercado y la democracia, a pesar de sus lógicas distintas (eficiencia vs. igualdad), se necesitan y refuerzan mutuamente para una sociedad justa.",
            "Que las políticas de libre mercado son un complemento necesario para cualquier régimen político, sea democrático o autoritario, que busque el crecimiento."
        ],
        answer: 2,
        explanation: "Fitoussi sostiene que, a pesar de sus lógicas distintas, el mercado y la democracia son complementarios. El mercado genera riqueza y la democracia la legitima y redistribuye, corrigiendo las desigualdades que el mercado puede producir."
    },
    {
        question: "Según Volker, ¿cuál es una de las principales causas del estancamiento económico en países con instituciones extractivas?",
        options: [
            "La falta de recursos naturales o una dotación de factores desfavorable, que impide el desarrollo de industrias competitivas a nivel internacional.",
            "La resistencia de la élite al cambio tecnológico y a la 'destrucción creativa', ya que la innovación puede amenazar su poder político y económico.",
            "El exceso de intervención estatal y regulación económica, que ahoga la iniciativa privada y genera ineficiencia y corrupción generalizadas.",
            "La cultura de la población, que puede ser reacia al trabajo duro, al ahorro y al espíritu emprendedor necesarios para el desarrollo capitalista."
        ],
        answer: 1,
        explanation: "En sistemas con instituciones extractivas, las élites en el poder a menudo bloquean la innovación y la competencia (la 'destrucción creativa' de Schumpeter) porque las nuevas tecnologías y empresas pueden amenazar su poder político y económico."
    },
    {
        question: "Fitoussi advierte sobre los riesgos de la intervención estatal. ¿Cuál es uno de ellos?",
        options: [
            "Que el Estado, al intervenir, siempre termina siendo más eficiente que el mercado, lo que lleva a la eliminación de la iniciativa privada y la innovación.",
            "Que la intervención puede generar burocracia, ineficiencia y ser 'capturada' por grupos de interés que la desvían para su propio beneficio.",
            "Que el Estado carece de los recursos financieros y técnicos necesarios para intervenir eficazmente en una economía de mercado compleja y globalizada.",
            "Que toda intervención estatal, por definición, reduce la libertad individual y conduce inevitablemente a un régimen autoritario o totalitario."
        ],
        answer: 1,
        explanation: "Aunque defiende la intervención, Fitoussi reconoce sus riesgos, como la posibilidad de que el gobierno actúe de forma ineficiente, cree regulaciones excesivas o que sus políticas sean 'capturadas' por grupos de interés que las usan para su propio beneficio."
    },
    {
        question: "¿Qué es el 'círculo vicioso' de las instituciones extractivas?",
        options: [
            "Un ciclo en el que el bajo crecimiento económico genera descontento social, lo que a su vez provoca inestabilidad política y desalienta la inversión.",
            "Un proceso donde las instituciones políticas extractivas refuerzan a las económicas extractivas, y la riqueza generada se usa para consolidar el poder de la élite.",
            "Un ciclo de crisis de deuda externa, donde los países piden préstamos para financiar el gasto público y luego deben aplicar ajustes que generan más crisis.",
            "Un proceso en el que la democracia se debilita, dando lugar a un gobierno autoritario, que luego colapsa y es reemplazado por una democracia frágil."
        ],
        answer: 1,
        explanation: "El círculo vicioso describe cómo las instituciones políticas extractivas (poder concentrado) crean instituciones económicas extractivas (para extraer riqueza), y la riqueza obtenida se usa para consolidar aún más el poder de la élite, haciendo el sistema muy persistente."
    },
    {
        question: "¿Por qué la democracia puede ser vista como una 'amenaza' para el mercado?",
        options: [
            "Porque los votantes pueden demandar políticas de redistribución (impuestos, regulaciones) que afecten los derechos de propiedad y la eficiencia económica.",
            "Porque los líderes democráticos, al depender de la opinión pública, carecen de la capacidad para tomar decisiones económicas difíciles y a largo plazo.",
            "Porque la democracia, al promover la igualdad, es incompatible con la existencia de empresas privadas y la acumulación de capital.",
            "Porque la competencia electoral y el debate público generan un clima de incertidumbre que es perjudicial para la confianza de los inversores."
        ],
        answer: 0,
        explanation: "Desde una perspectiva puramente de mercado, la democracia puede ser una amenaza porque la mayoría puede votar por políticas (altos impuestos, regulaciones, expropiaciones) que redistribuyan la riqueza, lo que podría afectar los incentivos a invertir y la eficiencia económica."
    },
    {
        question: "¿Qué papel juega la 'historia' en el análisis institucional de North, retomado por Volker?",
        options: [
            "La historia es una fuente de lecciones y ejemplos, pero no tiene un efecto causal directo sobre las instituciones presentes, que se explican por factores actuales.",
            "La historia determina de forma inevitable el futuro de un país; las naciones que fueron pobres en el pasado están condenadas a seguir siéndolo.",
            "Las decisiones institucionales del pasado crean una 'dependencia de la trayectoria' (path dependence) que condiciona y limita las opciones de desarrollo futuro.",
            "La historia es importante solo en la medida en que moldea la cultura y los valores de una sociedad, que son los verdaderos determinantes del desarrollo."
        ],
        answer: 2,
        explanation: "El concepto de 'path dependence' es central. Sostiene que las decisiones institucionales tomadas en el pasado limitan las opciones disponibles en el presente, haciendo que sea muy difícil cambiar de rumbo, incluso si el camino actual es ineficiente."
    },
    {
        question: "¿Cómo puede el mercado 'fortalecer' a la democracia, según Fitoussi?",
        options: [
            "Al generar crecimiento económico y una clase media independiente del Estado, con recursos y autonomía para organizarse y demandar derechos políticos.",
            "Al permitir que las grandes corporaciones financien las campañas de los partidos políticos, asegurando la elección de líderes competentes y pro-mercado.",
            "Al crear una cultura de competencia individualista que reemplaza los lazos comunitarios y religiosos, considerados obstáculos para la democracia moderna.",
            "Al eliminar la necesidad de un gobierno a través de la autorregulación, lo que permite una forma de democracia directa y sin intermediarios."
        ],
        answer: 0,
        explanation: "El desarrollo de una economía de mercado puede fortalecer la democracia al crear una esfera de poder económico difusa e independiente del Estado, y al dar lugar a una clase media con intereses y recursos propios para organizarse y demandar derechos políticos."
    },
    {
        question: "¿Cuál es la diferencia fundamental entre instituciones políticas y económicas?",
        options: [
            "Las instituciones políticas son creadas por el Estado (top-down), mientras que las económicas surgen espontáneamente del mercado (bottom-up).",
            "Las políticas determinan cómo se distribuye y ejerce el poder en la sociedad, mientras que las económicas estructuran la producción, el intercambio y la distribución.",
            "Las instituciones políticas son siempre formales (constituciones, leyes), mientras que las económicas son mayormente informales (costumbres, normas sociales).",
            "Las instituciones políticas se ocupan de la guerra y la paz, mientras que las económicas se ocupan de la riqueza y la pobreza; no hay conexión entre ellas."
        ],
        answer: 1,
        explanation: "Las instituciones políticas (ej. la constitución, el sistema electoral) definen quién tiene el poder y cómo se ejerce. Las instituciones económicas (ej. leyes de propiedad, regulaciones bancarias) definen las reglas del juego para la producción y el intercambio."
    },
    {
        question: "¿Qué problema potencial identifica Fitoussi con la 'asignación democrática de recursos'?",
        options: [
            "Que es un proceso inherentemente lento e ineficiente en comparación con la velocidad y la racionalidad con que el mercado asigna los recursos.",
            "Que puede llevar a la 'tiranía de la mayoría', donde se toman decisiones que, aunque populares, son económicamente insostenibles o perjudican a las minorías.",
            "Que los ciudadanos comunes carecen del conocimiento técnico necesario para tomar decisiones económicas complejas, lo que conduce a resultados subóptimos.",
            "Que la deliberación democrática sobre la economía siempre conduce a un aumento del gasto público, la inflación y el déficit fiscal."
        ],
        answer: 1,
        explanation: "El autor advierte que una lógica puramente democrática (de mayoría) en la asignación de recursos puede llevar a decisiones que, aunque populares, sean económicamente ineficientes o que vulneren los derechos de las minorías, generando inestabilidad."
    }
];

        // Simulación para llegar a 80 preguntas
        while (allQuestions.length < 80) {
            const sampleQuestion = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            const newQuestion = JSON.parse(JSON.stringify(sampleQuestion)); // Deep copy
            newQuestion.question = newQuestion.question.replace("?", " (reformulación)?");
            allQuestions.push(newQuestion);
        }

        let quizzes = [];
        let currentQuiz;
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 60 * 60; // 60 minutos en segundos
        let timerInterval;

        const quizSelectionScreen = document.getElementById('quiz-selection-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-button');
        const feedbackMessage = document.getElementById('feedback-message');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
            }
            
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            timeRemaining = 60 * 60;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            startTimer();
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining <= 300) {
                document.getElementById('timer').classList.add('text-red-600');
                document.getElementById('timer').classList.remove('text-blue-600');
            }
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });

            const progress = ((currentQuestionIndex + 1) / currentQuiz.questions.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
