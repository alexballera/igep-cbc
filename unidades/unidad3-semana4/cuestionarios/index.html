    <script>
        const allQuestions = [
            {
                question: "Según Fitoussi, ¿cuál es la principal tensión fundamental entre la democracia y el mercado?",
                options: ["El mercado prioriza eficiencia mientras la democracia busca igualdad", "Ambos sistemas buscan lo mismo", "La democracia siempre es ineficiente", "El mercado garantiza igualdad automáticamente"],
                answer: 0,
                explanation: "Fitoussi identifica que el mercado se enfoca en la eficiencia económica sin garantizar igualdad, mientras la democracia prioriza la igualdad y redistribución, lo que puede entrar en tensión con la eficiencia pura del mercado."
            },
            {
                question: "¿Cómo define Douglass North a las instituciones en el marco teórico de Volker?",
                options: ["Como organizaciones empresariales", "Como las reglas del juego que estructuran incentivos en el intercambio humano", "Como sistemas económicos perfectos", "Como mecanismos de control social únicamente"],
                answer: 1,
                explanation: "North define las instituciones como 'las reglas del juego en la sociedad' que 'moldean la interacción humana' y 'estructuran incentivos en el intercambio humano, ya sea político, social o económico'."
            },
            {
                question: "Según Acemoglu y Robinson, ¿qué caracteriza a las instituciones económicas inclusivas?",
                options: ["Concentran poder en élites", "Fomentan participación amplia, derechos de propiedad y libre entrada de empresas", "Extraen recursos para beneficiar a pocos", "Limitan la competencia económica"],
                answer: 1,
                explanation: "Las instituciones económicas inclusivas 'fomentan la participación de la gran mayoría de las personas en actividades económicas', ofrecen 'seguridad de la propiedad privada' y 'permiten la entrada de nuevas empresas'."
            },
            {
                question: "¿Por qué Fitoussi critica la visión del 'equilibrio walrasiano' en la teoría económica?",
                options: ["Es demasiado matemático", "No ha logrado probar que sus resultados sean favorables para la supervivencia de la población", "Es muy antiguo", "No considera la inflación"],
                answer: 1,
                explanation: "Fitoussi critica que la teoría del equilibrio walrasiano 'no ha logrado probar que sus resultados sean favorables para la supervivencia de la población' e ignora 'la extrema pobreza, la falta de cuidados y la ausencia de supervivencia'."
            },
            {
                question: "En el análisis de instituciones extractivas, ¿cuál es su principal objetivo según Acemoglu y Robinson?",
                options: ["Promover el desarrollo general", "Capturar rentas y riquezas de un subconjunto de la sociedad para beneficiar a un subconjunto distinto", "Fomentar la innovación", "Garantizar derechos igualitarios"],
                answer: 1,
                explanation: "Las instituciones extractivas 'tienen como objetivo capturar rentas y riquezas de un subconjunto de la sociedad para beneficiar a un subconjunto distinto', concentrando el poder y limitando el acceso a oportunidades."
            },
            {
                question: "¿Qué papel fundamental asigna Fitoussi a la intervención estatal en la economía de mercado?",
                options: ["Debe ser mínima y no interferir", "Corregir las fallas del mercado y asegurar el bienestar social", "Solo regular precios", "Controlar únicamente la moneda"],
                answer: 1,
                explanation: "Fitoussi defiende que 'la intervención estatal es necesaria para corregir las fallas del mercado y asegurar el bienestar social', salvaguardando la 'res publica' y garantizando derechos fundamentales."
            },
            {
                question: "Según la teoría de North, ¿cuál es la diferencia clave entre instituciones formales e informales?",
                options: ["No hay diferencia real", "Las formales son constituciones y leyes; las informales son normas sociales y costumbres", "Las informales son más importantes", "Las formales cambian más rápido"],
                answer: 1,
                explanation: "Las instituciones formales 'son las constituciones, los códigos, las leyes', mientras que las informales 'pueden ser extensiones, interpretaciones y modificaciones de reglas formales, normas de comportamiento social' que provienen de 'costumbres, tradiciones y cultura'."
            },
            {
                question: "¿Qué significa el concepto de 'democracia como bien de lujo' según Robert Barro, citado por Fitoussi?",
                options: ["Es accesible para todos", "Los países ricos pueden permitirse más democracia aun si reduce el crecimiento", "La democracia es innecesaria", "Solo los pobres necesitan democracia"],
                answer: 1,
                explanation: "Barro sugiere que 'los países ricos consumen más democracia porque ese bien es deseable por sí mismo, aun cuando el incremento de las libertades políticas pueda tener algún efecto desfavorable sobre el crecimiento'."
            },
            {
                question: "¿Cómo explican los costos de transacción la importancia de las instituciones según North?",
                options: ["Las instituciones los eliminan completamente", "Las instituciones efectivas reducen costos de transacción y aumentan beneficios de cooperación", "No hay relación entre ambos", "Solo importan en economías desarrolladas"],
                answer: 1,
                explanation: "Según North, 'las instituciones efectivas aumentan los beneficios de una solución cooperativa' y determinan 'el costo de hacer una transacción', siendo críticas porque 'los costos de transacción resultan un factor crítico del rendimiento económico'."
            },
            {
                question: "¿Qué implica la 'tesis de la complementariedad' entre mercado y democracia que propone Fitoussi?",
                options: ["Son sistemas incompatibles", "Se refuerzan mutuamente: el mercado aporta eficiencia y la democracia corrige sus deficiencias", "Uno debe dominar al otro", "Solo funcionan por separado"],
                answer: 1,
                explanation: "La tesis sostiene que 'el mercado y la democracia se refuerzan mutuamente' donde 'el mercado proporciona eficiencia económica' y 'la democracia, a través de la intervención estatal, corrige sus deficiencias, asegura la igualdad y el bienestar social'."
            },
            {
                question: "Según Volker, ¿por qué existe 'persistencia institucional' en las instituciones extractivas?",
                options: ["Son más eficientes", "Crean círculos viciosos donde las élites mantienen poder y beneficios concentrados", "Son más populares", "Cambian constantemente"],
                answer: 1,
                explanation: "Las instituciones extractivas persisten porque 'crean pocos límites al ejercicio del poder' y 'implican que se puedan lograr grandes beneficios y riqueza con el mero control del poder', generando círculos viciosos de concentración de poder."
            },
            {
                question: "¿Cómo aborda Fitoussi el problema de la globalización y su efecto en la democracia?",
                options: ["La globalización fortalece automáticamente la democracia", "La globalización crea ganadores y perdedores, requiriendo el 'principio de compensación'", "No hay relación entre globalización y democracia", "La globalización elimina la necesidad de democracia"],
                answer: 1,
                explanation: "Fitoussi argumenta que la globalización genera 'ganadores y perdedores sistemáticos' y propone el 'principio de compensación' donde 'las ganancias de unos sean parcialmente utilizadas para compensar las pérdidas de otros' para mantener la cohesión social."
            },
            {
                question: "¿Qué función 'regulativa' cumplen las instituciones según el análisis de Alonso citado por Volker?",
                options: ["Solo coordinan actividades", "Imponen restricciones al comportamiento social a través de reglas y sanciones", "Eliminan toda restricción", "Solo proporcionan información"],
                answer: 1,
                explanation: "La función regulativa significa que 'las instituciones imponen restricciones al comportamiento social a través de las reglas y las sanciones', estableciendo límites y normas que guían la conducta social y económica."
            },
            {
                question: "Según la hipótesis institucional de Acemoglu y Robinson, ¿por qué las instituciones son la causa fundamental del desarrollo diferencial?",
                options: ["Porque son exógenas", "Porque determinan incentivos para innovar, invertir y participar en actividad económica", "Porque son invariables", "Porque dependen solo de la geografía"],
                answer: 1,
                explanation: "Las instituciones son 'la causa fundamental de los diferentes patrones de crecimiento económico' porque determinan si 'alientan a la gente a innovar, a correr riesgos, a ahorrar para el futuro' y si 'respetan los derechos de propiedad' y ofrecen 'igualdad de oportunidades'."
            },
            {
                question: "¿Por qué Fitoussi considera problemática la idea de un 'modelo democrático universal'?",
                options: ["La democracia no funciona en ningún lado", "La diversidad de formas institucionales afecta la eficacia económica y no existe un modelo único óptimo", "Todos los países son idénticos", "Solo hay una forma correcta de democracia"],
                answer: 1,
                explanation: "Fitoussi argumenta que 'la diversidad de las formas institucionales de la democracia de mercado afecta la eficacia económica' y que 'las instituciones más favorables al desarrollo no son uniformes', requiriendo adaptación a circunstancias específicas."
            },
            {
                question: "¿Cómo afectan las instituciones a los costos de transformación según North?",
                options: ["No los afectan", "Con derechos de propiedad inseguros, se adoptan tecnologías de corto plazo con poco capital fijo", "Siempre los reducen", "Solo importan en países pobres"],
                answer: 1,
                explanation: "North explica que 'cuando un sistema institucional define y garantiza pobremente los derechos de propiedad', se traduce en 'utilización de tecnologías que incorporen poco capital fijo y no impliquen acuerdos a largo plazo'."
            },
            {
                question: "¿Qué rol juegan las organizaciones en el cambio institucional según North?",
                options: ["No tienen ningún rol", "Son la fuente primaria de cambio institucional al perseguir sus objetivos", "Solo mantienen el status quo", "Son irrelevantes para las instituciones"],
                answer: 1,
                explanation: "Según North, 'al perseguir sus objetivos, las organizaciones son la fuente primaria de cambio institucional' y 'la competencia obliga a las organizaciones a invertir continuamente en capacidad y conocimientos para sobrevivir'."
            },
            {
                question: "En el análisis de Fitoussi, ¿por qué las 'viejas democracias occidentales' experimentan un 'retroceso pacífico' de la democracia?",
                options: ["Por crisis económicas", "Porque el mercado es considerado 'demasiado serio' para estar bajo influencia política", "Por falta de votantes", "Por exceso de regulación"],
                answer: 1,
                explanation: "Fitoussi identifica que 'el mercado es considerado demasiado serio para estar bajo la influencia de la política', creando 'una forma de gobierno federal que busca eximir al mercado de procedimientos de responsabilidad política'."
            },
            {
                question: "¿Qué caracteriza al 'círculo virtuoso' de las instituciones inclusivas según Acemoglu y Robinson?",
                options: ["Concentran más poder", "Estimulan inversión, aprovechan mercados y generan amplia participación", "Reducen la competencia", "Limitan los derechos de propiedad"],
                answer: 1,
                explanation: "El círculo virtuoso de instituciones inclusivas 'estimula la inversión (dada la existencia de garantías sobre derechos de propiedad)', 'aprovecha el poder de los mercados' y 'genera amplia participación (educación, libre entrada, y derechos de propiedad en sentido amplio)'."
            },
            {
                question: "Según Fitoussi, ¿cómo se relaciona la crítica a la teoría económica tradicional con la 'hipótesis de supervivencia'?",
                options: ["No hay relación", "Las teorías económicas fallan al no garantizar que sus resultados aseguren la subsistencia de toda la población", "La supervivencia es irrelevante", "Solo importa en países desarrollados"],
                answer: 1,
                explanation: "La 'hipótesis de supervivencia' sugiere que 'las teorías del equilibrio general no han logrado demostrar que los resultados favorables puedan obtenerse sin un nivel de supervivencia que asegure la existencia de toda la población'."
            },
            {
                question: "¿Por qué las instituciones políticas 'preceden' a las económicas según Acemoglu y Robinson?",
                options: ["Son más antiguas", "Determinan las reglas que gobiernan incentivos en la política y quién tiene derecho a hacer qué", "Son más simples", "No hay relación causal"],
                answer: 1,
                explanation: "Las instituciones políticas 'son un determinante clave del resultado ya que prevalecen por sobre las económicas, las preceden' porque 'son las reglas que gobiernan los incentivos en la política' y 'determinan cómo se elige el gobierno y quién tiene derecho a hacer qué'."
            },
            {
                question: "¿Cómo analiza Fitoussi el concepto de 'coerción económica' en relación con la democracia?",
                options: ["Es beneficiosa siempre", "La presión económica puede subordinar decisiones políticas en detrimento de protección social", "No existe en democracias", "Solo afecta a dictaduras"],
                answer: 1,
                explanation: "Fitoussi identifica la 'coerción económica' como 'la presión que el mercado y las fuerzas económicas ejercen sobre las decisiones políticas y las sociedades, a menudo en detrimento de la protección social y la igualdad'."
            },
            {
                question: "Según la teoría de los juegos aplicada por North, ¿cuándo es más difícil mantener la cooperación?",
                options: ["Cuando hay pocos jugadores", "Cuando el juego no se repite, hay información incompleta y muchos jugadores", "Cuando todos cooperan", "Cuando hay información perfecta"],
                answer: 1,
                explanation: "North explica que 'es difícil que el juego se mantenga cuando no se repite (o hay un final del juego), cuando se carece de información sobre los otros jugadores, y cuando hay muchos jugadores'."
            },
            {
                question: "¿Qué papel cumple el Estado según North en el marco institucional?",
                options: ["Debe ser mínimo", "Garante de contratos como tercera parte imparcial y proveedor de instituciones que defienden derechos", "Solo controlar la moneda", "Eliminar el mercado"],
                answer: 1,
                explanation: "Según North, 'la importancia del Estado radica en su función de garantizar los contratos entre las partes jugando el papel de una tercera parte imparcial' y 'provee a la sociedad de un conjunto de instituciones que defienden los derechos individuales'."
            },
            {
                question: "En el análisis de recursos naturales e instituciones, ¿qué sugieren Robinson, Torvik y Verdier?",
                options: ["Los recursos siempre benefician el desarrollo", "Los políticos tienden a sobreexplotar recursos naturales debido a altas tasas de descuento intertemporal", "Los recursos son irrelevantes", "Solo importa la cantidad de recursos"],
                answer: 1,
                explanation: "Robinson, Torvik y Verdier 'sugieren que los políticos tienden a sobreexplotar los recursos naturales porque tienen altas tasas de descuento intertemporal' ya que 'el boom los habilita a gastar más para aumentar su probabilidad de mantenerse en el poder'."
            },
            {
                question: "¿Cómo caracteriza Fitoussi la relación entre democracia y prevención de hambrunas según Amartya Sen?",
                options: ["No hay relación", "La democracia no genera escasez de alimentos debido a prensa libre y debate público", "Solo las dictaduras previenen hambrunas", "La democracia siempre genera escasez"],
                answer: 1,
                explanation: "Fitoussi cita que 'los trabajos de Amartya Sen concluyen que la democracia no genera escasez de alimentos, en igualdad de condiciones' debido a 'la existencia de una prensa libre y un debate público parlamentario que obliga al gobierno a actuar'."
            },
            {
                question: "Según el análisis institucional, ¿por qué pueden fracasar las prácticas de 'trasplante institucional'?",
                options: ["Son muy costosas", "Las instituciones son endógenas y dependen del contexto específico de cada sociedad", "Siempre funcionan bien", "Solo por problemas técnicos"],
                answer: 1,
                explanation: "Las prácticas de 'trasplante institucional no resultan efectivas' porque las instituciones 'son endógenas, están determinadas por las sociedades de cada país' y 'no existen instituciones óptimas de carácter universal, se debe buscar entre las diversas alternativas, dependiendo del contexto'."
            },
            {
                question: "¿Qué implicaciones tiene el concepto de 'economías de enclave' en relación con instituciones extractivas?",
                options: ["Siempre promueven desarrollo", "Generan pocas conexiones con el resto de la economía y no producen modernización social que propicie democracia", "Son irrelevantes", "Solo existen en países desarrollados"],
                answer: 1,
                explanation: "Las 'economías de enclave' son problemáticas porque 'no tiendan a producir el tipo de modernización social que propicia la democracia, por ejemplo, una diversificación ocupacional, con una clase media profesional relativamente grande'."
            },
            {
                question: "¿Cómo explica North la evolución incremental de las instituciones?",
                options: ["Cambian abruptamente", "Evolucionan gradualmente estableciendo conexión entre presente y futuro", "No evolucionan nunca", "Solo cambian por revoluciones"],
                answer: 1,
                explanation: "North explica que las instituciones 'evolucionan de manera incremental, estableciendo una conexión entre el presente y el futuro; en consecuencia, la historia es principalmente un relato de la evolución institucional'."
            },
            {
                question: "Según Fitoussi, ¿qué problemas genera la subordinación de políticas económicas a mercados financieros globales?",
                options: ["Mejora la eficiencia siempre", "Reduce capacidad gubernamental para políticas redistributivas y genera mayor inseguridad económica", "No genera problemas", "Solo afecta países pobres"],
                answer: 1,
                explanation: "Esta subordinación 'reduce la capacidad de los gobiernos nacionales para implementar políticas redistributivas y de protección social' y 'lleva a una mayor inseguridad económica', requiriendo mecanismos de compensación para mantener cohesión social."
            },
            {
                question: "¿Qué caracteriza a las instituciones políticas 'pluralistas' versus 'absolutistas' según Acemoglu y Robinson?",
                options: ["No hay diferencia", "Las pluralistas distribuyen poder ampliamente con restricciones; las absolutistas concentran poder sin límites", "Las absolutistas son más eficientes", "Solo importa el nombre"],
                answer: 1,
                explanation: "Las instituciones políticas absolutistas tienen 'distribución de poder estrecha y sin restricciones', mientras que las pluralistas 'distribuyen el poder en la sociedad en general y están sometidas a restricciones'."
            },
            {
                question: "¿Cómo aborda Fitoussi el dilema entre eficiencia económica y justicia social?",
                options: ["Son incompatibles", "La intervención estatal puede equilibrar ambos objetivos mediante regulación y redistribución", "Solo importa la eficiencia", "Solo importa la justicia"],
                answer: 1,
                explanation: "Fitoussi propone que 'la intervención estatal es necesaria para lograr un equilibrio entre la eficiencia económica y la justicia social, mitigando las deficiencias del mercado' a través de regulación, redistribución y provisión de bienes públicos."
            },
            {
                question: "Según el análisis de Volker, ¿qué papel juegan las 'construcciones mentales' en el cambio institucional?",
                options: ["Son irrelevantes", "Las percepciones derivan de construcciones mentales de los jugadores y dan forma a elecciones que alteran instituciones", "Solo importan factores materiales", "No influyen en las decisiones"],
                answer: 1,
                explanation: "Según North citado por Volker, 'las percepciones derivan de las construcciones mentales de los jugadores' y estas percepciones sobre oportunidades 'darán forma a las elecciones que alterarán en forma incremental a las instituciones'."
            },
            {
                question: "¿Qué función 'cognitiva' cumplen las instituciones según Alonso?",
                options: ["Solo procesan información", "Median entre entorno e individuo permitiéndoles interpretar lo que sucede", "Eliminan la necesidad de pensar", "Solo almacenan datos"],
                answer: 1,
                explanation: "La función cognitiva significa que 'las instituciones median entre el entorno el individuo, permitiéndoles interpretar lo que sucede', proporcionando marcos de referencia para entender y responder al ambiente social y económico."
            },
            {
                question: "¿Cómo analiza Fitoussi la tensión entre soberanía democrática y libertad económica?",
                options: ["No existe tensión", "El equilibrio necesario entre soberanía y libertad limita el espacio público de opciones democráticas", "La soberanía siempre prevalece", "La libertad siempre prevalece"],
                answer: 1,
                explanation: "Fitoussi explica que 'el equilibrio necesario entre soberanía y libertad es lo que limita el espacio público de las opciones' y que 'la democracia solo puede subsistir si el régimen político limita su influencia sobre la transmisión de las rentas y las riquezas'."

        let quizzes = [];

        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const currentQuestionNumberElement = document.getElementById('current-question-number');
        const scoreElement = document.getElementById('score');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackMessage = document.getElementById('feedback-message');
        const nextButton = document.getElementById('next-button');
        const finalScoreElement = document.getElementById('final-score');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuizzes() {
            quizzes = [];
            const quizButtonsContainer = document.querySelector('#quiz-selection-screen .grid');
            quizButtonsContainer.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                shuffleArray(allQuestions);
                const selectedQuestions = allQuestions.slice(0, 20);
                quizzes.push({
                    title: `Examen de Práctica ${i + 1}`,
                    questions: selectedQuestions
                });
                
                const button = document.createElement('button');
                button.onclick = () => startQuiz(i);
                button.className = 'card p-6 text-center gradient-bg text-white font-bold text-xl rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none';
                button.textContent = `Examen de Práctica ${i + 1}`;
                quizButtonsContainer.appendChild(button);
            }
        }

        function startQuiz(quizIndex) {
            currentQuiz = quizzes[quizIndex];
            currentQuestionIndex = 0;
            score = 0;
            
            quizSelectionScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];

            currentQuestionNumberElement.textContent = currentQuestionIndex + 1;
            scoreElement.textContent = score;
            questionElement.textContent = currentQuestionData.question;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            feedbackMessage.innerHTML = '';
            nextButton.disabled = true;

            const options = [...currentQuestionData.options];
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-button', 'block');
                button.onclick = () => checkAnswer(button, index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedIndex) {
            const currentQuestionData = currentQuiz.questions[currentQuestionIndex];
            const correctIndex = currentQuestionData.answer;

            Array.from(optionsContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                feedbackMessage.textContent = '¡Respuesta Correcta!';
                feedbackMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackMessage.innerHTML = `
                    <div class="font-bold mb-2">¡Respuesta Incorrecta!</div>
                    <div class="explanation">
                        <strong class="text-indigo-700">Explicación:</strong>
                        <p class="text-sm mt-1 text-gray-700">${currentQuestionData.explanation}</p>
                    </div>
                `;
                feedbackMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            }

            feedbackMessage.classList.remove('hidden');
            scoreElement.textContent = score;
            nextButton.disabled = false;
            nextButton.focus();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
        }

        function restartQuiz() {
            resultsScreen.classList.add('hidden');
            quizSelectionScreen.classList.remove('hidden');
            generateQuizzes();
        }

        window.onload = function() {
            generateQuizzes();
            quizSelectionScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
